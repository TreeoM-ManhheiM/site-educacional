<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetSim Pro: Topologia & TCP/IP Builder</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;800&display=swap');

        :root {
            --bg-color: #0b1120;
            --panel-bg: #1e293b;
            --accent: #06b6d4;
            --accent-wlan: #3b82f6;
            --danger: #ef4444;
            --success: #10b981;
            --text-light: #f8fafc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background: var(--bg-color);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        #header {
            background: #020617;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            z-index: 100;
            flex-wrap: wrap;
            gap: 10px;
        }
        #header h1 {
            margin: 0;
            font-size: 1.1rem;
            font-family: 'Fira Code', monospace;
            color: var(--accent);
        }

        #toolbar {
            background: var(--panel-bg);
            padding: 8px 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            z-index: 99;
            border-bottom: 1px solid #334155;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            align-items: center;
        }
        .tool-group {
            display: flex;
            gap: 5px;
            border-right: 2px solid #334155;
            padding-right: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .tool-group span {
            color: #94a3b8;
            font-size: 0.6rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-right: 4px;
            letter-spacing: 1px;
        }

        button {
            background: #334155;
            color: white;
            border: 1px solid #475569;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Inter';
            font-size: 0.7rem;
            font-weight: 600;
            transition: 0.2s;
            white-space: nowrap;
        }
        button:hover {
            background: #475569;
            border-color: var(--accent);
        }
        button.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }
        button.danger {
            background: var(--danger);
            border-color: var(--danger);
        }
        button.small {
            padding: 4px 8px;
            font-size: 0.6rem;
        }

        #env-bar {
            background: #020617;
            padding: 5px 15px;
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 98;
            border-bottom: 1px solid #334155;
            flex-wrap: wrap;
            color: #94a3b8;
            font-size: 0.7rem;
        }
        #env-bar select,
        #env-bar input[type="range"] {
            background: #1e293b;
            color: white;
            border: 1px solid #475569;
            border-radius: 4px;
            padding: 4px 8px;
            font-family: 'Inter';
            font-size: 0.7rem;
        }
        #env-bar label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        #workspace {
            flex: 1;
            position: relative;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1.5px, transparent 1.5px);
            background-size: 25px 25px;
            overflow: auto;
            cursor: crosshair;
            -webkit-overflow-scrolling: touch;
        }
        svg#cables-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .cable-lan {
            stroke: #cbd5e1;
            stroke-width: 3;
        }
        .cable-wan {
            stroke: #ef4444;
            stroke-width: 3;
            stroke-dasharray: 10 5;
        }
        .cable-wlan {
            stroke: var(--accent-wlan);
            stroke-width: 2.5;
            stroke-dasharray: 4 6;
            animation: wlanPulse 1s linear infinite;
        }
        .cable-fso {
            stroke: #10b981;
            stroke-width: 1.5;
            stroke-dasharray: 2 4;
            filter: drop-shadow(0 0 4px #10b981);
        }
        .cable-sat {
            stroke: #f59e0b;
            stroke-width: 2;
            stroke-dasharray: 8 4;
        }
        .cable-bt {
            stroke: #f472b6;
            stroke-width: 2;
            stroke-dasharray: 3 3;
        }
        .cable-nfc {
            stroke: #a78bfa;
            stroke-width: 4;
            stroke-dasharray: 1 2;
        }
        @keyframes wlanPulse {
            to {
                stroke-dashoffset: -10;
            }
        }

        .port-label {
            font-family: 'Fira Code', monospace;
            font-size: 9px;
            fill: #fbbf24;
            font-weight: bold;
            text-shadow: 0 0 4px black;
        }

        .obstacle {
            position: absolute;
            background: rgba(239, 68, 68, 0.15);
            border: 2px dashed #ef4444;
            z-index: 5;
            pointer-events: none;
        }

        .coverage-circle {
            fill: rgba(59, 130, 246, 0.08);
            stroke: rgba(59, 130, 246, 0.4);
            stroke-width: 1.5;
            stroke-dasharray: 6 3;
            pointer-events: none;
        }

        .node {
            position: absolute;
            min-width: 55px;
            min-height: 55px;
            background: #1e293b;
            border: 2px solid #475569;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            z-index: 20;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            user-select: none;
            transition: 0.2s;
            padding: 5px;
        }
        .node:active {
            cursor: grabbing;
            transform: scale(0.95);
        }
        .node:hover {
            border-color: var(--accent);
        }
        .node.selected {
            border-color: var(--success);
            box-shadow: 0 0 15px var(--success);
        }
        .node-icon {
            font-size: 22px;
            pointer-events: none;
            margin-bottom: 2px;
        }
        .node-label {
            font-size: 7px;
            font-weight: bold;
            font-family: 'Fira Code';
            color: #cbd5e1;
            pointer-events: none;
            text-align: center;
            line-height: 1.2;
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 4px;
            border-radius: 4px;
            position: absolute;
            bottom: -22px;
            white-space: nowrap;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rssi-tooltip {
            position: fixed;
            background: #0f172a;
            border: 1px solid var(--accent);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-family: 'Fira Code';
            z-index: 2000;
            pointer-events: none;
            display: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }
        .modal {
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            color: white;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal h2 {
            margin-top: 0;
            font-size: 1rem;
            color: var(--accent);
            border-bottom: 2px solid #334155;
            padding-bottom: 8px;
            font-family: 'Fira Code';
        }
        .port-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
            max-height: 250px;
            overflow-y: auto;
        }
        .port-item {
            background: #1e293b;
            padding: 8px;
            border: 1px solid #334155;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Fira Code';
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .port-item:hover {
            background: #334155;
            border-color: var(--accent);
        }
        .port-item.used {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            cursor: not-allowed;
            border-color: #7f1d1d;
        }
        .port-type-badge {
            font-size: 0.6rem;
            padding: 2px 5px;
            border-radius: 4px;
            background: #000;
            text-transform: uppercase;
        }

        .config-interfaces {
            max-height: 55vh;
            overflow-y: auto;
            padding-right: 5px;
        }
        .interface-block {
            border: 1px solid #334155;
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .interface-title {
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 10px;
            font-size: 0.9rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
            font-family: 'Fira Code';
            flex-wrap: wrap;
        }
        .config-row {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
            align-items: center;
            font-family: 'Fira Code';
            font-size: 0.7rem;
            flex-wrap: wrap;
        }
        .config-row label {
            width: 85px;
            color: #94a3b8;
        }
        .config-row input[type="text"],
        .config-row select {
            flex: 1;
            padding: 5px;
            background: #0f172a;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 4px;
            font-family: 'Fira Code';
            outline: none;
            min-width: 80px;
        }
        .config-row input:focus,
        .config-row select:focus {
            border-color: var(--accent);
        }
        .config-row input:disabled {
            background: #334155;
            color: #94a3b8;
            cursor: not-allowed;
            font-style: italic;
        }
        .dhcp-toggle {
            display: flex;
            gap: 12px;
            background: #0f172a;
            padding: 6px;
            border-radius: 4px;
            margin-bottom: 8px;
            border: 1px solid #334155;
            flex-wrap: wrap;
        }
        .dhcp-toggle label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            color: #cbd5e1;
            font-weight: bold;
            font-size: 0.7rem;
        }
        .dhcp-toggle input[type="radio"] {
            accent-color: var(--accent);
        }

        @media (max-width: 768px) {
            #header h1 {
                font-size: 0.9rem;
            }
            button {
                padding: 5px 8px;
                font-size: 0.6rem;
            }
            .tool-group span {
                font-size: 0.5rem;
            }
            .node {
                min-width: 45px;
                min-height: 45px;
            }
            .node-icon {
                font-size: 18px;
            }
            .node-label {
                font-size: 6px;
                bottom: -18px;
            }
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>📡TCP/IP & Redes sem Fio: Wi‑Fi, BT, NFC, Satélite, Laser</h1>
        <div>
            <button onclick="clearWorkspace()" class="danger small">Limpar</button>
            <button onclick="exportJSON()" style="background: var(--success); color:#000;" class="small">Salvar .json</button>
        </div>
    </div>

    <div id="toolbar">
        <div class="tool-group">
            <span>Ação</span>
            <button id="btn-move" class="active" onclick="setMode('move')">Mover / IP</button>
            <button id="btn-connect" onclick="setMode('connect')">🔗 Cabear</button>
            <button id="btn-delete" onclick="setMode('delete')">❌ Deletar</button>
            <button id="btn-obstacle" onclick="setMode('obstacle')">🧱 Parede</button>
        </div>
        <div class="tool-group">
            <span>Dispositivos</span>
            <button onclick="addDevice('PC','💻')">PC</button>
            <button onclick="addDevice('Notebook','💻')">Notebook</button>
            <button onclick="addDevice('Smartphone','📱')">Smartphone</button>
            <button onclick="addDevice('Switch','🔀')">Switch</button>
            <button onclick="addDevice('Roteador','📡')">Roteador</button>
            <button onclick="addDevice('AccessPoint','📶')">AP Wi-Fi</button>
            <button onclick="addDevice('Internet','☁️')">Internet</button>
            <button onclick="addDevice('Servidor_DHCP','🗄️')">DHCP</button>
            <button onclick="addDevice('Servidor_Web','🌍')">Web/DNS</button>
        </div>
        <div class="tool-group">
            <span>Wireless Extra</span>
            <button onclick="addDevice('Bluetooth','🎧')">Bluetooth</button>
            <button onclick="addDevice('TagNFC','🏷️')">Tag NFC</button>
            <button onclick="addDevice('MicroondasForno','🛑')">Forno MW</button>
            <button onclick="addDevice('AntenaParabolica','📡')">Micro‑ondas</button>
            <button onclick="addDevice('FSO','🔦')">Laser FSO</button>
            <button onclick="addDevice('Satelite','🛰️')">Satélite</button>
        </div>
    </div>

    <div id="env-bar">
        <span>🌦️ Clima:</span>
        <select id="weather-select" onchange="applyWeather()">
            <option value="clear">Céu limpo</option>
            <option value="rain">Chuva moderada</option>
            <option value="fog">Nevoeiro denso</option>
        </select>
        <span>📶 Interferência 2.4GHz:</span>
        <input type="range" id="interference-slider" min="0" max="100" value="0" oninput="applyInterference()">
        <span id="interference-value">0%</span>
        <button onclick="clearObstacles()" class="small">Remover Paredes</button>
        <span style="margin-left:auto;">💡 Duplo clique = Configurar</span>
    </div>

    <div id="workspace" onmousedown="onWorkspaceDown(event)" onmousemove="onWorkspaceMove(event)" onmouseup="onWorkspaceUp(event)" ontouchmove="onTouchMove(event)">
        <svg id="cables-layer"></svg>
        <div id="rssi-tooltip" class="rssi-tooltip"></div>
    </div>

    <div id="port-modal" class="modal-overlay">
        <div class="modal">
            <h2 id="port-modal-title">Ligar em qual Interface?</h2>
            <div id="port-list" class="port-list"></div>
            <button onclick="closeModals()" style="margin-top:12px; width:100%;">Cancelar</button>
        </div>
    </div>

    <div id="config-modal" class="modal-overlay">
        <div class="modal" style="max-width:550px;">
            <h2 id="config-modal-title">Configuração</h2>
            <div class="config-row" style="margin-bottom:10px;">
                <label style="width:100px;">Hostname:</label>
                <input type="text" id="cfg-hostname" style="font-weight:bold;color:var(--accent);">
            </div>
            <div id="config-interfaces" class="config-interfaces"></div>
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button onclick="saveConfig()" style="flex:1; background:var(--success); color:#000;">Salvar</button>
                <button onclick="closeModals()" style="flex:1;">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        // ===================== TEMPLATES DE DISPOSITIVOS =====================
        const deviceTemplates = {
            'PC': { ports: [{ name: 'FastEthernet0', type: 'LAN' }] },
            'Notebook': { ports: [{ name: 'FastEthernet0', type: 'LAN' }, { name: 'Wlan0', type: 'WLAN' }] },
            'Smartphone': { ports: [{ name: 'Wlan0', type: 'WLAN' }, { name: 'BT0', type: 'BT' }, { name: 'NFC0', type: 'NFC' }] },
            'Servidor_DHCP': { ports: [{ name: 'GigabitEthernet0', type: 'LAN' }] },
            'Servidor_Web': { ports: [{ name: 'GigabitEthernet0', type: 'LAN' }] },
            'Switch': {
                ports: [
                    { name: 'Fa0/1', type: 'LAN' }, { name: 'Fa0/2', type: 'LAN' },
                    { name: 'Fa0/3', type: 'LAN' }, { name: 'Fa0/4', type: 'LAN' },
                    { name: 'Gi0/1 (Uplink)', type: 'LAN' }
                ]
            },
            'Roteador': {
                ports: [
                    { name: 'Gi0/0 (Gateway LAN)', type: 'LAN' },
                    { name: 'Gi0/1 (WAN/Internet)', type: 'WAN' },
                    { name: 'Uplink Satélite (SAT)', type: 'SAT' }   // ← NOVA PORTA SAT
                ]
            },
            'AccessPoint': {
                ports: [
                    { name: 'Porta0 (LAN)', type: 'LAN' },
                    { name: 'Antena-WLAN', type: 'WLAN' }
                ],
                wifiStandard: '802.11ac',
                wifiChannel: 6,
                txPower: 20
            },
            'Internet': { ports: [{ name: 'Link-ISP-01', type: 'WAN' }, { name: 'Link-ISP-02', type: 'WAN' }] },
            'Bluetooth': { ports: [{ name: 'BT-Radio', type: 'BT' }] },
            'TagNFC': { ports: [{ name: 'NFC-Tag', type: 'NFC' }] },
            'MicroondasForno': { ports: [{ name: 'Emitter', type: 'INTERFERENCE' }] },
            'AntenaParabolica': {
                ports: [
                    { name: 'Microwave-Link', type: 'MICROWAVE' },
                    { name: 'Uplink Satélite (SAT)', type: 'SAT' }   // ← NOVA PORTA SAT
                ]
            },
            'FSO': { ports: [{ name: 'Laser-Optical', type: 'FSO' }] },
            'Satelite': { ports: [{ name: 'Uplink/Downlink', type: 'SAT' }], orbit: 'LEO' }
        };

        // ===================== ESTADO GLOBAL =====================
        let mode = 'move';
        let devices = {};
        let links = [];
        let obstacles = [];
        let idCounter = 1;
        let draggedNodeId = null;
        let offsetX = 0,
            offsetY = 0;
        let pendingConnection = { step: 0, sourceId: null, sourcePort: null, portType: null };
        let activeConfigDeviceId = null;
        let weather = 'clear';
        let interferenceLevel = 0;

        const workspace = document.getElementById('workspace');
        const svgLayer = document.getElementById('cables-layer');
        const rssiTooltip = document.getElementById('rssi-tooltip');

        // ===================== MODOS DE OPERAÇÃO =====================
        function setMode(newMode) {
            mode = newMode;
            document.querySelectorAll('#toolbar .tool-group:first-child button').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById(`btn-${newMode}`);
            if (btn) btn.classList.add('active');
            workspace.style.cursor = mode === 'connect' ? 'crosshair' : mode === 'delete' ? 'not-allowed' : mode === 'obstacle' ? 'copy' : 'default';
            pendingConnection = { step: 0, sourceId: null, sourcePort: null, portType: null };
            renderAll();
        }

        function generateMAC() {
            return "XX:XX:XX:XX:XX:XX".replace(/X/g, () => "0123456789ABCDEF".charAt(Math.floor(Math.random() * 16)));
        }

        // ===================== ADICIONAR DISPOSITIVO =====================
        function addDevice(type, icon) {
            const id = `dev_${idCounter++}`;
            const template = deviceTemplates[type];
            let interfaces = {};
            template.ports.forEach(port => {
                interfaces[port.name] = {
                    type: port.type,
                    dhcp: ['PC', 'Notebook', 'Smartphone'].includes(type),
                    ip: '',
                    mask: '',
                    gateway: '',
                    dns: '',
                    mac: generateMAC(),
                    connectedToLink: []
                };
            });
            devices[id] = {
                id,
                type,
                icon,
                name: `${type}_${idCounter-1}`,
                x: workspace.clientWidth / 2 - 30 + (Math.random() * 80 - 40),
                y: workspace.clientHeight / 2 - 30 + (Math.random() * 80 - 40),
                interfaces: interfaces,
                wifiStandard: template.wifiStandard || '802.11ac',
                wifiChannel: template.wifiChannel || 6,
                txPower: template.txPower || 20,
                orbit: template.orbit || 'LEO'
            };
            setMode('move');
            renderAll();
        }

        // ===================== VERIFICAÇÃO DE ALCANCE WLAN =====================
        function checkWlanRange() {
            const linksToRemove = [];
            links.forEach(link => {
                if (link.portType !== 'WLAN') return;
                const src = devices[link.sourceId];
                const tgt = devices[link.targetId];
                if (!src || !tgt) return;
                
                // Identifica qual dispositivo é o AP (tem propriedade wifiStandard)
                let ap = src.type === 'AccessPoint' ? src : tgt.type === 'AccessPoint' ? tgt : null;
                if (!ap) {
                    // Se nenhum for explicitamente AP, verifica quem tem Antena-WLAN
                    if (src.interfaces['Antena-WLAN']) ap = src;
                    else if (tgt.interfaces['Antena-WLAN']) ap = tgt;
                }
                if (!ap) return;
                
                const client = ap === src ? tgt : src;
                const dx = (ap.x + 27) - (client.x + 27);
                const dy = (ap.y + 27) - (client.y + 27);
                const distance = Math.sqrt(dx * dx + dy * dy);
                const range = getWifiRange(ap);
                
                if (distance > range) {
                    linksToRemove.push(link.id);
                }
            });
            
            if (linksToRemove.length > 0) {
                linksToRemove.forEach(linkId => {
                    const link = links.find(l => l.id === linkId);
                    if (!link) return;
                    // Remove das connectedToLink das interfaces
                    const srcDev = devices[link.sourceId];
                    const tgtDev = devices[link.targetId];
                    if (srcDev && srcDev.interfaces[link.sourcePort]) {
                        srcDev.interfaces[link.sourcePort].connectedToLink = 
                            srcDev.interfaces[link.sourcePort].connectedToLink.filter(id => id !== linkId);
                    }
                    if (tgtDev && tgtDev.interfaces[link.targetPort]) {
                        tgtDev.interfaces[link.targetPort].connectedToLink = 
                            tgtDev.interfaces[link.targetPort].connectedToLink.filter(id => id !== linkId);
                    }
                });
                links = links.filter(l => !linksToRemove.includes(l.id));
                renderAll();
            }
        }

        // ===================== RENDERIZAÇÃO PRINCIPAL =====================
        function renderAll() {
            renderDevices();
            renderLinks();
            renderObstacles();
            renderCoverage();
        }

        function renderDevices() {
            workspace.querySelectorAll('.node').forEach(n => n.remove());
            Object.values(devices).forEach(dev => {
                const el = document.createElement('div');
                el.className = `node ${pendingConnection.sourceId === dev.id ? 'selected' : ''}`;
                el.id = dev.id;
                el.style.left = `${dev.x}px`;
                el.style.top = `${dev.y}px`;
                let ipSummary = '';
                Object.values(dev.interfaces).forEach(intf => {
                    if (intf.ip && intf.ip !== 'Auto (DHCP)') ipSummary += `<br><span style="color:var(--success)">${intf.ip}</span>`;
                    else if (intf.dhcp && intf.connectedToLink.length > 0) ipSummary += `<br><span style="color:var(--accent-wlan)">DHCP</span>`;
                });
                el.innerHTML = `<div class="node-icon">${dev.icon}</div><div class="node-label">${dev.name}${ipSummary}</div>`;
                el.addEventListener('mousedown', (e) => onDeviceDown(e, dev.id));
                el.addEventListener('dblclick', (e) => onDeviceDblClick(e, dev.id));
                workspace.appendChild(el);
            });
        }

        function renderLinks() {
            svgLayer.innerHTML = '';
            obstacles.forEach(obs => {
                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('x', obs.x);
                rect.setAttribute('y', obs.y);
                rect.setAttribute('width', obs.w);
                rect.setAttribute('height', obs.h);
                rect.setAttribute('fill', 'rgba(239,68,68,0.1)');
                rect.setAttribute('stroke', '#ef4444');
                rect.setAttribute('stroke-dasharray', '5 5');
                rect.classList.add('obstacle-svg');
                svgLayer.appendChild(rect);
            });

            links.forEach(link => {
                const src = devices[link.sourceId];
                const tgt = devices[link.targetId];
                if (!src || !tgt) return;
                const x1 = src.x + 27,
                    y1 = src.y + 27;
                const x2 = tgt.x + 27,
                    y2 = tgt.y + 27;
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x1);
                line.setAttribute('y1', y1);
                line.setAttribute('x2', x2);
                line.setAttribute('y2', y2);
                let cableClass = 'cable-lan';
                if (link.portType === 'WLAN') cableClass = 'cable-wlan';
                if (link.portType === 'WAN') cableClass = 'cable-wan';
                if (link.portType === 'FSO') cableClass = 'cable-fso';
                if (link.portType === 'SAT') cableClass = 'cable-sat';
                if (link.portType === 'BT') cableClass = 'cable-bt';
                if (link.portType === 'NFC') cableClass = 'cable-nfc';
                if (link.portType === 'MICROWAVE') cableClass = 'cable-wan';
                line.setAttribute('class', cableClass);
                line.setAttribute('data-link-id', link.id);
                line.style.pointerEvents = 'stroke';
                if (link.portType === 'WLAN' && interferenceLevel > 30) {
                    line.style.stroke = '#ef4444';
                    line.style.opacity = 0.6;
                }
                if ((link.portType === 'FSO' || link.portType === 'SAT') && weather !== 'clear') {
                    line.style.strokeDasharray = '1 6';
                    line.style.opacity = weather === 'fog' ? 0.3 : 0.6;
                }
                let crossesObstacle = false;
                obstacles.forEach(obs => {
                    if (lineIntersectsRect(x1, y1, x2, y2, obs.x, obs.y, obs.w, obs.h)) {
                        crossesObstacle = true;
                    }
                });
                if (crossesObstacle && link.portType === 'WLAN') {
                    line.style.stroke = '#f97316';
                    line.style.strokeWidth = 3;
                }
                line.addEventListener('mouseenter', (e) => showRSSI(e, link, x1, y1, x2, y2));
                line.addEventListener('mouseleave', hideRSSI);
                svgLayer.appendChild(line);
                if (link.portType !== 'WLAN' && link.portType !== 'BT' && link.portType !== 'NFC') {
                    const drawLabel = (px, py, cx, cy, text) => {
                        const angle = Math.atan2(cy - py, cx - px);
                        const lx = px + Math.cos(angle) * 38;
                        const ly = py + Math.sin(angle) * 38;
                        const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        txt.setAttribute('x', lx);
                        txt.setAttribute('y', ly);
                        txt.setAttribute('class', 'port-label');
                        txt.setAttribute('text-anchor', 'middle');
                        txt.textContent = text.split(' ')[0];
                        svgLayer.appendChild(txt);
                    };
                    drawLabel(x1, y1, x2, y2, link.sourcePort);
                    drawLabel(x2, y2, x1, y1, link.targetPort);
                }
            });
        }

        function renderObstacles() {
            document.querySelectorAll('.obstacle').forEach(o => o.remove());
            obstacles.forEach(obs => {
                const el = document.createElement('div');
                el.className = 'obstacle';
                el.style.left = obs.x + 'px';
                el.style.top = obs.y + 'px';
                el.style.width = obs.w + 'px';
                el.style.height = obs.h + 'px';
                workspace.appendChild(el);
            });
        }

        function renderCoverage() {
            svgLayer.querySelectorAll('.coverage-circle').forEach(c => c.remove());
            Object.values(devices).forEach(dev => {
                if (dev.type === 'AccessPoint' || (dev.interfaces['Antena-WLAN'] && dev.interfaces['Antena-WLAN'].type === 'WLAN')) {
                    const radius = getWifiRange(dev);
                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('cx', dev.x + 27);
                    circle.setAttribute('cy', dev.y + 27);
                    circle.setAttribute('r', radius);
                    circle.classList.add('coverage-circle');
                    svgLayer.appendChild(circle);
                }
                if (dev.type === 'Bluetooth') {
                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('cx', dev.x + 27);
                    circle.setAttribute('cy', dev.y + 27);
                    circle.setAttribute('r', 100);
                    circle.setAttribute('fill', 'rgba(244,114,182,0.05)');
                    circle.setAttribute('stroke', 'rgba(244,114,182,0.3)');
                    circle.setAttribute('stroke-dasharray', '3 5');
                    svgLayer.appendChild(circle);
                }
            });
        }

        function getWifiRange(dev) {
            const std = dev.wifiStandard || '802.11ac';
            const power = dev.txPower || 20;
            // Raios base (em pixels) conforme solicitado pelo usuário
            const baseRanges = {
                '802.11b': 300,
                '802.11g': 240,
                '802.11n': 200,
                '802.11ac': 160,
                '802.11ax': 140
            };
            let radius = baseRanges[std] || 100;
            // Fator de potência: 20 dBm = 1.0, a cada 10 dBm dobra/metade
            const powerFactor = Math.pow(2, (power - 20) / 10);
            return radius * powerFactor;
        }

        function lineIntersectsRect(x1, y1, x2, y2, rx, ry, rw, rh) {
            function inside(x, y) { return x >= rx && x <= rx + rw && y >= ry && y <= ry + rh; }
            if (inside(x1, y1) && inside(x2, y2)) return true;
            const left = rx,
                right = rx + rw,
                top = ry,
                bottom = ry + rh;
            if (segmentsIntersect(x1, y1, x2, y2, left, top, right, top)) return true;
            if (segmentsIntersect(x1, y1, x2, y2, right, top, right, bottom)) return true;
            if (segmentsIntersect(x1, y1, x2, y2, right, bottom, left, bottom)) return true;
            if (segmentsIntersect(x1, y1, x2, y2, left, bottom, left, top)) return true;
            return false;
        }

        function segmentsIntersect(x1, y1, x2, y2, x3, y3, x4, y4) {
            const det = (x2 - x1) * (y4 - y3) - (x4 - x3) * (y2 - y1);
            if (det === 0) return false;
            const t = ((x3 - x1) * (y4 - y3) - (y3 - y1) * (x4 - x3)) / det;
            const u = ((x3 - x1) * (y2 - y1) - (y3 - y1) * (x2 - x1)) / det;
            return t >= 0 && t <= 1 && u >= 0 && u <= 1;
        }

        function showRSSI(e, link, x1, y1, x2, y2) {
            const dist = Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
            let rssi = -30 - dist * 0.3;
            if (link.portType === 'WLAN' && interferenceLevel > 30) rssi -= 20;
            let crossesObs = false;
            obstacles.forEach(obs => { if (lineIntersectsRect(x1, y1, x2, y2, obs.x, obs.y, obs.w, obs.h)) crossesObs = true; });
            if (crossesObs) rssi -= 15;
            if (weather === 'rain' && (link.portType === 'WLAN' || link.portType === 'SAT')) rssi -= 10;
            if (weather === 'fog' && link.portType === 'FSO') rssi = -90;
            const quality = rssi > -50 ? 'Excelente' : rssi > -65 ? 'Boa' : rssi > -75 ? 'Regular' : 'Fraca';
            const std = devices[link.sourceId]?.wifiStandard || devices[link.targetId]?.wifiStandard || '802.11ac';
            const rates = { '802.11b': 11, '802.11g': 54, '802.11n': 300, '802.11ac': 1300, '802.11ax': 9600 };
            let rate = rates[std] || 1300;
            if (rssi < -70) rate *= 0.1;
            else if (rssi < -60) rate *= 0.4;
            else rate *= 0.8;
            rssiTooltip.innerHTML = `
            📶 RSSI: ${Math.round(rssi)} dBm (${quality})<br>
            📡 Padrão: ${std}<br>
            🚀 Taxa est.: ${rate.toFixed(0)} Mbps<br>
            ${crossesObs ? '🧱 Obstáculo no caminho' : ''}
            ${interferenceLevel>30 ? '⚠️ Interferência alta' : ''}
          `;
            rssiTooltip.style.display = 'block';
            rssiTooltip.style.left = e.clientX + 15 + 'px';
            rssiTooltip.style.top = e.clientY - 20 + 'px';
        }

        function hideRSSI() { rssiTooltip.style.display = 'none'; }

        // ===================== EVENTOS DE MOUSE / TOQUE =====================
        function onDeviceDown(e, devId) {
            e.stopPropagation();
            if (mode === 'delete') { deleteDevice(devId); return; }
            if (mode === 'connect') { handleConnectionClick(devId); return; }
            if (mode === 'move') {
                draggedNodeId = devId;
                const rect = document.getElementById(devId).getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
            }
        }

        function onWorkspaceMove(e) {
            if (draggedNodeId && mode === 'move') {
                const dev = devices[draggedNodeId];
                const rect = workspace.getBoundingClientRect();
                dev.x = e.clientX - rect.left - offsetX;
                dev.y = e.clientY - rect.top - offsetY;
                checkWlanRange(); // Verifica alcance após mover
                renderAll();
            }
        }

        function onWorkspaceUp() { draggedNodeId = null; }

        function onWorkspaceDown(e) {
            if (mode === 'connect' && pendingConnection.step === 1) {
                pendingConnection = { step: 0, sourceId: null, sourcePort: null, portType: null };
                renderAll();
            }
            if (mode === 'obstacle') {
                const rect = workspace.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                obstacles.push({ x: x - 30, y: y - 10, w: 60, h: 20 });
                renderAll();
                setMode('move');
            }
        }

        function onTouchMove(e) {
            if (draggedNodeId && mode === 'move') {
                e.preventDefault();
                const dev = devices[draggedNodeId];
                const touch = e.touches[0];
                const rect = workspace.getBoundingClientRect();
                dev.x = touch.clientX - rect.left - offsetX;
                dev.y = touch.clientY - rect.top - offsetY;
                checkWlanRange(); // Verifica alcance após mover
                renderAll();
            }
        }

        // ===================== CONEXÃO =====================
        function handleConnectionClick(devId) {
            const dev = devices[devId];
            if (pendingConnection.step === 0) {
                openPortSelector(dev, null, (selectedPort, portType) => {
                    pendingConnection = { step: 1, sourceId: devId, sourcePort: selectedPort, portType: portType };
                    renderAll();
                });
            } else if (pendingConnection.step === 1) {
                if (devId === pendingConnection.sourceId) return;
                openPortSelector(dev, pendingConnection.portType, (selectedPort) => {
                    const linkId = `link_${Date.now()}`;
                    links.push({
                        id: linkId,
                        sourceId: pendingConnection.sourceId,
                        sourcePort: pendingConnection.sourcePort,
                        targetId: devId,
                        targetPort: selectedPort,
                        portType: pendingConnection.portType
                    });
                    devices[pendingConnection.sourceId].interfaces[pendingConnection.sourcePort].connectedToLink.push(linkId);
                    devices[devId].interfaces[selectedPort].connectedToLink.push(linkId);
                    pendingConnection = { step: 0, sourceId: null, sourcePort: null, portType: null };
                    renderAll();
                });
            }
        }

        function openPortSelector(dev, restrictType, onSelectCallback) {
            document.getElementById('port-modal-title').innerText = 'Ligar em qual Interface?';
            const listDiv = document.getElementById('port-list');
            listDiv.innerHTML = '';
            let hasOptions = false;
            Object.keys(dev.interfaces).forEach(portName => {
                const intf = dev.interfaces[portName];
                // NOVA REGRA: compatibilidade SAT ↔ WAN
                let tipoCompativel = false;
                if (!restrictType) {
                    tipoCompativel = true;
                } else {
                    if (intf.type === restrictType) {
                        tipoCompativel = true;
                    } else if ((restrictType === 'SAT' && intf.type === 'WAN') || 
                               (restrictType === 'WAN' && intf.type === 'SAT')) {
                        tipoCompativel = true;
                    }
                }
                if (!tipoCompativel) return;
                
                const isUsed = intf.connectedToLink.length > 0 && !(dev.type === 'AccessPoint' && intf.type === 'WLAN');
                let colorCode = intf.type === 'WLAN' ? '#3b82f6' : intf.type === 'WAN' ? '#ef4444' : intf.type === 'BT' ? '#f472b6' : intf.type === 'NFC' ? '#a78bfa' : intf.type === 'FSO' ? '#10b981' : intf.type === 'SAT' ? '#f59e0b' : '#10b981';
                const btn = document.createElement('div');
                btn.className = `port-item ${isUsed ? 'used' : ''}`;
                btn.innerHTML = `
              <div><span class="port-type-badge" style="background:${colorCode}">${intf.type}</span> <strong>${portName}</strong></div>
              <span>${isUsed ? 'Ocupada' : 'Livre'}</span>`;
                if (!isUsed) btn.onclick = () => { closeModals(); onSelectCallback(portName, intf.type); };
                listDiv.appendChild(btn);
                hasOptions = true;
            });
            if (!hasOptions) listDiv.innerHTML = '<div style="color:var(--danger);padding:10px;">Nenhuma interface compatível.</div>';
            document.getElementById('port-modal').style.display = 'flex';
        }

        // ===================== CONFIGURAÇÃO TCP/IP + WIRELESS =====================
        function onDeviceDblClick(e, devId) {
            if (mode !== 'move') return;
            activeConfigDeviceId = devId;
            const dev = devices[devId];
            document.getElementById('cfg-hostname').value = dev.name;
            const container = document.getElementById('config-interfaces');
            container.innerHTML = '';
            Object.keys(dev.interfaces).forEach(portName => {
                const intf = dev.interfaces[portName];
                const isUp = intf.connectedToLink.length > 0;
                const statusTxt = isUp ? '<span style="color:var(--success)">UP</span>' : '<span style="color:var(--danger)">DOWN</span>';
                const disableAttr = intf.dhcp ? 'disabled' : '';
                container.innerHTML += `
              <div class="interface-block">
                <div class="interface-title"><span>${portName} [MAC:${intf.mac}]</span> ${statusTxt}</div>
                <div class="dhcp-toggle">
                  <label><input type="radio" name="dhcp_${portName}" value="static" ${!intf.dhcp?'checked':''} onchange="toggleDHCP('${portName}',false)"> Estático</label>
                  <label><input type="radio" name="dhcp_${portName}" value="dhcp" ${intf.dhcp?'checked':''} onchange="toggleDHCP('${portName}',true)"> DHCP</label>
                </div>
                <div class="cfg-group-${portName}">
                  <div class="config-row"><label>IPv4:</label><input type="text" id="cfg-ip-${portName}" value="${intf.dhcp?'Auto (DHCP)':intf.ip}" ${disableAttr}></div>
                  <div class="config-row"><label>Máscara:</label><input type="text" id="cfg-mask-${portName}" value="${intf.dhcp?'Auto (DHCP)':intf.mask}" ${disableAttr}></div>
                  <div class="config-row"><label>Gateway:</label><input type="text" id="cfg-gw-${portName}" value="${intf.dhcp?'Auto (DHCP)':intf.gateway}" ${disableAttr}></div>
                  <div class="config-row"><label>DNS:</label><input type="text" id="cfg-dns-${portName}" value="${intf.dhcp?'Auto (DHCP)':intf.dns}" ${disableAttr}></div>
                </div>
              </div>`;
            });
            if (dev.type === 'AccessPoint' || dev.interfaces['Antena-WLAN']) {
                container.innerHTML += `
              <div class="interface-block">
                <div class="interface-title">📶 Configurações Wireless</div>
                <div class="config-row"><label>Padrão:</label><select id="cfg-wifi-std">
                  <option value="802.11b" ${dev.wifiStandard==='802.11b'?'selected':''}>802.11b (11 Mbps)</option>
                  <option value="802.11g" ${dev.wifiStandard==='802.11g'?'selected':''}>802.11g (54 Mbps)</option>
                  <option value="802.11n" ${dev.wifiStandard==='802.11n'?'selected':''}>802.11n (300 Mbps)</option>
                  <option value="802.11ac" ${dev.wifiStandard==='802.11ac'?'selected':''}>802.11ac (1.3 Gbps)</option>
                  <option value="802.11ax" ${dev.wifiStandard==='802.11ax'?'selected':''}>802.11ax / Wi-Fi 6 (9.6 Gbps)</option>
                </select></div>
                <div class="config-row"><label>Canal:</label><select id="cfg-wifi-channel">
                  <option value="1" ${dev.wifiChannel==1?'selected':''}>1 (2.412 GHz)</option>
                  <option value="6" ${dev.wifiChannel==6?'selected':''}>6 (2.437 GHz)</option>
                  <option value="11" ${dev.wifiChannel==11?'selected':''}>11 (2.462 GHz)</option>
                </select></div>
                <div class="config-row"><label>Potência:</label><input type="range" id="cfg-tx-power" min="5" max="30" value="${dev.txPower||20}" style="flex:1;"> <span id="tx-power-val">${dev.txPower||20} dBm</span></div>
              </div>`;
                document.getElementById('cfg-tx-power').addEventListener('input', function() {
                    document.getElementById('tx-power-val').textContent = this.value + ' dBm';
                });
            }
            document.getElementById('config-modal').style.display = 'flex';
        }

        function toggleDHCP(portName, isDHCP) {
            const inputs = document.querySelectorAll(`.cfg-group-${portName} input[type="text"]`);
            inputs.forEach(input => {
                input.disabled = isDHCP;
                if (isDHCP) {
                    input.dataset.oldValue = input.value !== 'Auto (DHCP)' ? input.value : '';
                    input.value = "Auto (DHCP)";
                } else input.value = input.dataset.oldValue || "";
            });
        }

        function saveConfig() {
            if (!activeConfigDeviceId) return;
            const dev = devices[activeConfigDeviceId];
            dev.name = document.getElementById('cfg-hostname').value;
            Object.keys(dev.interfaces).forEach(portName => {
                const isDHCP = document.querySelector(`input[name="dhcp_${portName}"][value="dhcp"]`)?.checked;
                if (isDHCP !== undefined) dev.interfaces[portName].dhcp = isDHCP;
                if (!isDHCP) {
                    dev.interfaces[portName].ip = document.getElementById(`cfg-ip-${portName}`)?.value.trim() || '';
                    dev.interfaces[portName].mask = document.getElementById(`cfg-mask-${portName}`)?.value.trim() || '';
                    dev.interfaces[portName].gateway = document.getElementById(`cfg-gw-${portName}`)?.value.trim() || '';
                    dev.interfaces[portName].dns = document.getElementById(`cfg-dns-${portName}`)?.value.trim() || '';
                } else {
                    dev.interfaces[portName].ip = '';
                    dev.interfaces[portName].mask = '';
                }
            });
            const wifiStd = document.getElementById('cfg-wifi-std');
            if (wifiStd) dev.wifiStandard = wifiStd.value;
            const wifiCh = document.getElementById('cfg-wifi-channel');
            if (wifiCh) dev.wifiChannel = parseInt(wifiCh.value);
            const txP = document.getElementById('cfg-tx-power');
            if (txP) dev.txPower = parseInt(txP.value);
            closeModals();
            renderAll();
        }

        function deleteDevice(devId) {
            links = links.filter(link => {
                if (link.sourceId === devId || link.targetId === devId) {
                    const otherDevId = link.sourceId === devId ? link.targetId : link.sourceId;
                    const otherPort = link.sourceId === devId ? link.targetPort : link.sourcePort;
                    if (devices[otherDevId]) devices[otherDevId].interfaces[otherPort].connectedToLink = devices[otherDevId].interfaces[otherPort].connectedToLink.filter(id => id !== link.id);
                    return false;
                }
                return true;
            });
            delete devices[devId];
            renderAll();
        }

        function closeModals() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
            activeConfigDeviceId = null;
        }

        function clearWorkspace() {
            if (confirm("Apagar toda a topologia?")) { devices = {}; links = []; obstacles = []; idCounter = 1; renderAll(); }
        }

        function clearObstacles() { obstacles = []; renderAll(); }

        function exportJSON() {
            const topology = { metadata: { software: "NetSim Pro", timestamp: new Date().toISOString() }, nodes: devices, connections: links, obstacles };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(topology, null, 2));
            const a = document.createElement('a');
            a.setAttribute("href", dataStr);
            a.setAttribute("download", "laboratorio-tcpip.json");
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        function applyWeather() {
            weather = document.getElementById('weather-select').value;
            renderLinks();
        }

        function applyInterference() {
            interferenceLevel = parseInt(document.getElementById('interference-slider').value);
            document.getElementById('interference-value').textContent = interferenceLevel + '%';
            renderLinks();
        }
    </script>
</body>
</html>
