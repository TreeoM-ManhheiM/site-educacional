<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TCP/IP & Redes sem Fio: Identificador de Rede e Broadcast</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;800&display=swap');

        :root {
            --bg-color: #0b1120;
            --panel-bg: #1e293b;
            --accent: #06b6d4;
            --accent-wlan: #3b82f6;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --text-light: #f8fafc;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background: var(--bg-color);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        #header {
            background: #020617;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            z-index: 100;
            flex-wrap: wrap;
            gap: 8px;
        }
        #header h1 {
            margin: 0;
            font-size: 0.95rem;
            font-family: 'Fira Code', monospace;
            color: var(--accent);
        }

        #toolbar {
            background: var(--panel-bg);
            padding: 6px 10px;
            display: flex;
            gap: 8px;
            z-index: 99;
            border-bottom: 1px solid #334155;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            align-items: center;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
        }
        #toolbar::-webkit-scrollbar { height: 4px; }
        #toolbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

        .tool-group {
            display: flex;
            gap: 4px;
            border-right: 2px solid #334155;
            padding-right: 8px;
            align-items: center;
            flex-shrink: 0;
        }
        .tool-group span {
            color: #94a3b8;
            font-size: 0.55rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-right: 4px;
            letter-spacing: 0.5px;
        }

        button {
            background: #334155;
            color: white;
            border: 1px solid #475569;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Inter';
            font-size: 0.75rem;
            font-weight: 600;
            transition: 0.2s;
            white-space: nowrap;
            min-height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        button:hover, button:active { background: #475569; border-color: var(--accent); }
        button.active { background: var(--accent); color: #000; border-color: var(--accent); }
        button.danger { background: var(--danger); border-color: var(--danger); }
        button.small { padding: 4px 8px; font-size: 0.65rem; min-height: 28px; }

        #env-bar {
            background: #020617;
            padding: 6px 12px;
            display: flex;
            gap: 12px;
            align-items: center;
            z-index: 98;
            border-bottom: 1px solid #334155;
            overflow-x: auto;
            white-space: nowrap;
            color: #94a3b8;
            font-size: 0.7rem;
        }
        #env-bar select, #env-bar input[type="range"] {
            background: #1e293b;
            color: white;
            border: 1px solid #475569;
            border-radius: 4px;
            padding: 4px 8px;
            font-family: 'Inter';
            font-size: 0.7rem;
            height: 30px;
        }

        #workspace {
            flex: 1;
            position: relative;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1.5px, transparent 1.5px);
            background-size: 25px 25px;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }
        svg#cables-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .cable-lan { stroke: #cbd5e1; stroke-width: 3; }
        .cable-wan { stroke: #ef4444; stroke-width: 3; stroke-dasharray: 10 5; }
        .cable-wlan { stroke: var(--accent-wlan); stroke-width: 2.5; stroke-dasharray: 4 6; animation: wlanPulse 1s linear infinite; }
        .cable-fso { stroke: #10b981; stroke-width: 2; stroke-dasharray: 2 4; filter: drop-shadow(0 0 4px #10b981); }
        .cable-sat { stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 8 4; }
        .cable-bt { stroke: #f472b6; stroke-width: 2; stroke-dasharray: 3 3; }
        .cable-nfc { stroke: #a78bfa; stroke-width: 4; stroke-dasharray: 1 2; }

        .obstacle-wall { stroke: #ef4444; stroke-width: 8; stroke-linecap: round; opacity: 0.85; }

        @keyframes wlanPulse { to { stroke-dashoffset: -10; } }

        .coverage-circle {
            fill: rgba(59, 130, 246, 0.08);
            stroke: rgba(59, 130, 246, 0.4);
            stroke-width: 1.5;
            stroke-dasharray: 6 3;
            pointer-events: none;
        }

        .node {
            position: absolute;
            width: 54px;
            height: 54px;
            background: #1e293b;
            border: 2px solid #475569;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            z-index: 20;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            user-select: none;
            touch-action: none;
        }
        .node:active { cursor: grabbing; transform: scale(0.96); }
        .node.selected { border-color: var(--success); box-shadow: 0 0 15px var(--success); }
        .node.ping-source { border-color: var(--warning); box-shadow: 0 0 15px var(--warning); }
        .node-icon { font-size: 22px; pointer-events: none; }
        .node-label {
            font-size: 7px;
            font-weight: bold;
            font-family: 'Fira Code', monospace;
            color: #cbd5e1;
            pointer-events: none;
            text-align: center;
            line-height: 1.2;
            background: rgba(0, 0, 0, 0.85);
            padding: 2px 5px;
            border-radius: 4px;
            position: absolute;
            bottom: -28px;
            white-space: nowrap;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rssi-tooltip {
            position: fixed;
            background: #0f172a;
            border: 1px solid var(--accent);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-family: 'Fira Code', monospace;
            z-index: 2000;
            pointer-events: none;
            display: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.8);
            color: #e2e8f0;
        }

        .toast-notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #020617;
            border: 1px solid var(--accent);
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            z-index: 3000;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            display: none;
            text-align: center;
            max-width: 90%;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
            padding: 15px;
        }
        .modal {
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 580px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            color: white;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal h2 {
            margin-top: 0;
            font-size: 1rem;
            color: var(--accent);
            border-bottom: 2px solid #334155;
            padding-bottom: 8px;
            font-family: 'Fira Code', monospace;
        }
        .port-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
            max-height: 250px;
            overflow-y: auto;
        }
        .port-item {
            background: #1e293b;
            padding: 10px;
            border: 1px solid #334155;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 40px;
        }
        .port-item.used {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            cursor: not-allowed;
            border-color: #7f1d1d;
        }

        .config-interfaces {
            max-height: 55vh;
            overflow-y: auto;
            padding-right: 5px;
        }
        .interface-block {
            border: 1px solid #334155;
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .interface-title {
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 8px;
            font-size: 0.85rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 4px;
            font-family: 'Fira Code', monospace;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .config-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            flex-wrap: wrap;
        }
        .config-row label { width: 120px; color: #94a3b8; }
        .config-row input[type="text"], .config-row select {
            flex: 1;
            padding: 6px;
            background: #0f172a;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 4px;
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            min-width: 120px;
            height: 34px;
        }

        .subnet-info-box {
            background: #090d16;
            border: 1px solid #38bdf8;
            border-radius: 6px;
            padding: 8px 12px;
            margin-top: 10px;
            font-family: 'Fira Code', monospace;
            font-size: 0.72rem;
            color: #38bdf8;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .subnet-info-box div {
            display: flex;
            justify-content: space-between;
        }
        .subnet-info-box strong {
            color: #94a3b8;
        }
        .subnet-info-box span.val {
            color: #f8fafc;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>📡 Simulador TCP/IP IPv4 (Cálculo de Rede & Broadcast)</h1>
        <div style="display:flex; gap:6px;">
            <button onclick="clearWorkspace()" class="danger small">Limpar</button>
            <button onclick="document.getElementById('file-input').click()" style="background: #0284c7; color:#fff;" class="small">Abrir .json</button>
            <button onclick="exportJSON()" style="background: var(--success); color:#000;" class="small">Salvar .json</button>
            <input type="file" id="file-input" accept=".json" style="display:none" onchange="importJSON(event)">
        </div>
    </div>

    <div id="toolbar">
        <div class="tool-group">
            <span>Ação</span>
            <button id="btn-move" class="active" onclick="setMode('move')">🖐️ Mover/IP</button>
            <button id="btn-connect" onclick="setMode('connect')">🔗 Cabear</button>
            <button id="btn-ping" onclick="setMode('ping')">⚡ Simular Ping</button>
            <button id="btn-obstacle" onclick="setMode('obstacle')">🧱 Parede</button>
            <button id="btn-delete" onclick="setMode('delete')">❌ Deletar</button>
        </div>
        <div class="tool-group">
            <span>Dispositivos</span>
            <button onclick="addDevice('PC','💻')">PC</button>
            <button onclick="addDevice('Notebook','💻')">Notebook</button>
            <button onclick="addDevice('Smartphone','📱')">Smartphone</button>
            <button onclick="addDevice('Switch','🔀')">Switch L2</button>
            <button onclick="addDevice('Roteador','📡')">Roteador</button>
            <button onclick="addDevice('AccessPoint','📶')">AP Wi-Fi</button>
            <button onclick="addDevice('Internet','☁️')">Internet</button>
            <button onclick="addDevice('Servidor_DHCP','🗄️')">Servidor DHCP</button>
            <button onclick="addDevice('Servidor_Web','🌍')">Servidor Web</button>
        </div>
        <div class="tool-group">
            <span>Wireless Extra</span>
            <button onclick="addDevice('Bluetooth','🎧')">Bluetooth</button>
            <button onclick="addDevice('TagNFC','🏷️')">Tag NFC</button>
            <button onclick="addDevice('MicroondasForno','🛑')">Forno MW</button>
            <button onclick="addDevice('AntenaParabolica','📡')">Parabólica</button>
            <button onclick="addDevice('FSO','🔦')">Laser FSO</button>
            <button onclick="addDevice('Satelite','🛰️')">Satélite</button>
        </div>
    </div>

    <div id="env-bar">
        <span>🌦️ Clima:</span>
        <select id="weather-select" onchange="applyWeather()">
            <option value="clear">Céu limpo</option>
            <option value="rain">Chuva moderada</option>
            <option value="fog">Nevoeiro denso</option>
        </select>
        <span>📶 Interferência 2.4GHz:</span>
        <input type="range" id="interference-slider" min="0" max="100" value="0" oninput="applyInterference()">
        <span id="interference-value">0%</span>
        <button onclick="clearObstacles()" class="small">Remover Paredes</button>
        <span style="margin-left:auto; opacity:0.8;">💡 2 Toques no Dispositivo = Configurar IPv4</span>
    </div>

    <div id="workspace">
        <svg id="cables-layer"></svg>
        <div id="rssi-tooltip" class="rssi-tooltip"></div>
        <div id="toast" class="toast-notification"></div>
    </div>

    <!-- Modal de Seleção de Portas -->
    <div id="port-modal" class="modal-overlay">
        <div class="modal">
            <h2 id="port-modal-title">Ligar em qual Interface?</h2>
            <div id="port-list" class="port-list"></div>
            <button onclick="closeModals()" style="margin-top:12px; width:100%;">Cancelar</button>
        </div>
    </div>

    <!-- Modal de Configuração IPv4 Completa -->
    <div id="config-modal" class="modal-overlay">
        <div class="modal">
            <h2 id="config-modal-title">Configuração de Dispositivo IPv4</h2>
            <div class="config-row" style="margin-bottom:12px;">
                <label>Hostname:</label>
                <input type="text" id="cfg-hostname" style="font-weight:bold;color:var(--accent);">
            </div>
            <div id="config-interfaces" class="config-interfaces"></div>
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button onclick="saveConfig()" style="flex:1; background:var(--success); color:#000;">Salvar Alterações</button>
                <button onclick="closeModals()" style="flex:1;">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const deviceTemplates = {
            'PC': { ports: [{ name: 'FastEthernet0', type: 'LAN' }] },
            'Notebook': { ports: [{ name: 'FastEthernet0', type: 'LAN' }, { name: 'Wlan0', type: 'WLAN' }] },
            'Smartphone': { ports: [{ name: 'Wlan0', type: 'WLAN' }, { name: 'BT0', type: 'BT' }, { name: 'NFC0', type: 'NFC' }] },
            'Servidor_DHCP': { ports: [{ name: 'GigabitEthernet0', type: 'LAN' }] },
            'Servidor_Web': { ports: [{ name: 'GigabitEthernet0', type: 'LAN' }] },
            'Switch': {
                ports: [
                    { name: 'Fa0/1', type: 'LAN' }, { name: 'Fa0/2', type: 'LAN' },
                    { name: 'Fa0/3', type: 'LAN' }, { name: 'Fa0/4', type: 'LAN' },
                    { name: 'Gi0/1', type: 'LAN' }
                ]
            },
            'Roteador': {
                ports: [
                    { name: 'Gi0/0/0 (LAN)', type: 'LAN' },
                    { name: 'Gi0/0/1 (WAN)', type: 'WAN' },
                    { name: 'SAT-0', type: 'SAT' }
                ]
            },
            'AccessPoint': {
                ports: [
                    { name: 'Porta0 (LAN)', type: 'LAN' },
                    { name: 'Antena-WLAN', type: 'WLAN' }
                ],
                wifiStandard: '802.11ac', wifiChannel: 6, txPower: 20
            },
            'Internet': { ports: [{ name: 'ISP-01', type: 'WAN' }, { name: 'ISP-02', type: 'WAN' }] },
            'Bluetooth': { ports: [{ name: 'BT-Radio', type: 'BT' }] },
            'TagNFC': { ports: [{ name: 'NFC-Tag', type: 'NFC' }] },
            'MicroondasForno': { ports: [{ name: 'Emitter', type: 'INTERFERENCE' }] },
            'AntenaParabolica': { ports: [{ name: 'Microwave-Link', type: 'MICROWAVE' }, { name: 'SAT-Link', type: 'SAT' }] },
            'FSO': { ports: [{ name: 'Laser-Optical', type: 'FSO' }] },
            'Satelite': { ports: [{ name: 'Uplink-Downlink', type: 'SAT' }] }
        };

        const availableCIDRs = [
            { bits: 26, cidr: '/26', mask: '255.255.255.192', hosts: 62 },
            { bits: 27, cidr: '/27', mask: '255.255.255.224', hosts: 30 },
            { bits: 28, cidr: '/28', mask: '255.255.255.240', hosts: 14 },
            { bits: 24, cidr: '/24', mask: '255.255.255.0',   hosts: 254 },
            { bits: 25, cidr: '/25', mask: '255.255.255.128', hosts: 126 },
            { bits: 30, cidr: '/30', mask: '255.255.255.252', hosts: 2 }
        ];

        let mode = 'move';
        let devices = {};
        let links = [];
        let obstacles = [];
        let idCounter = 1;
        let draggedNodeId = null;
        let dragOffsetX = 0, dragOffsetY = 0;
        let pendingConnection = { step: 0, sourceId: null, sourcePort: null, portType: null };
        let activeConfigDeviceId = null;
        let weather = 'clear';
        let interferenceLevel = 0;
        let lastTapTime = 0;
        let activeWallStart = null;
        let pingSourceId = null;

        const workspace = document.getElementById('workspace');
        const svgLayer = document.getElementById('cables-layer');
        const tooltip = document.getElementById('rssi-tooltip');

        function setMode(newMode) {
            mode = newMode;
            document.querySelectorAll('#toolbar button').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById(`btn-${newMode}`);
            if (btn) btn.classList.add('active');
            pendingConnection = { step: 0, sourceId: null, sourcePort: null, portType: null };
            pingSourceId = null;
            renderAll();
        }

        function generateMAC() {
            return "52:54:00:XX:XX:XX".replace(/X/g, () => "0123456789ABCDEF".charAt(Math.floor(Math.random() * 16)));
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerHTML = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 4500);
        }

        function ipToLong(ip) {
            return ip.split('.').reduce((acc, octet) => ((acc << 8) + parseInt(octet, 10)) >>> 0, 0) >>> 0;
        }

        function longToIp(long) {
            return [
                (long >>> 24) & 255,
                (long >>> 16) & 255,
                (long >>> 8) & 255,
                long & 255
            ].join('.');
        }

        function cidrToMask(bits) {
            const maskLong = (0xFFFFFFFF << (32 - bits)) >>> 0;
            return longToIp(maskLong);
        }

        function maskToCidr(mask) {
            const entry = availableCIDRs.find(opt => opt.mask === mask);
            if (entry) return entry.cidr;
            const long = ipToLong(mask);
            let count = 0;
            for (let i = 0; i < 32; i++) {
                if ((long & (1 << (31 - i))) !== 0) count++;
            }
            return `/${count}`;
        }

        function cidrToBits(cidr) {
            return parseInt(cidr.replace('/', ''), 10);
        }

        function validateIP(ip) {
            const regex = /^(25[0-5]|24[0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|24[0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|24[0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|24[0-9]|[01]?[0-9][0-9]?)$/;
            return regex.test(ip);
        }

        function getSubnetRange(ip, mask) {
            const ipInt = ipToLong(ip);
            const maskInt = ipToLong(mask);
            const netInt = (ipInt & maskInt) >>> 0;
            const wildcard = (~maskInt) >>> 0;
            const broadcastInt = (netInt + wildcard) >>> 0;
            return { start: netInt, end: broadcastInt, netInt, broadcastInt };
        }

        function calculateSubnetInfo(ip, mask) {
            if (!validateIP(ip) || !validateIP(mask)) return null;
            const ipInt = ipToLong(ip);
            const maskInt = ipToLong(mask);
            const netInt = (ipInt & maskInt) >>> 0;
            const wildcard = (~maskInt) >>> 0;
            const broadcastInt = (netInt + wildcard) >>> 0;

            const totalAddresses = wildcard + 1;
            const firstHostInt = netInt + 1;
            const lastHostInt = broadcastInt - 1;

            return {
                networkIp: longToIp(netInt),
                broadcastIp: longToIp(broadcastInt),
                firstHostIp: totalAddresses > 2 ? longToIp(firstHostInt) : longToIp(netInt),
                lastHostIp: totalAddresses > 2 ? longToIp(lastHostInt) : longToIp(broadcastInt),
                totalAddresses,
                validHostsCount: Math.max(0, totalAddresses > 2 ? totalAddresses - 2 : totalAddresses)
            };
        }

        function getUsedRanges(excludeCurrentDevId = null, excludeIfName = null) {
            let ranges = [];
            
            // 1. Pega o que já está salvo nos outros dispositivos
            Object.values(devices).forEach(dev => {
                Object.entries(dev.interfaces).forEach(([ifName, intf]) => {
                    if (dev.id === excludeCurrentDevId && ifName === excludeIfName) return;
                    if (intf.ip && intf.mask) {
                        ranges.push(getSubnetRange(intf.ip, intf.mask));
                    }
                });
            });

            // 2. Pega TAMBÉM o que está digitado nos inputs do modal atual (caso aberto)
            if (activeConfigDeviceId) {
                const dev = devices[activeConfigDeviceId];
                Object.keys(dev.interfaces).forEach(ifName => {
                    if (activeConfigDeviceId === excludeCurrentDevId && ifName === excludeIfName) return;
                    const ipInput = document.getElementById(`cfg-ip-${ifName}`);
                    const maskInput = document.getElementById(`cfg-mask-${ifName}`);
                    if (ipInput && maskInput && ipInput.value.trim() && maskInput.value.trim()) {
                        ranges.push(getSubnetRange(ipInput.value.trim(), maskInput.value.trim()));
                    }
                });
            }

            return ranges;
        }

        function checkIPDuplicate(targetIp, excludeDevId = null, excludeIfName = null) {
            if (!targetIp) return false;
            for (let devId in devices) {
                for (let ifName in devices[devId].interfaces) {
                    if (devId === excludeDevId && ifName === excludeIfName) continue;
                    if (devices[devId].interfaces[ifName].ip === targetIp) {
                        return true;
                    }
                }
            }
            return false;
        }

        function findNextAvailableSubnet(prefixBits, excludeCurrentDevId = null, excludeIfName = null) {
            const baseIpInt = ipToLong('192.168.1.0');
            const blockSize = Math.pow(2, 32 - prefixBits);
            const usedRanges = getUsedRanges(excludeCurrentDevId, excludeIfName);

            let candidateStart = baseIpInt;

            while (candidateStart <= ipToLong('192.168.255.255')) {
                if (candidateStart % blockSize !== 0) {
                    candidateStart = Math.ceil(candidateStart / blockSize) * blockSize;
                }
                const candidateEnd = candidateStart + blockSize - 1;

                let hasOverlap = usedRanges.some(r => (candidateStart <= r.end && candidateEnd >= r.start));

                if (!hasOverlap) {
                    return {
                        networkIp: longToIp(candidateStart),
                        gatewayIp: longToIp(candidateStart + 1),
                        firstHostIp: longToIp(candidateStart + 1),
                        broadcastIp: longToIp(candidateEnd),
                        mask: cidrToMask(prefixBits),
                        cidr: '/' + prefixBits
                    };
                }
                candidateStart += blockSize;
            }
            return null;
        }

        function isReservedOrConflictingIP(ip, mask) {
            if (!ip || !mask) return { invalid: false };
            const ipInt = ipToLong(ip);
            const { netInt, broadcastInt } = getSubnetRange(ip, mask);

            if (ipInt === netInt) {
                return { invalid: true, reason: `O IP ${ip} é um endereço de REDE reservado!` };
            }
            if (ipInt === broadcastInt) {
                return { invalid: true, reason: `O IP ${ip} é um endereço de BROADCAST reservado!` };
            }
            return { invalid: false };
        }

        function addDevice(type, icon) {
            const id = `dev_${idCounter++}`;
            const template = deviceTemplates[type];
            let interfaces = {};
            
            template.ports.forEach(port => {
                const isDHCPClient = ['PC', 'Notebook', 'Smartphone'].includes(type);
                interfaces[port.name] = {
                    type: port.type,
                    ipMode: isDHCPClient ? 'dhcp' : 'static',
                    ip: '',
                    mask: '255.255.255.192',
                    gateway: '',
                    dns: '8.8.8.8',
                    mac: generateMAC(),
                    connectedToLink: []
                };
            });

            const rect = workspace.getBoundingClientRect();
            devices[id] = {
                id, type, icon, name: `${type}_${idCounter-1}`,
                x: rect.width / 2 - 27 + (Math.random() * 40 - 20),
                y: rect.height / 2 - 27 + (Math.random() * 40 - 20),
                interfaces,
                wifiStandard: template.wifiStandard || '802.11ac',
                wifiChannel: template.wifiChannel || 6,
                txPower: template.txPower || 20
            };

            setMode('move');
            renderAll();
        }

        function checkLineIntersection(x1, y1, x2, y2, x3, y3, x4, y4) {
            const denom = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
            if (denom === 0) return false;
            const ua = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / denom;
            const ub = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / denom;
            return (ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1);
        }

        function getWifiRange(ap) {
            let base = (ap.txPower || 20) * 8;
            if (weather === 'rain') base *= 0.85;
            if (weather === 'fog') base *= 0.70;
            return base * (1 - interferenceLevel / 200);
        }

        function renderAll() {
            renderDevices();
            renderLinks();
            renderCoverage();
            renderObstacles();
        }

        function renderDevices() {
    workspace.querySelectorAll('.node').forEach(n => n.remove());
    Object.values(devices).forEach(dev => {
        const el = document.createElement('div');
        let extraClass = '';
        if (pendingConnection.sourceId === dev.id) extraClass = 'selected';
        if (pingSourceId === dev.id) extraClass = 'ping-source';

        el.className = `node ${extraClass}`;
        el.id = dev.id;
        el.style.left = `${dev.x}px`;
        el.style.top = `${dev.y}px`;

        let ipSummary = '';
        Object.entries(dev.interfaces).forEach(([ifName, intf]) => {
            if (intf.ip && intf.mask) {
                const cidr = maskToCidr(intf.mask);
                const info = calculateSubnetInfo(intf.ip, intf.mask);
                if (info) {
                    ipSummary += `<br><span style="color:var(--success)">${ifName}: ${intf.ip}${cidr}</span><br><span style="color:#38bdf8; font-size:6px;">Rede: ${info.networkIp} | Bc: ${info.broadcastIp}</span>`;
                } else {
                    ipSummary += `<br><span style="color:var(--success)">${ifName}: ${intf.ip}${cidr}</span>`;
                }
            } else if (intf.ipMode === 'dhcp') {
                ipSummary += `<br><span style="color:var(--warning)">${ifName}: DHCP (Pendente)</span>`;
            }
        });

        el.innerHTML = `<div class="node-icon">${dev.icon}</div><div class="node-label">${dev.name}${ipSummary}</div>`;
        el.addEventListener('pointerdown', (e) => onNodePointerDown(e, dev.id));
        workspace.appendChild(el);
    });
}

        function getPointerPos(e) {
            const rect = workspace.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        function onNodePointerDown(e, id) {
            e.stopPropagation();
            const now = Date.now();

            if (now - lastTapTime < 300) {
                openConfigModal(id);
                return;
            }
            lastTapTime = now;

            if (mode === 'delete') {
                deleteDevice(id);
                return;
            }
            if (mode === 'connect') {
                handleConnectStep(id);
                return;
            }
            if (mode === 'ping') {
                handlePingStep(id);
                return;
            }
            if (mode === 'move') {
                draggedNodeId = id;
                const pos = getPointerPos(e);
                dragOffsetX = pos.x - devices[id].x;
                dragOffsetY = pos.y - devices[id].y;
            }
        }

        workspace.addEventListener('pointerdown', (e) => {
            if (mode === 'obstacle') {
                const pos = getPointerPos(e);
                activeWallStart = { x: pos.x, y: pos.y };
            }
        });

        workspace.addEventListener('pointermove', (e) => {
            const pos = getPointerPos(e);

            if (draggedNodeId && mode === 'move') {
                devices[draggedNodeId].x = Math.max(0, Math.min(workspace.clientWidth - 54, pos.x - dragOffsetX));
                devices[draggedNodeId].y = Math.max(0, Math.min(workspace.clientHeight - 54, pos.y - dragOffsetY));
                renderAll();
                return;
            }

            if (activeWallStart && mode === 'obstacle') {
                renderAll();
                const tempLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                tempLine.setAttribute('x1', activeWallStart.x);
                tempLine.setAttribute('y1', activeWallStart.y);
                tempLine.setAttribute('x2', pos.x);
                tempLine.setAttribute('y2', pos.y);
                tempLine.setAttribute('class', 'obstacle-wall');
                tempLine.setAttribute('style', 'stroke-dasharray: 4 4;');
                svgLayer.appendChild(tempLine);
                return;
            }

            updateTooltip(pos);
        });

        workspace.addEventListener('pointerup', (e) => {
            if (activeWallStart && mode === 'obstacle') {
                const pos = getPointerPos(e);
                const dist = Math.hypot(pos.x - activeWallStart.x, pos.y - activeWallStart.y);
                if (dist > 10) {
                    obstacles.push({ x1: activeWallStart.x, y1: activeWallStart.y, x2: pos.x, y2: pos.y });
                }
                activeWallStart = null;
                renderAll();
            }
            draggedNodeId = null;
        });

        function updateTooltip(pos) {
            let closestAP = null;
            let minDist = Infinity;

            Object.values(devices).forEach(dev => {
                if (dev.type === 'AccessPoint' || dev.interfaces['Wlan0']) {
                    const center = { x: dev.x + 27, y: dev.y + 27 };
                    const d = Math.hypot(pos.x - center.x, pos.y - center.y);
                    if (d < minDist) {
                        minDist = d;
                        closestAP = dev;
                    }
                }
            });

            if (closestAP && minDist <= getWifiRange(closestAP)) {
                let wallIntersections = 0;
                const apCenter = { x: closestAP.x + 27, y: closestAP.y + 27 };
                obstacles.forEach(w => {
                    if (checkLineIntersection(apCenter.x, apCenter.y, pos.x, pos.y, w.x1, w.y1, w.x2, w.y2)) {
                        wallIntersections++;
                    }
                });

                const rssi = Math.round(-30 - (20 * Math.log10(Math.max(1, minDist / 10))) - (wallIntersections * 12) - (interferenceLevel / 4));
                const quality = Math.max(0, Math.min(100, Math.round(2 * (rssi + 100))));
                const speed = Math.max(0, Math.round((quality / 100) * 866));

                tooltip.style.display = 'block';
                tooltip.style.left = `${pos.x + 15}px`;
                tooltip.style.top = `${pos.y + 15}px`;
                tooltip.innerHTML = `<strong>${closestAP.name}</strong><br>Sinal: ${rssi} dBm (${quality}%)<br>Velocidade: ${speed} Mbps`;
            } else {
                tooltip.style.display = 'none';
            }
        }

        function handleConnectStep(devId) {
            if (pendingConnection.step === 0) {
                openPortSelectionModal(devId, null);
            } else {
                if (pendingConnection.sourceId === devId) {
                    showToast("Não é possível conectar um dispositivo a ele mesmo!");
                    return;
                }
                openPortSelectionModal(devId, pendingConnection.portType);
            }
        }

        function openPortSelectionModal(devId, filterType) {
            const dev = devices[devId];
            const portList = document.getElementById('port-list');
            document.getElementById('port-modal-title').innerText = `Selecione a Interface em ${dev.name}`;
            portList.innerHTML = '';

            Object.entries(dev.interfaces).forEach(([ifName, intf]) => {
                if (filterType && intf.type !== filterType) return;

                const isUsed = links.some(l => 
                    (l.dev1 === devId && l.port1 === ifName) || 
                    (l.dev2 === devId && l.port2 === ifName)
                );

                const item = document.createElement('div');
                item.className = `port-item ${isUsed ? 'used' : ''}`;
                item.innerHTML = `<span>${ifName} [${intf.type}]</span><span>${isUsed ? 'Ocupada' : 'Livre'}</span>`;

                if (!isUsed) {
                    item.onclick = () => {
                        if (pendingConnection.step === 0) {
                            pendingConnection = { step: 1, sourceId: devId, sourcePort: ifName, portType: intf.type };
                            closeModals();
                            renderAll();
                            showToast(`Porta ${ifName} de ${dev.name} selecionada. Clique no destino!`);
                        } else {
                            createLink(pendingConnection.sourceId, pendingConnection.sourcePort, devId, ifName, intf.type);
                            pendingConnection = { step: 0, sourceId: null, sourcePort: null, portType: null };
                            closeModals();
                        }
                    };
                }
                portList.appendChild(item);
            });

            document.getElementById('port-modal').style.display = 'flex';
        }

        function createLink(dev1, port1, dev2, port2, type) {
            links.push({ id: `link_${Date.now()}`, dev1, port1, dev2, port2, type });
            triggerDHCPAutoConfig();
            renderAll();
            showToast("Conexão estabelecida com sucesso!");
        }

        function renderLinks() {
            svgLayer.innerHTML = '';
            links.forEach(l => {
                const d1 = devices[l.dev1];
                const d2 = devices[l.dev2];
                if (!d1 || !d2) return;

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', d1.x + 27);
                line.setAttribute('y1', d1.y + 27);
                line.setAttribute('x2', d2.x + 27);
                line.setAttribute('y2', d2.y + 27);

                let cableClass = 'cable-lan';
                if (l.type === 'WAN') cableClass = 'cable-wan';
                if (l.type === 'WLAN') cableClass = 'cable-wlan';
                if (l.type === 'FSO') cableClass = 'cable-fso';
                if (l.type === 'SAT') cableClass = 'cable-sat';
                if (l.type === 'BT') cableClass = 'cable-bt';
                if (l.type === 'NFC') cableClass = 'cable-nfc';

                line.setAttribute('class', cableClass);
                svgLayer.appendChild(line);
            });
        }

        function renderCoverage() {
            Object.values(devices).forEach(dev => {
                if (dev.type === 'AccessPoint' || dev.interfaces['Wlan0']) {
                    const radius = getWifiRange(dev);
                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('cx', dev.x + 27);
                    circle.setAttribute('cy', dev.y + 27);
                    circle.setAttribute('r', radius);
                    circle.setAttribute('class', 'coverage-circle');
                    svgLayer.appendChild(circle);
                }
            });
        }

        function renderObstacles() {
            obstacles.forEach(w => {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', w.x1);
                line.setAttribute('y1', w.y1);
                line.setAttribute('x2', w.x2);
                line.setAttribute('y2', w.y2);
                line.setAttribute('class', 'obstacle-wall');
                svgLayer.appendChild(line);
            });
        }

        function openConfigModal(devId) {
            activeConfigDeviceId = devId;
            const dev = devices[devId];
            document.getElementById('cfg-hostname').value = dev.name;
            const container = document.getElementById('config-interfaces');
            container.innerHTML = '';

            Object.entries(dev.interfaces).forEach(([ifName, intf]) => {
                const currentCidr = maskToCidr(intf.mask);
                const block = document.createElement('div');
                block.className = 'interface-block';
                block.innerHTML = `
                    <div class="interface-title">
                        <span>Interface: ${ifName} (${intf.type})</span>
                        <button class="small" onclick="autoAllocateSubnet('${ifName}')" style="background:var(--accent); color:#000;">⚡ Alocar Sub-rede Livre</button>
                    </div>
                    <div class="config-row">
                        <label>Modo IP:</label>
                        <select id="cfg-mode-${ifName}" onchange="toggleIPInputs('${ifName}')">
                            <option value="static" ${intf.ipMode === 'static' ? 'selected' : ''}>Estático / Manual</option>
                            <option value="dhcp" ${intf.ipMode === 'dhcp' ? 'selected' : ''}>DHCP Automático</option>
                        </select>
                    </div>
                    <div class="config-row">
                        <label>Máscara (CIDR):</label>
                        <select id="cfg-cidr-${ifName}" onchange="updateSubnetCalculation('${ifName}')">
                            ${availableCIDRs.map(opt => `<option value="${opt.cidr}" ${opt.cidr === currentCidr ? 'selected' : ''}>${opt.cidr} (${opt.mask})</option>`).join('')}
                        </select>
                    </div>
                    <div class="config-row">
                        <label>Endereço IPv4:</label>
                        <input type="text" id="cfg-ip-${ifName}" value="${intf.ip}" ${intf.ipMode === 'dhcp' ? 'readonly' : ''} oninput="updateSubnetCalculation('${ifName}')">
                    </div>
                    <div class="config-row">
                        <label>Máscara Sub-rede:</label>
                        <input type="text" id="cfg-mask-${ifName}" value="${intf.mask}" readonly style="opacity:0.7;">
                    </div>
                    <div class="config-row">
                        <label>Default Gateway:</label>
                        <input type="text" id="cfg-gw-${ifName}" value="${intf.gateway}" ${intf.ipMode === 'dhcp' ? 'readonly' : ''}>
                    </div>
                    <div class="config-row">
                        <label>Servidor DNS:</label>
                        <input type="text" id="cfg-dns-${ifName}" value="${intf.dns}">
                    </div>

                    <!-- CAIXA DE CÁLCULO DE SUB-REDE EM TEMPO REAL DIDÁTICA -->
                    <div class="subnet-info-box">
                        <div><strong>Início da Rede (Network):</strong> <span id="info-net-${ifName}" class="val">-</span></div>
                        <div><strong>Primeiro Host:</strong> <span id="info-first-${ifName}" class="val">-</span></div>
                        <div><strong>Último Host:</strong> <span id="info-last-${ifName}" class="val">-</span></div>
                        <div><strong>Fim (Broadcast):</strong> <span id="info-bc-${ifName}" class="val">-</span></div>
                        <div><strong>Total de Hosts Úteis:</strong> <span id="info-range-${ifName}" class="val">-</span></div>
                    </div>
                `;
                container.appendChild(block);
                
                // Calcula de imediato com os valores atuais
                setTimeout(() => updateSubnetCalculation(ifName), 0);
            });

            document.getElementById('config-modal').style.display = 'flex';
        }

        function updateMaskFromCIDR(ifName) {
            const cidr = document.getElementById(`cfg-cidr-${ifName}`).value;
            const bits = cidrToBits(cidr);
            document.getElementById(`cfg-mask-${ifName}`).value = cidrToMask(bits);
        }

        function updateSubnetCalculation(ifName) {
            updateMaskFromCIDR(ifName);
            const ip = document.getElementById(`cfg-ip-${ifName}`).value.trim();
            const mask = document.getElementById(`cfg-mask-${ifName}`).value.trim();

            const infoNet = document.getElementById(`info-net-${ifName}`);
            const infoFirst = document.getElementById(`info-first-${ifName}`);
            const infoLast = document.getElementById(`info-last-${ifName}`);
            const infoBc = document.getElementById(`info-bc-${ifName}`);
            const infoRange = document.getElementById(`info-range-${ifName}`);

            const info = calculateSubnetInfo(ip, mask);
            if (info) {
                infoNet.innerText = info.networkIp;
                infoFirst.innerText = info.firstHostIp;
                infoLast.innerText = info.lastHostIp;
                infoBc.innerText = info.broadcastIp;
                infoRange.innerText = `${info.validHostsCount} hosts utilizáveis`;
            } else {
                infoNet.innerText = '-';
                infoFirst.innerText = '-';
                infoLast.innerText = '-';
                infoBc.innerText = '-';
                infoRange.innerText = '-';
            }
        }

        function toggleIPInputs(ifName) {
            const modeVal = document.getElementById(`cfg-mode-${ifName}`).value;
            const ipInput = document.getElementById(`cfg-ip-${ifName}`);
            const gwInput = document.getElementById(`cfg-gw-${ifName}`);
            if (modeVal === 'dhcp') {
                ipInput.readOnly = true;
                gwInput.readOnly = true;
            } else {
                ipInput.readOnly = false;
                gwInput.readOnly = false;
            }
        }

        function autoAllocateSubnet(ifName) {
            const cidrVal = document.getElementById(`cfg-cidr-${ifName}`).value;
            const bits = cidrToBits(cidrVal);
            const blockSize = Math.pow(2, 32 - bits);
            
            const usedRanges = getUsedRanges(activeConfigDeviceId, ifName);
            let candidateStart = ipToLong('192.168.1.0');

            while (candidateStart <= ipToLong('192.168.255.255')) {
                if (candidateStart % blockSize !== 0) {
                    candidateStart = Math.ceil(candidateStart / blockSize) * blockSize;
                }
                const candidateEnd = candidateStart + blockSize - 1;

                let hasOverlap = usedRanges.some(r => (candidateStart <= r.end && candidateEnd >= r.start));

                if (!hasOverlap) {
                    const allocation = {
                        networkIp: longToIp(candidateStart),
                        gatewayIp: longToIp(candidateStart + 1),
                        firstHostIp: longToIp(candidateStart + 1),
                        broadcastIp: longToIp(candidateEnd),
                        mask: cidrToMask(bits),
                        cidr: '/' + bits
                    };

                    document.getElementById(`cfg-ip-${ifName}`).value = allocation.firstHostIp;
                    document.getElementById(`cfg-mask-${ifName}`).value = allocation.mask;
                    document.getElementById(`cfg-gw-${ifName}`).value = allocation.gatewayIp;
                    updateSubnetCalculation(ifName);
                    showToast(`Sub-rede alocada: ${allocation.networkIp}${allocation.cidr}`);
                    return;
                }
                candidateStart += blockSize;
            }
            showToast("Erro: Nenhuma sub-rede livre disponível para esse bloco CIDR!");
        }

        function saveConfig() {
            const dev = devices[activeConfigDeviceId];
            dev.name = document.getElementById('cfg-hostname').value;

            for (let ifName in dev.interfaces) {
                const modeVal = document.getElementById(`cfg-mode-${ifName}`).value;
                const ipVal = document.getElementById(`cfg-ip-${ifName}`).value.trim();
                const maskVal = document.getElementById(`cfg-mask-${ifName}`).value.trim();
                const gwVal = document.getElementById(`cfg-gw-${ifName}`).value.trim();
                const dnsVal = document.getElementById(`cfg-dns-${ifName}`).value.trim();

                if (modeVal === 'static' && ipVal !== '') {
                    if (checkIPDuplicate(ipVal, activeConfigDeviceId, ifName)) {
                        showToast(`❌ Erro: O IP ${ipVal} já está em uso por outro dispositivo!`);
                        return;
                    }

                    const checkReserved = isReservedOrConflictingIP(ipVal, maskVal);
                    if (checkReserved.invalid) {
                        showToast(`❌ Erro: ${checkReserved.reason}`);
                        return;
                    }
                }

                dev.interfaces[ifName].ipMode = modeVal;
                dev.interfaces[ifName].ip = ipVal;
                dev.interfaces[ifName].mask = maskVal;
                dev.interfaces[ifName].gateway = gwVal;
                dev.interfaces[ifName].dns = dnsVal;
            }

            triggerDHCPAutoConfig();
            closeModals();
            renderAll();
            showToast("Configurações gravadas com sucesso!");
        }

        function triggerDHCPAutoConfig() {
            Object.values(devices).forEach(dev => {
                Object.entries(dev.interfaces).forEach(([ifName, intf]) => {
                    if (intf.ipMode === 'dhcp') {
                        const connectedLink = links.find(l => 
                            (l.dev1 === dev.id && l.port1 === ifName) || 
                            (l.dev2 === dev.id && l.port2 === ifName)
                        );

                        if (connectedLink) {
                            const neighborId = connectedLink.dev1 === dev.id ? connectedLink.dev2 : connectedLink.dev1;
                            const neighborPort = connectedLink.dev1 === dev.id ? connectedLink.port2 : connectedLink.port1;
                            const neighborIntf = devices[neighborId].interfaces[neighborPort];

                            if (neighborIntf && neighborIntf.ip && neighborIntf.mask) {
                                const { netInt, broadcastInt } = getSubnetRange(neighborIntf.ip, neighborIntf.mask);
                                let candidate = netInt + 2;

                                while (candidate < broadcastInt) {
                                    const candidateIpStr = longToIp(candidate);
                                    if (!checkIPDuplicate(candidateIpStr, dev.id, ifName) && candidateIpStr !== neighborIntf.ip) {
                                        intf.ip = candidateIpStr;
                                        intf.mask = neighborIntf.mask;
                                        intf.gateway = neighborIntf.ip;
                                        break;
                                    }
                                    candidate++;
                                }
                            }
                        } else {
                            intf.ip = '';
                            intf.gateway = '';
                        }
                    }
                });
            });
        }

        function handlePingStep(devId) {
            if (!pingSourceId) {
                pingSourceId = devId;
                renderAll();
                showToast(`Origem do Ping selecionada: ${devices[devId].name}. Agora escolha o Destino!`);
            } else {
                if (pingSourceId === devId) {
                    pingSourceId = null;
                    renderAll();
                    return;
                }
                runPingSimulation(pingSourceId, devId);
                pingSourceId = null;
                renderAll();
            }
        }

        function runPingSimulation(srcId, dstId) {
            const src = devices[srcId];
            const dst = devices[dstId];

            const srcIP = Object.values(src.interfaces).find(i => i.ip)?.ip;
            const dstIP = Object.values(dst.interfaces).find(i => i.ip)?.ip;

            if (!srcIP || !dstIP) {
                showToast("⚡ PING FALHOU: Um dos dispositivos não possui endereço IPv4 válido!");
                return;
            }

            const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            dot.setAttribute('r', 6);
            dot.setAttribute('class', 'packet-dot');
            dot.setAttribute('fill', '#10b981');
            svgLayer.appendChild(dot);

            let progress = 0;
            const interval = setInterval(() => {
                progress += 0.05;
                dot.setAttribute('cx', src.x + 27 + (dst.x - src.x) * progress);
                dot.setAttribute('cy', src.y + 27 + (dst.y - src.y) * progress);

                if (progress >= 1) {
                    clearInterval(interval);
                    dot.remove();
                    showToast(`⚡ PING SUCESSO! Resposta de ${dstIP}: bytes=32 tempo=2ms TTL=128`);
                }
            }, 30);
        }

        function deleteDevice(id) {
            delete devices[id];
            links = links.filter(l => l.dev1 !== id && l.dev2 !== id);
            renderAll();
            showToast("Dispositivo e conexões associadas removidos.");
        }

        function clearWorkspace() {
            devices = {};
            links = [];
            obstacles = [];
            idCounter = 1;
            renderAll();
            showToast("Cenário limpo com sucesso!");
        }

        function clearObstacles() {
            obstacles = [];
            renderAll();
            showToast("Paredes removidas!");
        }

        function applyWeather() {
            weather = document.getElementById('weather-select').value;
            renderAll();
        }

        function applyInterference() {
            interferenceLevel = parseInt(document.getElementById('interference-slider').value, 10);
            document.getElementById('interference-value').innerText = `${interferenceLevel}%`;
            renderAll();
        }

        function closeModals() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
        }

        function exportJSON() {
            const data = JSON.stringify({ devices, links, obstacles, idCounter }, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `rede_tcp_ip_${Date.now()}.json`;
            a.click();
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    devices = parsed.devices || {};
                    links = parsed.links || [];
                    obstacles = parsed.obstacles || [];
                    idCounter = parsed.idCounter || 1;
                    renderAll();
                    showToast("Cenário carregado com sucesso!");
                } catch (err) {
                    showToast("Erro ao ler arquivo JSON!");
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
