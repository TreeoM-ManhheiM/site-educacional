  let missaoAtual = 0;
  let blocosSelecionados = [];
  let errosMissao = 0;      // 0,1,2,3...
  let dicaExibidaNivel = 0;  // 0 = nenhuma, 1 = dica1, 2 = dica2, 3 = dica3

  function popularSelect() {
    todasMissoes.forEach((m, idx) => {
      const option = document.createElement('option');
      option.value = idx;
      option.textContent = `${idx+1}. ${m.titulo}`;
      selectMissao.appendChild(option);
    });
  }

  function atualizarDicas() {
    const missao = todasMissoes[missaoAtual];
    if (errosMissao === 0) {
      dicasArea.innerHTML = '';
      dicaExibidaNivel = 0;
    } else if (errosMissao === 1 && dicaExibidaNivel < 1) {
      dicaExibidaNivel = 1;
      dicasArea.innerHTML = `<div class="dica-progressiva"><strong>📌 Dica 1 de 3</strong><br>${missao.dicas[0]}</div>`;
    } else if (errosMissao === 2 && dicaExibidaNivel < 2) {
      dicaExibidaNivel = 2;
      dicasArea.innerHTML = `<div class="dica-progressiva"><strong>📌 Dica 2 de 3</strong><br>${missao.dicas[1]}</div>`;
    } else if (errosMissao >= 3 && dicaExibidaNivel < 3) {
      dicaExibidaNivel = 3;
      // Exibe a terceira dica (que já contém o código correto) + botão aplicar
      dicasArea.innerHTML = `
        <div class="dica-progressiva">
          <strong>📌 Dica 3 de 3 (Resposta)</strong><br>
          ${missao.dicas[2]}
          <div><button id="aplicar-resposta-final" class="btn-aplicar">✨ Aplicar esta resposta no código</button></div>
        </div>
      `;
      const aplicarBtn = document.getElementById('aplicar-resposta-final');
      if (aplicarBtn) {
        aplicarBtn.addEventListener('click', () => {
          blocosSelecionados = [...missao.codigoEsperado];
          exibirCodigo();
          feedbackDiv.innerHTML = '';
          // Opcional: resetar contador de erros para não atrapalhar novas tentativas
          errosMissao = 0;
          dicaExibidaNivel = 0;
          dicasArea.innerHTML = '';
          atualizarContador();
        });
      }
    }
  }

  function atualizarContador() {
    if (errosMissao > 0) {
      erroContadorDiv.style.display = 'block';
      erroContadorDiv.innerHTML = `❌ Tentativas erradas: ${errosMissao}/3. A cada erro, uma nova dica aparecerá.`;
    } else {
      erroContadorDiv.style.display = 'none';
    }
    atualizarDicas();
  }

  function registrarErro(mensagem) {
    errosMissao++;
    atualizarContador();
    feedbackDiv.className = 'feedback erro';
    feedbackDiv.innerHTML = `❌ ${mensagem}<br>🔁 Tentativas erradas: ${errosMissao}/3.`;
  }

  function verificar() {
    const esperado = todasMissoes[missaoAtual].codigoEsperado;
    if (blocosSelecionados.length !== esperado.length) {
      registrarErro(`Número de linhas incorreto. Você usou ${blocosSelecionados.length}, esperado ${esperado.length}.`);
      return;
    }
    let correto = true;
    for (let i = 0; i < esperado.length; i++) {
      if (blocosSelecionados[i] !== esperado[i]) {
        correto = false;
        break;
      }
    }
    if (correto) {
      feedbackDiv.className = 'feedback sucesso';
      feedbackDiv.innerHTML = `🎉 Código correto! Missão "${todasMissoes[missaoAtual].titulo}" concluída!`;
      // Resetar estado da missão atual
      errosMissao = 0;
      dicaExibidaNivel = 0;
      dicasArea.innerHTML = '';
      atualizarContador();
    } else {
      registrarErro(`Código incorreto. Verifique ordem, indentação e blocos.`);
    }
  }

  function exibirCodigo() {
    codigoDiv.innerHTML = '';
    if (blocosSelecionados.length === 0) {
      codigoDiv.innerHTML = '<span style="color:#6b7280;">Nenhum bloco adicionado. Clique nos blocos acima.</span>';
      return;
    }
    blocosSelecionados.forEach((linha, idx) => {
      const linhaDiv = document.createElement('div');
      linhaDiv.className = 'linha-codigo';
      linhaDiv.innerHTML = `<code>${linha.replace(/ /g, '&nbsp;')}</code><span class="remover-linha" data-idx="${idx}">❌</span>`;
      codigoDiv.appendChild(linhaDiv);
    });
    document.querySelectorAll('.remover-linha').forEach(el => {
      el.addEventListener('click', (e) => {
        const idx = parseInt(e.target.getAttribute('data-idx'));
        blocosSelecionados.splice(idx, 1);
        exibirCodigo();
      });
    });
  }

  function gerarPaleta() {
    const esperado = todasMissoes[missaoAtual].codigoEsperado;
    let blocos = [...esperado];
    const distracoes = [
      "break", "continue", "print('errado')", "for i in range(5):", 
      "    pass", "while True:", "if x == 0:", "else:", "    print('fim')",
      "for i in range(10):", "    print(i)", "if n == 0:", "    break"
    ];
    for (let d of distracoes) {
      if (!blocos.includes(d) && blocos.length < 14) blocos.push(d);
    }
    for (let i = blocos.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [blocos[i], blocos[j]] = [blocos[j], blocos[i]];
    }
    paletaDiv.innerHTML = '';
    blocos.forEach(bloco => {
      const blocoEl = document.createElement('div');
      blocoEl.className = 'bloco';
      blocoEl.textContent = bloco;
      blocoEl.addEventListener('click', () => {
        blocosSelecionados.push(bloco);
        exibirCodigo();
      });
      paletaDiv.appendChild(blocoEl);
    });
  }

  function limparTudo() {
    blocosSelecionados = [];
    exibirCodigo();
    feedbackDiv.innerHTML = '';
  }

  function resetarMissao() {
    blocosSelecionados = [];
    errosMissao = 0;
    dicaExibidaNivel = 0;
    dicasArea.innerHTML = '';
    exibirCodigo();
    feedbackDiv.innerHTML = '';
    gerarPaleta();
    atualizarContador();
  }

  function carregarMissao() {
    const m = todasMissoes[missaoAtual];
    storyBox.innerHTML = `<div class="story-title">${m.titulo}</div>${m.historia}`;
    dicaInicialDiv.innerHTML = `💡 Dica inicial: ${m.dicaInicial}`;
    blocosSelecionados = [];
    errosMissao = 0;
    dicaExibidaNivel = 0;
    dicasArea.innerHTML = '';
    exibirCodigo();
    gerarPaleta();
    feedbackDiv.innerHTML = '';
    atualizarContador();
  }

  selectMissao.addEventListener('change', (e) => {
    missaoAtual = parseInt(e.target.value);
    carregarMissao();
  });

  verificarBtn.addEventListener('click', verificar);
  limparBtn.addEventListener('click', limparTudo);
  resetarBtn.addEventListener('click', resetarMissao);

  popularSelect();
  carregarMissao();
</script>
</body>
</html>
