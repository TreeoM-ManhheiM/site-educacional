<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title> VENDAS - 2ª SERIE B - MANHÃ</title>

  <style>
    :root {
      --bg: #0f172a;
      --card: #ffffff;
      --text: #111827;
      --muted: #475569;
      --acc: #2563eb;
      --ring: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Helvetica, Arial;
      background-color: #f1f5f9;
    }

    header {
      background: var(--bg);
      color: #fff;
      padding: 28px 16px;
    }

    header .wrap {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 6px 0;
      font-size: clamp(1.4rem, 2.6vw, 2rem);
    }

    p.lead {
      margin: 0;
      color: #cbd5e1;
      font-size: 0.95rem;
    }

    main {
      max-width: 1100px;
      margin: 28px auto;
      padding: 0 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
    }

    .col {
      grid-column: span 12;
    }

    @media (min-width: 700px) {
      .col { grid-column: span 6; }
    }

    @media (min-width: 1000px) {
      .col { grid-column: span 4; }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--ring);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, .06);
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%; /* Garante que os cards tenham a mesma altura na linha */
    }

    .card h2 {
      margin: 0;
      font-size: 1.15rem;
      color: #0f172a;
      border-bottom: 2px solid var(--acc);
      padding-bottom: 8px;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .links {
      margin-top: auto; /* Empurra os links para o final do card */
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .links a {
      display: inline-block;
      text-decoration: none;
      color: #fff;
      background: var(--acc);
      padding: 10px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .links a:hover {
      filter: brightness(0.9);
      transform: translateX(4px);
    }

    footer {
      max-width: 1100px;
      margin: 24px auto 40px;
      padding: 0 16px;
      color: #475569;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    footer a {
      color: var(--acc);
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <h1>VENDAS</h1>
      <p class="lead"> VENDAS - 2ª SERIE B MANHÃ — Portal das disciplinas</p>
  </div>
  </header>
  <main>
    <div class="grid">
      
      <section class="col">
        <div class="card">
          <h2>COMPORTAMENTO, LEGISLAÇÃO E DIREITO DO CONSUMIDOR</h2>
          <p>Recursos Educacionais para Prática de Vendas.</p>
                      
          <div class="links">
            <a href="/turmas/vendas/conteudo.html">CONTEÚDO</a>           
        </div>
      </section>
       
      <div class="links">
            <a href="/turmas/vendas/iacdc.html">IA CDC </a>           
        </div>
      </section>

    </div>
  </main>

  <footer>
    <span>© 2026 VENDAS - 2ª SERIE B - MANHÃ</span>
    <a href="/index.html">Voltar ao início</a>
  </footer>
</body>
</html>
