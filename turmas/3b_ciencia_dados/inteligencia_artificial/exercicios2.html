<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>CNN - Reconhecimento de Dígitos</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
        canvas { background: white; border-radius: 16px; box-shadow: 0 0 0 3px #ff9800; cursor: crosshair; width: 280px; height: 280px; }
        button { background: #ff9800; border: none; padding: 10px 20px; border-radius: 40px; font-weight: bold; color: white; cursor: pointer; margin: 10px; }
        .pred { background: #1e3c72; margin-top: 20px; padding: 15px; border-radius: 40px; color: white; font-size: 1.5rem; }
        .pred span { font-size: 3rem; background: #ff9800; padding: 0 20px; border-radius: 40px; }
        .status { background: #eef2f7; border-radius: 16px; padding: 10px; margin-top: 20px; font-family: monospace; }
    </style>
</head>
<body>
<h2>🧠 Simulador CNN - Desenhe o dígito</h2>
<canvas id="drawCanvas" width="280" height="280"></canvas>
<div>
    <button id="clearBtn">🗑️ Limpar</button>
    <button id="trainBtn">🚀 TREINAR</button>
    <button id="predictBtn">🔍 RECONHECER</button>
</div>
<div class="pred">🤖 Resultado: <span id="result">?</span></div>
<div class="status" id="status">✅ Clique em TREINAR (dados já estão aqui)</div>

<script>
    // =============================================
    // 1. Dados de treino (dígitos simples para teste)
    // =============================================
    function gerarImagem(digito, offset) {
        const img = new Array(784).fill(0);
        const cx = 14 + (offset % 5) - 2;
        const cy = 14 + (Math.floor(offset / 5) % 5) - 2;
        for (let y = 0; y < 28; y++) {
            for (let x = 0; x < 28; x++) {
                const dx = x - cx;
                const dy = y - cy;
                let val = 0;
                if (digito === 0) val = Math.hypot(dx, dy) < 6 ? 1 : 0;
                else if (digito === 1) val = (Math.abs(dx) < 3 && Math.abs(dy) < 10) ? 1 : 0;
                else if (digito === 2) val = (Math.abs(dy) < 5 && Math.abs(dx) < 8) || (dy > 0 && dx < -2 && dx > -8) ? 1 : 0;
                else if (digito === 3) val = (Math.abs(dy) < 5 && Math.abs(dx) < 8) || (Math.abs(dy - 6) < 4 && Math.abs(dx) < 8) ? 1 : 0;
                else if (digito === 4) val = (Math.abs(dx) < 3 && Math.abs(dy) < 9) || (dy > -3 && dy < 3 && dx > 0 && dx < 10) ? 1 : 0;
                else if (digito === 5) val = (Math.abs(dy) < 5 && Math.abs(dx) < 8) || (dy < 0 && dx > 0 && dx < 10) ? 1 : 0;
                else if (digito === 6) val = Math.hypot(dx, dy + 3) < 7 || (Math.abs(dx) < 5 && dy > -3 && dy < 7) ? 1 : 0;
                else if (digito === 7) val = (Math.abs(dx) < 10 && dy < 6 && dy > -10) ? 1 : 0;
                else if (digito === 8) val = Math.hypot(dx, dy) < 7 ? 1 : 0;
                else if (digito === 9) val = Math.hypot(dx, dy - 3) < 7 || (dy < -3 && Math.abs(dx) < 4) ? 1 : 0;
                img[y * 28 + x] = Math.min(1, Math.max(0, val + (Math.random() - 0.5) * 0.15));
            }
        }
        return img;
    }
    // 900 treino (90 por dígito), 200 teste (20 por dígito)
    const trainImgs = [], trainLbls = [], testImgs = [], testLbls = [];
    for (let d = 0; d <= 9; d++) {
        for (let i = 0; i < 90; i++) { trainImgs.push(gerarImagem(d, i)); trainLbls.push(d); }
        for (let i = 0; i < 20; i++) { testImgs.push(gerarImagem(d, i + 200)); testLbls.push(d); }
    }
    for (let i = trainImgs.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i+1)); [trainImgs[i], trainImgs[j]] = [trainImgs[j], trainImgs[i]]; [trainLbls[i], trainLbls[j]] = [trainLbls[j], trainLbls[i]]; }
    const xTrain = tf.tensor4d(trainImgs, [trainImgs.length, 28, 28, 1]);
    const yTrain = tf.oneHot(tf.tensor1d(trainLbls, 'int32'), 10);
    const xTest = tf.tensor4d(testImgs, [testImgs.length, 28, 28, 1]);
    const yTest = tf.oneHot(tf.tensor1d(testLbls, 'int32'), 10);
    document.getElementById('status').innerHTML = `✅ ${trainImgs.length} treino, ${testImgs.length} teste. Clique TREINAR.`;

    // =============================================
    // 2. Canvas e desenho
    // =============================================
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, 280, 280);
    ctx.lineWidth = 24;
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'black';
    function getTensor() {
        const tmp = document.createElement('canvas');
        tmp.width = 28; tmp.height = 28;
        tmp.getContext('2d').drawImage(canvas, 0, 0, 28, 28);
        const img = tmp.getContext('2d').getImageData(0, 0, 28, 28);
        const pixels = new Array(784);
        for (let i = 0; i < img.data.length; i+=4) {
            const gray = (img.data[i] + img.data[i+1] + img.data[i+2]) / 3;
            pixels[i/4] = (255 - gray) / 255;
        }
        return tf.tensor4d(pixels, [1, 28, 28, 1]);
    }
    function start(e) { drawing = true; draw(e); }
    function end() { drawing = false; ctx.beginPath(); }
    function draw(e) {
        if (!drawing) return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let cx, cy;
        if (e.touches) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
        else { cx = e.clientX; cy = e.clientY; }
        let x = Math.min(280, Math.max(0, (cx - rect.left) * scaleX));
        let y = Math.min(280, Math.max(0, (cy - rect.top) * scaleY));
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
    }
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', end);
    document.getElementById('clearBtn').onclick = () => {
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, 280, 280);
        document.getElementById('result').innerText = '?';
    };

    // =============================================
    // 3. Modelo e treinamento
    // =============================================
    let model = null, training = false, stop = false, currentFit = null;
    function criarModelo() {
        const m = tf.sequential();
        m.add(tf.layers.conv2d({ inputShape: [28,28,1], filters: 16, kernelSize: 3, activation: 'relu', padding: 'same' }));
        m.add(tf.layers.maxPooling2d({ poolSize: [2,2] }));
        m.add(tf.layers.conv2d({ filters: 32, kernelSize: 3, activation: 'relu', padding: 'same' }));
        m.add(tf.layers.maxPooling2d({ poolSize: [2,2] }));
        m.add(tf.layers.flatten());
        m.add(tf.layers.dense({ units: 128, activation: 'relu' }));
        m.add(tf.layers.dropout({ rate: 0.25 }));
        m.add(tf.layers.dense({ units: 10, activation: 'softmax' }));
        m.compile({ optimizer: tf.train.adam(0.001), loss: 'categoricalCrossentropy', metrics: ['accuracy'] });
        return m;
    }
    async function treinar() {
        if (training) { document.getElementById('status').innerHTML += '<br>⚠️ Já treinando'; return; }
        training = true;
        document.getElementById('trainBtn').disabled = true;
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = '🚀 Treinando 4 épocas...<br>';
        const novoModelo = criarModelo();
        model = novoModelo;
        try {
            currentFit = await novoModelo.fit(xTrain, yTrain, {
                batchSize: 32, epochs: 4,
                validationData: [xTest, yTest],
                callbacks: {
                    onEpochEnd: (epoch, logs) => {
                        const acc = (logs.acc * 100).toFixed(1);
                        const valAcc = (logs.val_acc * 100).toFixed(1);
                        statusDiv.innerHTML += `Época ${epoch+1}/4 - acurácia treino: ${acc}% | val: ${valAcc}%<br>`;
                        if (epoch+1 === 4) {
                            statusDiv.innerHTML += `🎉 Concluído! Acurácia final: ${valAcc}%<br>`;
                            training = false;
                            document.getElementById('trainBtn').disabled = false;
                        }
                    }
                }
            });
        } catch(err) {
            statusDiv.innerHTML += `❌ Erro: ${err.message}<br>`;
        } finally { training = false; document.getElementById('trainBtn').disabled = false; currentFit = null; }
    }
    async function reconhecer() {
        if (!model) { document.getElementById('result').innerText = '?'; alert('Clique em TREINAR primeiro'); return; }
        const tensor = getTensor();
        const pred = model.predict(tensor);
        const classe = pred.argMax(1).dataSync()[0];
        document.getElementById('result').innerText = classe;
        tensor.dispose(); pred.dispose();
    }
    document.getElementById('trainBtn').onclick = treinar;
    document.getElementById('predictBtn').onclick = reconhecer;
</script>
</body>
</html>
