<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop Infinito - Missão While</title>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(145deg, #1a472a 0%, #0e2a1a 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: #fef7e0;
            border-radius: 48px;
            padding: 25px;
            border: 4px solid #ffd966;
            box-shadow: 0 20px 35px rgba(0,0,0,0.4);
        }
        h1 { text-align: center; color: #2c3e2f; text-shadow: 3px 3px 0 #ffd966; margin-top: 0; margin-bottom: 10px; }
        .sub { text-align: center; font-style: italic; color: #2d6a4f; margin-bottom: 25px; }
        .lobby, .game { display: none; }
        .active { display: block; }
        input, button {
            font-family: monospace;
            font-size: 1.1rem;
            padding: 10px 16px;
            margin: 8px;
            border-radius: 30px;
            border: none;
        }
        input { background: white; border: 2px solid #b7b78a; width: 220px; text-align: center; }
        button {
            background: #ffb347;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
        }
        button:active { transform: scale(0.96); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .player-list {
            background: #e9f5e6;
            border-radius: 28px;
            padding: 15px;
            margin: 20px 0;
        }
        .player-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            margin: 5px 0;
            background: #fff2cf;
            border-radius: 40px;
            font-weight: bold;
        }
        .ready-badge { background: #2b7a2a; color: white; padding: 2px 12px; border-radius: 20px; }
        .not-ready { background: #b00020; color: white; padding: 2px 12px; border-radius: 20px; }
        .board-area { background: #e9f5e6; border-radius: 28px; padding: 20px; margin-bottom: 25px; }
        .track { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 20px 0; }
        .tile {
            width: 65px; height: 65px; background: #fff2cf; border-radius: 18px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.1rem; box-shadow: 0 4px 0 #a5936e;
            border: 1px solid #eedd99;
        }
        .tile.phase1 { background: #b9fbc0; border-bottom: 6px solid #2b7a2a; }
        .tile.phase2 { background: #90e0ef; border-bottom: 6px solid #0077b6; }
        .tile.phase3 { background: #ffb3b3; border-bottom: 6px solid #b00020; }
        .tile.phase4 { background: #ffd966; border-bottom: 6px solid #c97e00; }
        .tile.special { background: radial-gradient(circle at 30% 20%, #fff0b5, #ffe0a3); box-shadow: 0 0 0 2px gold; }
        .pawn {
            display: inline-block; width: 22px; height: 22px; background: #2c3e2f;
            border-radius: 50%; margin: 2px; text-align: center; line-height: 22px;
            font-size: 11px; font-weight: bold; color: white;
        }
        .players-on-tile { margin-top: 5px; display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; }
        .controls { background: #282c35; padding: 20px; border-radius: 30px; color: white; margin-top: 20px; }
        .dice { background: white; width: 70px; height: 70px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 2.8rem; margin: 10px auto; color: #b51c1c; }
        .card-area { background: #f9eec1; padding: 18px; border-radius: 28px; margin-top: 20px; font-family: monospace; color: #1f2a2e; }
        .turn-indicator { background: #000000aa; backdrop-filter: blur(4px); border-radius: 40px; padding: 6px 16px; display: inline-block; font-size: 0.9rem; }
        #infoLog { max-height: 120px; overflow-y: auto; font-size: 0.8rem; margin-top: 15px; background: #1f2a2e; padding: 10px; border-radius: 20px; }
        @media (max-width: 800px) {
            .tile { width: 45px; height: 45px; font-size: 0.8rem; }
            .pawn { width: 16px; height: 16px; font-size: 8px; line-height: 16px; }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>⟳ LOOP INFINITO — MISSÃO WHILE</h1>
    <div class="sub">🐍 Programe. Avance. Vença o loop infinito.</div>

    <!-- TELA DE LOBBY -->
    <div id="lobbyScreen" class="lobby active">
        <div style="text-align: center; margin-bottom: 20px;">
            <input type="text" id="playerNameInput" placeholder="Seu nome (ex: Vermelho)" maxlength="20">
            <input type="text" id="roomNameInput" placeholder="Nome da sala (ex: turmaA)">
            <button id="joinRoomBtn">🎮 ENTRAR NA SALA</button>
        </div>
        <div id="lobbyInfo" style="display: none;">
            <div class="player-list">
                <h3>👥 Equipes na sala <span id="roomNameDisplay"></span></h3>
                <div id="playersList"></div>
                <button id="readyBtn" style="width: 100%; margin-top: 15px;">✅ ESTOU PRONTO</button>
                <p id="waitingMsg" style="text-align: center; color: #b00020; font-weight: bold; margin-top: 10px;"></p>
            </div>
        </div>
    </div>

    <!-- TELA DO JOGO -->
    <div id="gameScreen" class="game">
        <div class="board-area">
            <div id="boardTrack" class="track"></div>
            <div class="turn-indicator" id="turnStatus" style="margin-top:10px;">🎲 Aguardando...</div>
        </div>
        <div class="controls">
            <div style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: space-between;">
                <div style="flex:1; text-align:center;">
                    <h3>🎲 Ação</h3>
                    <div class="dice" id="diceResult">⚀</div>
                    <button id="rollBtn" disabled>ROLAR DADO</button>
                </div>
            </div>
            <div class="card-area" id="cardMessage">💡 <strong>Desafio aparecerá aqui</strong></div>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <input type="text" id="answerInput" placeholder="Sua resposta..." style="flex:3;">
                <button id="submitAnswerBtn" disabled style="flex:1;">✅ RESPONDER</button>
            </div>
            <div id="infoLog"></div>
        </div>
    </div>
</div>

<script>
    const SOCKET_URL = 'https://motor-while.onrender.com'; // ou seu servidor
    const socket = io(SOCKET_URL, { transports: ['websocket', 'polling'] });

    let currentRoom = null;
    let myPlayerName = null;
    let gameActive = false;
    let playersList = [];
    let currentCard = null;
    let currentDiceValue = 0;
    let turnStarted = false;
    let currentTurnPlayer = null;
    let playersPositions = [];

    // Elementos
    const lobbyScreen = document.getElementById('lobbyScreen');
    const gameScreen = document.getElementById('gameScreen');
    const joinRoomBtn = document.getElementById('joinRoomBtn');
    const playerNameInput = document.getElementById('playerNameInput');
    const roomNameInput = document.getElementById('roomNameInput');
    const lobbyInfo = document.getElementById('lobbyInfo');
    const roomNameDisplay = document.getElementById('roomNameDisplay');
    const playersListDiv = document.getElementById('playersList');
    const readyBtn = document.getElementById('readyBtn');
    const waitingMsg = document.getElementById('waitingMsg');
    const rollBtn = document.getElementById('rollBtn');
    const submitBtn = document.getElementById('submitAnswerBtn');
    const answerInput = document.getElementById('answerInput');
    const diceResultDiv = document.getElementById('diceResult');
    const cardMsgDiv = document.getElementById('cardMessage');
    const turnStatusDiv = document.getElementById('turnStatus');
    const boardTrack = document.getElementById('boardTrack');
    const infoLog = document.getElementById('infoLog');

    function addLog(msg) {
        const p = document.createElement('div');
        p.textContent = msg;
        infoLog.appendChild(p);
        infoLog.scrollTop = infoLog.scrollHeight;
    }

    function renderBoard(positions) {
        boardTrack.innerHTML = '';
        for (let i = 0; i <= 28; i++) {
            let phase = i <= 8 ? 1 : (i <= 16 ? 2 : (i <= 24 ? 3 : 4));
            let specialClass = [5,12,19,25,27].includes(i) ? 'special' : '';
            const tile = document.createElement('div');
            tile.className = `tile phase${phase} ${specialClass}`;
            tile.innerHTML = `<div style="font-size:0.7rem;">${i}</div><div class="players-on-tile" id="tile-${i}"></div>`;
            boardTrack.appendChild(tile);
        }
        if (positions) updatePawns(positions);
    }

    function updatePawns(positions) {
        for (let i = 0; i <= 28; i++) {
            const container = document.getElementById(`tile-${i}`);
            if (container) container.innerHTML = '';
        }
        for (let idx = 0; idx < positions.length; idx++) {
            const pos = positions[idx];
            const playerShort = playersList[idx]?.substring(0,2).toUpperCase() || '??';
            const tileContainer = document.getElementById(`tile-${pos}`);
            if (tileContainer) {
                const pawn = document.createElement('span');
                pawn.className = 'pawn';
                pawn.textContent = playerShort;
                pawn.style.backgroundColor = `hsl(${idx * 90}, 70%, 45%)`;
                tileContainer.appendChild(pawn);
            }
        }
    }

    function updateGameUI(data) {
        turnStatusDiv.innerHTML = `🎲 Vez de: ${data.currentPlayer}`;
        currentTurnPlayer = data.currentPlayer;
        if (currentTurnPlayer !== myPlayerName) {
            rollBtn.disabled = true;
            submitBtn.disabled = true;
            addLog(`⏳ Aguardando ${data.currentPlayer}...`);
        } else {
            rollBtn.disabled = false;
            submitBtn.disabled = true;
            turnStarted = false;
            addLog(`🎲 Sua vez, ${myPlayerName}! role o dado.`);
        }
        updatePawns(data.positions);
    }

    // Socket events
    socket.on('connect', () => addLog('✅ Conectado ao servidor'));

    socket.on('room-joined', (data) => {
        currentRoom = data.room;
        myPlayerName = data.playerName;
        lobbyInfo.style.display = 'block';
        roomNameDisplay.textContent = currentRoom;
        updatePlayersList(data.players, data.readyStatus);
        waitingMsg.innerHTML = Object.keys(data.players).length < 2 ? 'Aguardando mais jogadores... (mínimo 2)' : 'Clique em "ESTOU PRONTO" quando todos estiverem na sala.';
        readyBtn.disabled = false;
    });

    socket.on('room-update', (data) => {
        updatePlayersList(data.players, data.readyStatus);
        const allReady = Object.values(data.readyStatus).every(v => v === true);
        const count = Object.keys(data.players).length;
        if (allReady && count >= 2) {
            waitingMsg.innerHTML = '✅ Todos prontos! O jogo vai começar...';
            readyBtn.disabled = true;
        } else {
            waitingMsg.innerHTML = count < 2 ? 'Aguardando mais jogadores... (mínimo 2)' : 'Aguardando todos clicarem em "ESTOU PRONTO"';
        }
    });

    socket.on('game-start', (data) => {
        lobbyScreen.classList.remove('active');
        gameScreen.style.display = 'block';
        gameActive = true;
        playersList = data.players;
        playersPositions = data.positions;
        renderBoard(playersPositions);
        updateGameUI({ currentPlayer: data.currentPlayer, positions: playersPositions });
        addLog(`🎮 Jogo iniciado na sala ${currentRoom}!`);
    });

    // Fluxo corrigido: após rolar o dado, o servidor já envia o desafio
    socket.on('dice-rolled', (data) => {
        if (data.playerId === myPlayerName) {
            currentDiceValue = data.diceRoll;
            diceResultDiv.innerHTML = ['⚀','⚁','⚂','⚃','⚄','⚅'][currentDiceValue-1];
            addLog(`🎲 Você rolou ${currentDiceValue}! Aguardando desafio...`);
            rollBtn.disabled = true;
            // O desafio virá em 'challenge-sent' em seguida
        }
    });

    socket.on('challenge-sent', (data) => {
        if (data.playerId === myPlayerName) {
            currentCard = data.card;
            const phaseNames = ['Verde (Introdução)', 'Azul (Contadores)', 'Vermelho (Debug)', 'Dourado (Final)'];
            cardMsgDiv.innerHTML = `📜 <strong>DESAFIO - FASE ${data.phase} (${phaseNames[data.phase-1]})</strong><br><pre style="white-space:pre-wrap;">${data.card.text}</pre>`;
            submitBtn.disabled = false;
            turnStarted = true;
            addLog(`🔍 Desafio recebido! Responda abaixo.`);
        }
    });

    socket.on('move-result', (data) => {
        if (data.playerId === myPlayerName) {
            if (data.success) {
                addLog(`✅ ${data.message || 'Resposta correta! Você avançou.'}`);
            } else {
                addLog(`❌ ${data.message || 'Resposta errada! Você voltou uma casa.'}`);
            }
        }
        // Atualizar posições no tabuleiro
        if (data.positions) {
            playersPositions = data.positions;
            updatePawns(playersPositions);
        }
        if (data.gameEnded) {
            addLog(`🏆 FIM DE JOGO! VENCEDOR: ${data.winner}`);
            gameActive = false;
            rollBtn.disabled = true;
            submitBtn.disabled = true;
        }
    });

    socket.on('turn-update', (data) => {
        if (gameActive) {
            playersPositions = data.positions;
            updateGameUI({ currentPlayer: data.currentPlayer, positions: data.positions });
            // Limpar desafio anterior para o próximo turno
            if (data.currentPlayer !== myPlayerName) {
                cardMsgDiv.innerHTML = '💡 Aguarde o próximo jogador...';
                answerInput.value = '';
                turnStarted = false;
            }
        }
    });

    socket.on('error-msg', (msg) => {
        addLog(`❌ ${msg}`);
        if (msg.includes('Nome já usado')) readyBtn.disabled = false;
        if (msg.includes('Não é sua vez')) rollBtn.disabled = false;
    });

    function updatePlayersList(players, readyStatus) {
        playersListDiv.innerHTML = '';
        for (let name of Object.keys(players)) {
            const div = document.createElement('div');
            div.className = 'player-item';
            div.innerHTML = `<span>${name}</span><span class="${readyStatus[name] ? 'ready-badge' : 'not-ready'}">${readyStatus[name] ? '✅ PRONTO' : '⏳ AGUARDANDO'}</span>`;
            playersListDiv.appendChild(div);
        }
    }

    joinRoomBtn.onclick = () => {
        const playerName = playerNameInput.value.trim();
        const roomName = roomNameInput.value.trim();
        if (!playerName || !roomName) {
            alert('Digite seu nome e o nome da sala');
            return;
        }
        socket.emit('join-room', { playerName, roomName });
        joinRoomBtn.disabled = true;
        playerNameInput.disabled = true;
        roomNameInput.disabled = true;
    };

    readyBtn.onclick = () => {
        socket.emit('player-ready', { room: currentRoom, playerName: myPlayerName });
        readyBtn.disabled = true;
        waitingMsg.innerHTML = 'Aguardando os outros jogadores...';
    };

    rollBtn.onclick = () => {
        if (gameActive && currentTurnPlayer === myPlayerName) {
            socket.emit('roll-dice', { room: currentRoom, playerId: myPlayerName });
        }
    };

    submitBtn.onclick = () => {
        if (!turnStarted) return addLog('Role o dado primeiro!');
        const answer = answerInput.value.trim();
        if (!answer) return addLog('Digite uma resposta.');
        if (!currentCard) return addLog('Nenhum desafio ativo. Role o dado novamente.');
        const expected = currentCard.answer;
        socket.emit('submit-answer', {
            room: currentRoom,
            playerId: myPlayerName,
            diceRoll: currentDiceValue,
            answer: answer,
            expected: expected,
            card: currentCard
        });
        answerInput.value = '';
        submitBtn.disabled = true;
        turnStarted = false;
        cardMsgDiv.innerHTML = '💡 Processando resposta...';
    };
</script>
</body>
</html>
