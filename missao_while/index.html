<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop Infinito - Missão While</title>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Courier New', monospace;
            background: #f0f4f8;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1e293b;
        }
        .container {
            max-width: 1400px;
            width: 100%;
            background: #ffffff;
            border-radius: 48px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
        }
        h1 { text-align: center; color: #2d3748; margin-top: 0; font-size: 2rem; }
        .lobby, .game { display: none; }
        .active { display: block; }
        input, button {
            font-family: monospace;
            font-size: 1rem;
            padding: 10px 16px;
            margin: 8px;
            border-radius: 30px;
            border: 1px solid #cbd5e1;
        }
        input { background: white; width: 220px; text-align: center; }
        button {
            background: #3b82f6;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
            border: none;
        }
        button:active { transform: scale(0.96); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .player-list { background: #f8fafc; border-radius: 28px; padding: 15px; margin: 20px 0; border: 1px solid #e2e8f0; }
        .player-item { display: flex; justify-content: space-between; padding: 8px 12px; margin: 5px 0; background: #ffffff; border-radius: 40px; font-weight: bold; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .ready-badge { background: #22c55e; color: white; padding: 2px 12px; border-radius: 20px; }
        .not-ready { background: #ef4444; color: white; padding: 2px 12px; border-radius: 20px; }
        .board-area { background: #f1f5f9; border-radius: 28px; padding: 20px; margin-bottom: 25px; }
        .track { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 20px 0; }
        .tile {
            width: 65px; height: 65px; background: #ffffff; border-radius: 18px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: bold; font-size: 0.9rem; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border: 1px solid #cbd5e1; position: relative;
        }
        .tile.missao { background: #dbeafe; border-bottom: 4px solid #3b82f6; }
        .tile.atual { background: #fef9c3; border: 2px solid #eab308; transform: scale(1.02); }
        .pawn {
            display: inline-block; width: 22px; height: 22px; background: #1e293b;
            border-radius: 50%; margin: 2px; text-align: center; line-height: 22px;
            font-size: 10px; font-weight: bold; color: white;
        }
        .players-on-tile { margin-top: 5px; display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; }
        .dice-area { text-align: center; margin: 15px 0; }
        .dice {
            background: white; width: 80px; height: 80px; border-radius: 20px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 3rem; font-weight: bold; margin: 10px; color: #1e293b;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); border: 2px solid #cbd5e1;
        }
        .missao-painel { background: #f8fafc; border-radius: 1.5rem; padding: 1rem; margin-top: 1rem; border: 1px solid #e2e8f0; }
        .story-box { background: #ffffff; border-left: 5px solid #3b82f6; padding: 1rem; border-radius: 1rem; margin-bottom: 1rem; }
        .paleta { background: #f1f5f9; border-radius: 1rem; padding: 1rem; margin-bottom: 1rem; max-height: 200px; overflow-y: auto; }
        .bloco {
            display: inline-block; background: #ffffff; border: 1px solid #cbd5e1;
            border-radius: 0.5rem; padding: 0.4rem 0.9rem; margin: 0.3rem;
            font-family: monospace; font-size: 0.8rem; cursor: pointer; transition: 0.1s;
            color: #1e293b;
        }
        .bloco:hover { background: #e2e8f0; border-color: #3b82f6; }
        .codigo-area { background: #ffffff; border-radius: 1rem; padding: 1rem; font-family: monospace; min-height: 150px; border: 1px solid #cbd5e1; margin-bottom: 1rem; }
        .linha-codigo { display: flex; justify-content: space-between; padding: 0.2rem 0; border-bottom: 1px dashed #e2e8f0; }
        .remover-linha { color: #ef4444; cursor: pointer; margin-left: 0.8rem; }
        .terminal { background: #1e293b; border-radius: 1rem; margin-top: 1rem; overflow: hidden; }
        .terminal-header { background: #0f172a; padding: 0.5rem; color: white; display: flex; justify-content: space-between; }
        .terminal-content { padding: 0.8rem; font-family: monospace; font-size: 0.8rem; color: #86efac; background: #020617; max-height: 150px; overflow-y: auto; white-space: pre-wrap; }
        .feedback { margin-top: 1rem; padding: 0.8rem; border-radius: 1rem; }
        .feedback.sucesso { background: #dcfce7; color: #166534; border: 1px solid #22c55e; }
        .feedback.erro { background: #fee2e2; color: #991b1b; border: 1px solid #ef4444; }
        .turn-indicator { background: #e2e8f0; border-radius: 40px; padding: 8px 16px; display: inline-block; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h1>⟳ LOOP INFINITO — MISSÃO WHILE</h1>

    <!-- LOBBY -->
    <div id="lobbyScreen" class="lobby active">
        <div style="text-align:center">
            <input type="text" id="playerNameInput" placeholder="Seu nome (ex: Vermelho)">
            <input type="text" id="roomNameInput" placeholder="Nome da sala (ex: turmaA)">
            <button id="joinRoomBtn">🎮 ENTRAR NA SALA</button>
        </div>
        <div id="lobbyInfo" style="display:none;">
            <div class="player-list">
                <h3>👥 Jogadores na sala <span id="roomNameDisplay"></span></h3>
                <div id="playersList"></div>
                <button id="readyBtn" style="width:100%">✅ ESTOU PRONTO</button>
                <p id="waitingMsg" style="margin-top:10px; text-align:center;"></p>
            </div>
        </div>
    </div>

    <!-- JOGO -->
    <div id="gameScreen" class="game">
        <div class="board-area">
            <div id="turnStatus" class="turn-indicator">🎲 Aguardando...</div>
            <div id="boardTrack" class="track"></div>
        </div>
        <div class="dice-area">
            <div class="dice" id="diceResult">⚀</div>
            <button id="rollDiceBtn" disabled>🎲 ROLAR DADO</button>
        </div>
        <div id="missaoArea" style="display:none;">
            <div class="missao-painel">
                <div id="storyBox" class="story-box"></div>
                <!-- SEM DICA -->
                <div><strong>🧩 Blocos disponíveis (clique para adicionar):</strong></div>
                <div id="paleta" class="paleta"></div>
                <div><strong>📝 Seu código (clique no ❌ para remover):</strong></div>
                <div id="codigoMontado" class="codigo-area"></div>
                <div>
                    <button id="verificarBtn" class="primary">✅ VERIFICAR CÓDIGO</button>
                    <button id="rodarBtn" class="success">▶️ RODAR CÓDIGO</button>
                    <button id="limparBtn" class="warning">🗑 LIMPAR CÓDIGO</button>
                </div>
                <div id="feedback" class="feedback"></div>
                <div class="terminal" id="terminal" style="display:none;">
                    <div class="terminal-header">
                        <span>🐍 Terminal Python (simulação)</span>
                        <button id="fecharTerminal" style="background:#334155; padding:0.2rem 0.5rem;">✕</button>
                    </div>
                    <div id="terminalOutput" class="terminal-content"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const SOCKET_URL = 'https://motor-while.onrender.com'; // ATUALIZE PARA SEU SERVIDOR
    const socket = io(SOCKET_URL);

    let currentRoom = null, myName = null;
    let gameActive = false, playersList = [], playersPositions = [], currentTurn = null;
    let currentMissao = null, currentPosicao = null;
    let blocosSelecionados = [];

    // DOM
    const lobbyScreen = document.getElementById('lobbyScreen');
    const gameScreen = document.getElementById('gameScreen');
    const joinBtn = document.getElementById('joinRoomBtn');
    const playerNameInput = document.getElementById('playerNameInput');
    const roomNameInput = document.getElementById('roomNameInput');
    const lobbyInfo = document.getElementById('lobbyInfo');
    const roomNameDisplay = document.getElementById('roomNameDisplay');
    const playersListDiv = document.getElementById('playersList');
    const readyBtn = document.getElementById('readyBtn');
    const waitingMsg = document.getElementById('waitingMsg');
    const turnStatus = document.getElementById('turnStatus');
    const boardTrack = document.getElementById('boardTrack');
    const diceResult = document.getElementById('diceResult');
    const rollDiceBtn = document.getElementById('rollDiceBtn');
    const missaoArea = document.getElementById('missaoArea');
    const storyBox = document.getElementById('storyBox');
    const paletaDiv = document.getElementById('paleta');
    const codigoMontadoDiv = document.getElementById('codigoMontado');
    const verificarBtn = document.getElementById('verificarBtn');
    const rodarBtn = document.getElementById('rodarBtn');
    const limparBtn = document.getElementById('limparBtn');
    const feedbackDiv = document.getElementById('feedback');
    const terminalDiv = document.getElementById('terminal');
    const terminalOutput = document.getElementById('terminalOutput');
    const fecharTerminal = document.getElementById('fecharTerminal');

    function renderBoard(positions) {
        boardTrack.innerHTML = '';
        for (let i = 0; i <= 30; i++) {
            const tile = document.createElement('div');
            tile.className = `tile missao`;
            if (positions && positions.some(p => p === i)) tile.classList.add('atual');
            tile.innerHTML = `<div>${i}</div><div class="players-on-tile" id="tile-${i}"></div>`;
            boardTrack.appendChild(tile);
        }
        if (positions) updatePawns(positions);
    }
    function updatePawns(positions) {
        for (let i = 0; i <= 30; i++) {
            const container = document.getElementById(`tile-${i}`);
            if (container) container.innerHTML = '';
        }
        for (let idx = 0; idx < positions.length; idx++) {
            const pos = positions[idx];
            const short = playersList[idx]?.substring(0,2).toUpperCase() || '??';
            const tile = document.getElementById(`tile-${pos}`);
            if (tile) {
                const pawn = document.createElement('span');
                pawn.className = 'pawn';
                pawn.textContent = short;
                pawn.style.backgroundColor = `hsl(${idx * 90}, 70%, 45%)`;
                tile.appendChild(pawn);
            }
        }
    }
    function exibirMissaoUI(missao, pos) {
        currentMissao = missao;
        currentPosicao = pos;
        storyBox.innerHTML = `<div style="font-weight:bold;">📖 ${missao.titulo}</div><div>${missao.historia}</div>`;
        // Gerar blocos (código esperado + distrações)
        let blocos = [...missao.codigoEsperado];
        const distracoes = ["for i in range(10):","if x > 0:","else:","    pass","break","continue","    i += 1","    i -= 1","print('teste')","while True:"];
        for (let d of distracoes) if (!blocos.includes(d) && blocos.length < 16) blocos.push(d);
        for (let i=blocos.length-1; i>0; i--) { const j=Math.floor(Math.random()*(i+1)); [blocos[i],blocos[j]]=[blocos[j],blocos[i]]; }
        paletaDiv.innerHTML = '';
        blocos.forEach(bl => {
            const bloco = document.createElement('div');
            bloco.className = 'bloco';
            bloco.textContent = bl;
            bloco.onclick = () => {
                if (!gameActive || currentTurn !== myName) return;
                blocosSelecionados.push(bl);
                exibirCodigoMontado();
            };
            paletaDiv.appendChild(bloco);
        });
        blocosSelecionados = [];
        exibirCodigoMontado();
        feedbackDiv.innerHTML = '';
        terminalDiv.style.display = 'none';
        missaoArea.style.display = 'block';
    }
    function exibirCodigoMontado() {
        codigoMontadoDiv.innerHTML = '';
        if (blocosSelecionados.length === 0) {
            codigoMontadoDiv.innerHTML = '<span style="color:gray;">Nenhum bloco adicionado. Clique nos blocos acima.</span>';
            return;
        }
        blocosSelecionados.forEach((linha, idx) => {
            const linhaDiv = document.createElement('div');
            linhaDiv.className = 'linha-codigo';
            linhaDiv.innerHTML = `<code>${linha.replace(/ /g,'&nbsp;')}</code><span class="remover-linha" data-idx="${idx}">❌</span>`;
            codigoMontadoDiv.appendChild(linhaDiv);
        });
        document.querySelectorAll('.remover-linha').forEach(el => {
            el.onclick = (e) => {
                const i = parseInt(e.target.getAttribute('data-idx'));
                blocosSelecionados.splice(i,1);
                exibirCodigoMontado();
            };
        });
    }
    function limparCodigo() { blocosSelecionados = []; exibirCodigoMontado(); feedbackDiv.innerHTML = ''; }
    async function rodarCodigoSimulado() {
        if (blocosSelecionados.length === 0) { feedbackDiv.innerHTML = '❌ Nenhum código para executar.'; return; }
        terminalDiv.style.display = 'block';
        terminalOutput.innerHTML = '<div>🐍 Simulando execução...</div>';
        for (let linha of blocosSelecionados) terminalOutput.innerHTML += `<div>${linha}</div>`;
        terminalOutput.innerHTML += '<div>✅ Simulação concluída (use "Verificar" para validação oficial).</div>';
    }
    verificarBtn.onclick = () => {
        if (!gameActive || currentTurn !== myName) { feedbackDiv.innerHTML = '❌ Não é sua vez!'; return; }
        if (!currentMissao) return;
        const esperado = currentMissao.codigoEsperado;
        if (blocosSelecionados.length !== esperado.length) { feedbackDiv.innerHTML = `❌ Número de linhas incorreto. Esperado ${esperado.length}, você usou ${blocosSelecionados.length}.`; return; }
        let correto = true;
        for (let i=0; i<esperado.length; i++) {
            if (blocosSelecionados[i] !== esperado[i]) { correto = false; break; }
        }
        if (correto) {
            socket.emit('submit-codigo', { room: currentRoom, playerId: myName, posicao: currentPosicao, blocosMontados: blocosSelecionados });
            feedbackDiv.innerHTML = '✅ Código correto! Aguardando resultado...';
        } else {
            socket.emit('submit-codigo', { room: currentRoom, playerId: myName, posicao: currentPosicao, blocosMontados: blocosSelecionados });
            feedbackDiv.innerHTML = '❌ Código incorreto. Voltará uma casa e passará a vez.';
        }
        missaoArea.style.display = 'none';
    };
    rodarBtn.onclick = rodarCodigoSimulado;
    limparBtn.onclick = limparCodigo;
    fecharTerminal.onclick = () => terminalDiv.style.display = 'none';
    rollDiceBtn.onclick = () => {
        if (!gameActive || currentTurn !== myName) { feedbackDiv.innerHTML = '❌ Não é sua vez!'; return; }
        socket.emit('roll-dice', { room: currentRoom, playerId: myName });
        rollDiceBtn.disabled = true;
    };

    // Socket events
    socket.on('connect', () => console.log('Conectado'));
    socket.on('room-joined', data => {
        currentRoom = data.room; myName = data.playerName;
        lobbyInfo.style.display = 'block';
        roomNameDisplay.textContent = currentRoom;
        updatePlayersList(data.players, data.readyStatus);
        waitingMsg.innerText = Object.keys(data.players).length < 2 ? 'Aguardando mais jogadores (mínimo 2)' : 'Clique em "ESTOU PRONTO"';
        readyBtn.disabled = false;
    });
    socket.on('room-update', data => {
        updatePlayersList(data.players, data.readyStatus);
        const allReady = Object.values(data.readyStatus).every(v=>v===true);
        if (allReady && Object.keys(data.players).length>=2) waitingMsg.innerText = 'Todos prontos! O jogo vai começar...';
    });
    socket.on('game-start', data => {
        lobbyScreen.classList.remove('active');
        gameScreen.style.display = 'block';
        gameActive = true;
        playersList = data.players;
        playersPositions = data.positions;
        currentTurn = data.currentPlayer;
        turnStatus.innerText = `🎲 Vez de: ${currentTurn}`;
        renderBoard(playersPositions);
        if (currentTurn === myName) {
            rollDiceBtn.disabled = false;
            missaoArea.style.display = 'none';
            feedbackDiv.innerHTML = 'Sua vez! Role o dado.';
        } else {
            rollDiceBtn.disabled = true;
        }
    });
    socket.on('dice-rolled', data => {
        if (data.playerId === myName) {
            const diceFaces = ['⚀','⚁','⚂','⚃','⚄','⚅'];
            diceResult.innerHTML = diceFaces[data.dice-1];
            feedbackDiv.innerHTML = `🎲 Você rolou ${data.dice}! Avançou para a casa ${data.newPosition}.`;
        }
        playersPositions = data.positions;
        renderBoard(playersPositions);
    });
    socket.on('missao-received', data => {
        if (data.playerId === myName) {
            exibirMissaoUI(data.missao, data.posicao);
            rollDiceBtn.disabled = true;
        }
    });
    socket.on('move-result', data => {
        playersPositions = data.positions;
        renderBoard(playersPositions);
        if (data.playerId === myName) {
            feedbackDiv.innerHTML = data.message;
        }
        // O turno será atualizado por 'turn-update'
    });
    socket.on('turn-update', data => {
        currentTurn = data.currentPlayer;
        playersPositions = data.positions;
        turnStatus.innerText = `🎲 Vez de: ${currentTurn}`;
        renderBoard(playersPositions);
        if (currentTurn === myName && gameActive) {
            rollDiceBtn.disabled = false;
            missaoArea.style.display = 'none';
            feedbackDiv.innerHTML = 'Sua vez! Role o dado.';
        } else {
            rollDiceBtn.disabled = true;
            missaoArea.style.display = 'none';
        }
    });
    socket.on('game-ended', data => {
        gameActive = false;
        turnStatus.innerText = `🏆 VENCEDOR: ${data.winner}`;
        feedbackDiv.innerHTML = `🏁 Jogo terminado! ${data.winner} venceu.`;
        rollDiceBtn.disabled = true;
    });
    socket.on('error-msg', msg => { feedbackDiv.innerHTML = `❌ ${msg}`; });
    function updatePlayersList(players, readyStatus) {
        playersListDiv.innerHTML = '';
        for (let name of Object.keys(players)) {
            const div = document.createElement('div');
            div.className = 'player-item';
            div.innerHTML = `<span>${name}</span><span class="${readyStatus[name]?'ready-badge':'not-ready'}">${readyStatus[name]?'✅ PRONTO':'⏳'}</span>`;
            playersListDiv.appendChild(div);
        }
    }
    joinBtn.onclick = () => {
        const name = playerNameInput.value.trim(), room = roomNameInput.value.trim();
        if (!name || !room) return alert('Preencha nome e sala');
        socket.emit('join-room', { playerName: name, roomName: room });
        joinBtn.disabled = true;
    };
    readyBtn.onclick = () => {
        socket.emit('player-ready', { room: currentRoom, playerName: myName });
        readyBtn.disabled = true;
        waitingMsg.innerText = 'Aguardando os outros jogadores...';
    };
    renderBoard([]);
</script>
</body>
</html>
