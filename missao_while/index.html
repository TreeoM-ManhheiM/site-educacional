<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Loop Infinito - Missão While</title>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Courier New', monospace;
            background: linear-gradient(145deg, #1a472a 0%, #0e2a1a 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .game-container {
            max-width: 1400px;
            width: 100%;
            background: #fef7e0;
            border-radius: 48px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8);
            padding: 20px;
            border: 4px solid #ffd966;
        }
        h1 { text-align: center; font-size: 2.2rem; margin: 0 0 10px; color: #2c3e2f; text-shadow: 3px 3px 0 #ffd966; }
        .sub { text-align: center; font-style: italic; color: #2d6a4f; margin-bottom: 25px; font-weight: bold; }
        .board-area { background: #e9f5e6; border-radius: 28px; padding: 20px; margin-bottom: 25px; border: 3px solid #b7b78a; }
        .track { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 20px 0; }
        .tile {
            width: 70px; height: 70px; background: #fff2cf; border-radius: 18px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.3rem; box-shadow: 0 4px 0 #a5936e;
            border: 1px solid #eedd99; position: relative;
        }
        .tile.phase1 { background: #b9fbc0; border-bottom: 6px solid #2b7a2a; }
        .tile.phase2 { background: #90e0ef; border-bottom: 6px solid #0077b6; }
        .tile.phase3 { background: #ffb3b3; border-bottom: 6px solid #b00020; }
        .tile.phase4 { background: #ffd966; border-bottom: 6px solid #c97e00; }
        .tile.special { background: radial-gradient(circle at 30% 20%, #fff0b5, #ffe0a3); box-shadow: 0 0 0 2px gold; }
        .pawn {
            display: inline-block; width: 24px; height: 24px; background: #2c3e2f;
            border-radius: 50%; margin: 2px; text-align: center; line-height: 24px;
            font-size: 12px; font-weight: bold; color: white; box-shadow: 0 2px 3px black;
        }
        .players-on-tile { margin-top: 5px; display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; }
        .controls { background: #282c35; padding: 20px; border-radius: 30px; color: white; }
        .panel { background: #1f2a2e; border-radius: 24px; padding: 15px; }
        button {
            background: #ffb347; border: none; font-weight: bold; padding: 12px 20px;
            border-radius: 40px; font-size: 1.2rem; cursor: pointer; margin: 5px; font-family: monospace;
        }
        button:active { transform: scale(0.96); }
        .dice {
            background: white; width: 80px; height: 80px; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 3rem; font-weight: bold; margin: 10px auto; color: #b51c1c;
        }
        .card-area { background: #f9eec1; padding: 18px; border-radius: 28px; margin-top: 20px; border-left: 18px solid #dd8822; font-family: monospace; }
        .turn-indicator { background: #000000aa; backdrop-filter: blur(4px); border-radius: 40px; padding: 8px 18px; display: inline-block; }
        @media (max-width: 800px) {
            .tile { width: 50px; height: 50px; font-size: 0.9rem; }
            .pawn { width: 18px; height: 18px; font-size: 9px; line-height: 18px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>⟳ LOOP INFINITO — MISSÃO WHILE 🐍</h1>
    <div class="sub">⚡ programe. avance. vença o loop infinito.</div>
    <div class="board-area">
        <div id="boardTrack" class="track"></div>
        <div class="turn-indicator" id="turnStatus" style="margin:10px auto; text-align:center; background:#1f3b2c; color:white; width:fit-content;">🎲 Aguardando inicio...</div>
    </div>
    <div class="controls">
        <div style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: space-between;">
            <div>
                <h3>👥 Jogadores</h3>
                <div id="playersSetup">
                    <input type="text" id="playerNames" placeholder="Ana, Bruno, Carla" size="30">
                    <button id="startBtn">🚀 INICIAR JOGO</button>
                </div>
                <div id="playerList" style="margin-top: 10px; font-weight: bold;"></div>
                <div id="specialCardsDisplay" style="font-size:0.8rem; background:#00000055; border-radius: 16px; padding: 5px;"></div>
            </div>
            <div style="text-align: center;">
                <h3>🎲 Ação</h3>
                <div class="dice" id="diceResult">⚀</div>
                <button id="rollBtn" disabled>ROLAR DADO</button>
                <button id="endTurnBtn" disabled>⏭️ PULAR TURNO</button>
            </div>
        </div>
        <div class="card-area" id="cardMessage">💡 <strong>Desafio aparecerá aqui</strong> — responda corretamente para não voltar casas.</div>
        <div>
            <input type="text" id="answerInput" placeholder="Sua resposta..." style="width: 70%; padding: 12px; border-radius: 60px;">
            <button id="submitAnswerBtn" disabled>✅ RESPONDER</button>
        </div>
        <div id="infoLog" style="margin-top: 12px; font-size: 0.8rem; max-height: 100px; overflow-y: auto;"></div>
    </div>
</div>

<script>
    // === CONECTA AO SERVIDOR SOCKET.IO NO RENDER ===
    const SOCKET_URL = 'https://motor-while.onrender.com';  // <--- ALTERE PARA SEU SERVIDOR
    const socket = io(SOCKET_URL, {
        transports: ['websocket', 'polling'],
        withCredentials: true
    });

    let currentPlayerId = null;
    let gameActive = false;
    let playersList = [];
    let currentCard = null;
    let currentPhase = null;
    let currentDiceValue = 0;
    let localPlayerName = "";
    let turnStarted = false;

    const boardTrack = document.getElementById("boardTrack");
    const turnStatusDiv = document.getElementById("turnStatus");
    const rollBtn = document.getElementById("rollBtn");
    const submitBtn = document.getElementById("submitAnswerBtn");
    const startBtn = document.getElementById("startBtn");
    const answerInput = document.getElementById("answerInput");
    const diceResultDiv = document.getElementById("diceResult");
    const cardMsgDiv = document.getElementById("cardMessage");
    const playerListDiv = document.getElementById("playerList");
    const specialCardsSpan = document.getElementById("specialCardsDisplay");
    const logDiv = document.getElementById("infoLog");
    const playerNamesInput = document.getElementById("playerNames");
    const endTurnBtn = document.getElementById("endTurnBtn");

    function addLog(msg) {
        const p = document.createElement("div");
        p.textContent = msg;
        logDiv.appendChild(p);
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function renderBoard(positions) {
        boardTrack.innerHTML = "";
        for (let i = 0; i <= 28; i++) {
            let phase = i <= 8 ? 1 : (i <= 16 ? 2 : (i <= 24 ? 3 : 4));
            let specialClass = [5,12,19,25,27].includes(i) ? "special" : "";
            const tileDiv = document.createElement("div");
            tileDiv.className = `tile phase${phase} ${specialClass}`;
            tileDiv.innerHTML = `<div style="font-size:0.7rem;">${i}</div><div class="players-on-tile" id="tile-${i}"></div>`;
            boardTrack.appendChild(tileDiv);
        }
        if (positions) updatePawns(positions);
    }

    function updatePawns(positions) {
        for (let i = 0; i <= 28; i++) {
            const container = document.getElementById(`tile-${i}`);
            if (container) container.innerHTML = "";
        }
        for (let idx = 0; idx < positions.length; idx++) {
            const pos = positions[idx];
            const playerNameShort = playersList[idx]?.substring(0,2).toUpperCase() || "J";
            const tileContainer = document.getElementById(`tile-${pos}`);
            if (tileContainer) {
                const pawnSpan = document.createElement("span");
                pawnSpan.className = "pawn";
                pawnSpan.textContent = playerNameShort;
                pawnSpan.style.backgroundColor = `hsl(${idx * 90}, 70%, 45%)`;
                tileContainer.appendChild(pawnSpan);
            }
        }
    }

    function updateUIAfterTurn(data) {
        turnStatusDiv.innerHTML = `🎲 Vez de: ${data.currentPlayer} (${playersList.indexOf(data.currentPlayer)+1}/${playersList.length})`;
        currentPlayerId = data.currentPlayer;
        if (currentPlayerId !== localPlayerName) {
            rollBtn.disabled = true;
            submitBtn.disabled = true;
            endTurnBtn.disabled = true;
            addLog(`⏳ Aguardando jogador ${data.currentPlayer}...`);
        } else {
            rollBtn.disabled = false;
            submitBtn.disabled = true;
            endTurnBtn.disabled = false;
            turnStarted = false;
            addLog(`🎲 Sua vez, ${localPlayerName}! role o dado.`);
        }
        updatePawns(data.positions);
    }

    socket.on("connect", () => {
        addLog("✅ Conectado ao servidor do jogo!");
    });

    socket.on("game-initialized", (data) => {
        playersList = data.players;
        localPlayerName = playersList[0]; // primeiro da lista como dono (ajuste conforme necessário)
        gameActive = true;
        renderBoard(data.positions);
        updateUIAfterTurn({currentPlayer: playersList[data.currentPlayerIndex], positions: data.positions, playersSkipped: []});
        addLog(`🎮 Jogo iniciado! primeiro jogador: ${playersList[data.currentPlayerIndex]}`);
        startBtn.disabled = true;
        playerNamesInput.disabled = true;
    });

    socket.on("turn-update", (data) => {
        if (!gameActive) return;
        updateUIAfterTurn(data);
    });

    socket.on("dice-rolled", (data) => {
        if (data.playerId === localPlayerName) {
            currentDiceValue = data.diceRoll;
            diceResultDiv.innerHTML = ["⚀","⚁","⚂","⚃","⚄","⚅"][currentDiceValue-1];
            addLog(`🎲 Você rolou ${currentDiceValue}! responda o desafio para avançar.`);
            rollBtn.disabled = true;
            submitBtn.disabled = false;
            turnStarted = true;
        }
    });

    socket.on("card-drawn", (data) => {
        if (data.playerId === localPlayerName) {
            currentCard = data.card;
            currentPhase = data.phase;
            let phaseName = ["Verde (introdução)","Azul (contadores)","Vermelho (debug)","Dourado (desafio final)"][data.phase-1];
            cardMsgDiv.innerHTML = `📜 <strong> DESAFIO FASE ${data.phase} — ${phaseName}</strong><br><pre style="white-space:pre-wrap;">${data.card.text}</pre><i>🔍 Responda com atenção!</i>`;
            addLog(`🗺️ Desafio sorteado: ${data.card.text.substring(0,60)}...`);
        }
    });

    socket.on("player-moved", (data) => {
        if (data.newPosition !== undefined && playersList) updatePawns(gameStatePositionsTmp || playersList.map(()=>0));
        if (data.gameEnded) {
            addLog(`🏆 FIM DE JOGO! VENCEDOR: ${data.winner} 🏆`);
            gameActive = false;
            rollBtn.disabled = true;
            submitBtn.disabled = true;
        }
    });

    socket.on("special-tile", (data) => {
        if (data.playerId === localPlayerName) addLog(`✨ ${data.message}`);
    });

    socket.on("game-ended", (data) => {
        addLog(`🏁 JOGO ENCERRADO! VITÓRIA DE ${data.winner}`);
        gameActive = false;
        rollBtn.disabled = true;
        submitBtn.disabled = true;
        startBtn.disabled = false;
    });

    socket.on("game-error", (err) => {
        addLog(`❌ ERRO: ${err}`);
    });

    startBtn.onclick = () => {
        let names = playerNamesInput.value.split(',').map(s=>s.trim()).filter(s=>s);
        if(names.length < 2) { alert("Coloque pelo menos 2 jogadores separados por vírgula"); return; }
        socket.emit("start-game", names);
    };

    rollBtn.onclick = () => {
        if (!gameActive || currentPlayerId !== localPlayerName) return;
        socket.emit("roll-dice", localPlayerName);
    };

    submitBtn.onclick = () => {
        if (!turnStarted) return addLog("Primeiro role o dado!");
        const userAnswer = answerInput.value.trim();
        if (!userAnswer && currentCard?.type !== "logic") { addLog("Digite uma resposta."); return; }
        let expected = currentCard?.answer || "";
        const isCorrect = (userAnswer.toLowerCase() === expected.toLowerCase());
        socket.emit("move-player", { playerId: localPlayerName, diceRoll: currentDiceValue, answer: userAnswer, challengeAnswer: expected });
        answerInput.value = "";
        cardMsgDiv.innerHTML = "💡 Próximo desafio surgirá no próximo movimento.";
        submitBtn.disabled = true;
        turnStarted = false;
    };

    endTurnBtn.onclick = () => {
        if (currentPlayerId === localPlayerName) {
            socket.emit("end-turn-manual", localPlayerName);
            addLog("⏩ Turno pulado manualmente.");
        }
    };

    renderBoard([]);
    addLog("🎓 Loop Infinito — Missão While. Conecte-se e aprenda!");
</script>
</body>
</html>
