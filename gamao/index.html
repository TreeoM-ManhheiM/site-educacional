<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gamão Lógico 🎲 — Laboratório de Computação</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #2b5e2b;
            color: #f5e6d3;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #1a3a1a, #2d6a4f);
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        header h1 { margin: 0; font-size: 28px; }
        .btn-header-regras {
            display: inline-block;
            margin-top: 8px;
            background: rgba(255,255,255,0.2);
            color: #f5e6d3;
            padding: 5px 15px;
            text-decoration: none;
            border-radius: 20px;
            font-size: 13px;
            border: 1px solid #e6c7a2;
        }
        main {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            flex: 1;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .coluna-esquerda { flex: 2; min-width: 320px; }
        .coluna-direita { flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 20px; }
        .game-container, .painel-container {
            background: #1e4d2b;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            border: 2px solid #b2895b;
        }
        #status-conexao { color: #ccc; font-size: 13px; margin-bottom: 10px; }
        .painel-info {
            background: #2d6a4f;
            padding: 10px 15px;
            border-radius: 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 15px;
            font-weight: bold;
            flex-wrap: wrap;
            gap: 10px;
        }
        button {
            padding: 12px 20px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            background: #a77b55;
            color: #f5e6d3;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: 0.2s;
            font-size: 16px;
        }
        button.primary { background: #2d6a4f; }
        button.success { background: #1e4d2b; }
        button.warning { background: #c98a2c; }
        button.danger { background: #a04030; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        input {
            padding: 12px;
            border-radius: 30px;
            border: 2px solid #b2895b;
            background: #fcf3e8;
            margin: 5px 0;
            width: 100%;
            font-size: 16px;
        }
        .tabuleiro-container {
            display: flex;
            justify-content: center;
            margin: 10px 0;
            overflow-x: auto;
        }
        canvas {
            background: #d9b382;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border: 5px solid #6b4226;
            width: 100%;
            height: auto;
            cursor: pointer;
            touch-action: none;
        }
        .historico-lista {
            max-height: 200px;
            overflow-y: auto;
            background: #163a1a;
            padding: 10px;
            border-radius: 16px;
            font-size: 14px;
        }
        .chat-mensagens {
            height: 200px;
            overflow-y: auto;
            background: #163a1a;
            padding: 10px;
            border-radius: 16px;
            margin-bottom: 10px;
        }
        .chat-input { display: flex; gap: 5px; }
        .chat-input input { flex: 1; }
        .badge { background: #8b5e3c; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
        .flex-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; }
        .dados-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 20px 0;
        }
        .dado {
            width: 70px;
            height: 70px;
            background: white;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: black;
            box-shadow: 0 6px 0 #999, 0 8px 12px rgba(0,0,0,0.3);
            border: 2px solid #ccc;
        }
        .dado.usado { opacity: 0.4; }
        .status-mensagem {
            font-size: 18px;
            padding: 8px 20px;
            background: #c98a2c;
            border-radius: 40px;
            color: #1a1a1a;
            font-weight: bold;
            text-align: center;
        }
        .info-turno { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
        @media (max-width: 700px) {
            .painel-info { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
<header>
    <h1>Gamão Lógico 🎲</h1>
    <p>Projeto Integrado — Laboratório de Computação</p>
    <a href="#" target="_blank" class="btn-header-regras">📖 VER REGRAS</a>
</header>
<main>
    <div class="coluna-esquerda">
        <div id="status-conexao">Conectando...</div>

        <div id="tela-login" class="game-container">
            <h2>Entrar na Partida</h2>
            <input type="text" id="input-apelido" placeholder="Seu Nome">
            <input type="text" id="input-sala" placeholder="Sala (ex: mesa1)">
            <br><br>
            <button onclick="entrar()" class="success">CONECTAR</button>
        </div>

        <div id="lobby" class="game-container" style="display:none;">
            <h3>🕹️ Lobby</h3>
            <div id="info-sala"></div>
            <ul id="lista-alunos" style="padding:0;"></ul>
            <button id="btn-pronto" onclick="marcarPronto()" class="primary" style="width:100%;">ESTOU PRONTO</button>
        </div>

        <div id="area-jogo" style="display:none;">
            <div class="painel-info">
                <div>Seu Lado: <span id="meu-lado" class="destaque">---</span></div>
                <div class="info-turno">
                    <span>Turno:</span>
                    <span id="vez-atual" class="destaque">---</span>
                    <span id="direcao-movimento" style="font-size:14px;"></span>
                </div>
                <div id="status-jogo" class="status-mensagem">Aguardando...</div>
            </div>
            
            <div class="tabuleiro-container">
                <canvas id="boardCanvas" width="1000" height="600" style="width:100%; height:auto; max-width:1000px"></canvas>
            </div>

            <div class="dados-container" id="dados-display">
                <div class="dado" id="dado1">⚀</div>
                <div class="dado" id="dado2">⚀</div>
            </div>

            <div class="flex-row">
                <button id="btn-rolar" onclick="rolarDados()" class="primary">🎲 Rolar Dados</button>
                <button onclick="confirmarMovimentos()" class="success" id="btn-confirmar" style="display:none;">✅ Confirmar Jogada</button>
                <button onclick="cancelarMovimentos()" class="warning" id="btn-cancelar" style="display:none;">↩️ Cancelar</button>
                <button onclick="desistir()" class="danger">🏳️ Desistir</button>
            </div>
            <p style="text-align:center; margin-top:15px; font-size:16px; background:#2d6a4f; padding:8px; border-radius:30px;">
                👆 Clique na sua peça (origem) e depois no destino (contorno verde).
            </p>
        </div>
    </div>

    <div class="coluna-direita">
        <div id="painel-historico" class="painel-container" style="display:none;">
            <h3>📜 Histórico</h3>
            <div id="historico" class="historico-lista"></div>
        </div>
        <div id="painel-chat" class="painel-container" style="display:none;">
            <h3>💬 Chat</h3>
            <div id="chat-mensagens" class="chat-mensagens"></div>
            <div class="chat-input">
                <input type="text" id="input-mensagem" placeholder="Mensagem...">
                <button onclick="enviarMensagem()">Enviar</button>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    // ==================== CONEXÃO SOCKET ====================
    const socket = io("https://motor-gamao.onrender.com");
    let estadoAtual = null;
    let meuLado = 0;
    let jogoIniciado = false;
    let salaAtual = '';
    let movimentosPendentes = [];
    let pecaSelecionada = null;
    let legalMoves = [];  // movimentos válidos recebidos do servidor

    const canvas = document.getElementById('boardCanvas');
    const ctx = canvas.getContext('2d');

    // ==================== CONFIGURAÇÕES DO TABULEIRO CLÁSSICO ====================
    const w = 1000, h = 600;
    canvas.width = w; canvas.height = h;
    
    // Dimensões dos triângulos (pontos)
    const boardMarginX = 80;     // margem esquerda/direita
    const boardTopY = 70;        // topo da área de jogo (início dos triângulos superiores)
    const boardBottomY = h - 70; // base dos triângulos inferiores
    const pointWidth = (w - 2 * boardMarginX) / 12;  // largura de cada par de triângulos (cada casa ocupa metade)
    const pointHeight = 150;      // altura dos triângulos
    
    // Coordenadas da barra central
    const barX = w/2 - 30;
    const barW = 60;
    const barTopY = boardTopY + pointHeight + 10;
    const barBottomY = boardBottomY - pointHeight - 10;
    const barHeight = barBottomY - barTopY;

    // ========== FUNÇÕES DE DESENHO ==========
    function desenharTriangulo(x, y, largura, altura, paraCima, corClara) {
        ctx.beginPath();
        if (paraCima) {
            ctx.moveTo(x, y);
            ctx.lineTo(x + largura/2, y - altura);
            ctx.lineTo(x + largura, y);
        } else {
            ctx.moveTo(x, y);
            ctx.lineTo(x + largura/2, y + altura);
            ctx.lineTo(x + largura, y);
        }
        ctx.closePath();
        ctx.fillStyle = corClara ? '#e8c99e' : '#b57c48';
        ctx.fill();
        ctx.strokeStyle = '#4a2c14';
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }

    function desenharTabuleiro() {
        if (!estadoAtual) return;
        
        // Fundo da mesa
        ctx.fillStyle = '#c9a87b';
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = '#5a3a22';
        ctx.lineWidth = 8;
        ctx.strokeRect(5, 5, w-10, h-10);
        
        // Desenha os 24 triângulos (pontos)
        // Índice 0 = canto superior direito (ponto 1 para o jogador vermelho)
        // Ordem: linha de cima da direita para esquerda, linha de baixo da esquerda para direita
        for (let i = 0; i < 12; i++) {
            // Triângulos superiores (lado vermelho, virados para baixo)
            const xSup = boardMarginX + i * pointWidth;
            const corClaraSup = (Math.floor(i/2) % 2 === 0);
            desenharTriangulo(xSup, boardTopY, pointWidth, pointHeight, false, corClaraSup);
            
            // Triângulos inferiores (lado branco, virados para cima)
            const xInf = boardMarginX + i * pointWidth;
            const corClaraInf = (Math.floor(i/2) % 2 === 1);
            desenharTriangulo(xInf, boardBottomY, pointWidth, pointHeight, true, corClaraInf);
        }
        
        // Números das casas (tradicional: 1 a 12 em cima, 13 a 24 embaixo)
        ctx.font = "bold 14px 'Segoe UI'";
        ctx.fillStyle = "#2c1a0c";
        for (let i = 0; i < 12; i++) {
            const x = boardMarginX + i * pointWidth + pointWidth/2;
            // Casas superiores: numeradas de 12 a 1 (da esquerda p/ direita? Tradicional: 1 no canto direito superior)
            // Vamos seguir a convenção: casa 1 no canto superior direito, casa 12 no superior esquerdo.
            let numSup = 12 - i;
            ctx.fillText(numSup.toString(), x, boardTopY - 10);
            
            // Casas inferiores: 13 no canto inferior esquerdo, 24 no canto inferior direito
            let numInf = 13 + i;
            ctx.fillText(numInf.toString(), x, boardBottomY + 25);
        }
        
        // Barra central
        ctx.fillStyle = '#8b6946';
        ctx.fillRect(barX, barTopY, barW, barHeight);
        ctx.strokeStyle = '#4a2c14';
        ctx.lineWidth = 3;
        ctx.strokeRect(barX, barTopY, barW, barHeight);
        ctx.fillStyle = "#f5e6d3";
        ctx.font = "bold 16px 'Segoe UI'";
        ctx.fillText("BARRA", barX+12, barTopY + barHeight/2);
        
        // Áreas de saída (home)
        ctx.fillStyle = "#4a7a5c";
        ctx.fillRect(20, 20, 100, 50);
        ctx.fillRect(w-120, 20, 100, 50);
        ctx.fillStyle = "#f5e6d3";
        ctx.font = "bold 14px";
        ctx.fillText("CASA VERMELHA", 25, 50);
        ctx.fillText("CASA BRANCA", w-115, 50);
        
        // Desenha as peças
        const board = estadoAtual.board;
        const bar = estadoAtual.bar;
        const home = estadoAtual.home;
        
        // Peças nos triângulos superiores (índices 0..11 -> casas 1..12 do lado vermelho)
        for (let i = 0; i < 12; i++) {
            const idx = 11 - i; // mapeamento: i=0 (casa 1) -> board[11]; i=11 (casa 12) -> board[0]
            const qtd = board[idx];
            if (qtd === 0) continue;
            const x = boardMarginX + i * pointWidth + pointWidth/2;
            const yBase = boardTopY + 10;
            const cor = qtd > 0 ? '#c73b2a' : '#f0e6d0';
            const absQtd = Math.abs(qtd);
            for (let j = 0; j < Math.min(absQtd, 5); j++) {
                ctx.beginPath();
                ctx.arc(x, yBase + j * 16, 12, 0, 2*Math.PI);
                ctx.fillStyle = cor;
                ctx.fill();
                ctx.strokeStyle = '#2b1a0e';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                if (absQtd > 5 && j === 4) {
                    ctx.fillStyle = '#333';
                    ctx.font = "bold 12px";
                    ctx.fillText("+"+(absQtd-5), x+8, yBase+70);
                }
            }
        }
        
        // Peças nos triângulos inferiores (índices 12..23 -> casas 13..24 lado branco)
        for (let i = 0; i < 12; i++) {
            const idx = 12 + i;
            const qtd = board[idx];
            if (qtd === 0) continue;
            const x = boardMarginX + i * pointWidth + pointWidth/2;
            const yBase = boardBottomY - 30;
            const cor = qtd > 0 ? '#c73b2a' : '#f0e6d0';
            const absQtd = Math.abs(qtd);
            for (let j = 0; j < Math.min(absQtd, 5); j++) {
                ctx.beginPath();
                ctx.arc(x, yBase - j * 16, 12, 0, 2*Math.PI);
                ctx.fillStyle = cor;
                ctx.fill();
                ctx.stroke();
                if (absQtd > 5 && j === 4) {
                    ctx.fillStyle = '#333';
                    ctx.fillText("+"+(absQtd-5), x+8, yBase-70);
                }
            }
        }
        
        // Peças na barra
        if (bar[0] > 0) {
            for (let j = 0; j < Math.min(bar[0], 6); j++) {
                ctx.beginPath();
                ctx.arc(barX+30, barTopY + 20 + j*20, 12, 0, 2*Math.PI);
                ctx.fillStyle = '#c73b2a';
                ctx.fill();
                ctx.stroke();
            }
            if (bar[0] > 6) ctx.fillText("+"+(bar[0]-6), barX+45, barTopY+130);
        }
        if (bar[1] > 0) {
            for (let j = 0; j < Math.min(bar[1], 6); j++) {
                ctx.beginPath();
                ctx.arc(barX+30, barBottomY - 20 - j*20, 12, 0, 2*Math.PI);
                ctx.fillStyle = '#f0e6d0';
                ctx.fill();
                ctx.stroke();
            }
            if (bar[1] > 6) ctx.fillText("+"+(bar[1]-6), barX+45, barBottomY-130);
        }
        
        // Contadores das casas
        ctx.font = "bold 18px";
        ctx.fillStyle = "#ffd966";
        ctx.fillText(`${home[0]}`, 70, 55);
        ctx.fillText(`${home[1]}`, w-70, 55);
        
        // Destaque da peça selecionada
        if (pecaSelecionada !== null) {
            const from = pecaSelecionada.from;
            let cx, cy;
            if (from === 24) { cx = barX+30; cy = barTopY+30; }
            else if (from === 25) { cx = barX+30; cy = barBottomY-30; }
            else if (from < 12) {
                const i = 11 - from;
                cx = boardMarginX + i * pointWidth + pointWidth/2;
                cy = boardTopY + 20;
            } else {
                const i = from - 12;
                cx = boardMarginX + i * pointWidth + pointWidth/2;
                cy = boardBottomY - 30;
            }
            ctx.beginPath();
            ctx.arc(cx, cy, 18, 0, 2*Math.PI);
            ctx.strokeStyle = 'gold';
            ctx.lineWidth = 4;
            ctx.stroke();
        }
        
        // Destaque dos destinos possíveis
        if (pecaSelecionada !== null && legalMoves) {
            const fromIdx = pecaSelecionada.from;
            const destinos = new Set();
            legalMoves.forEach(seq => {
                if (seq.moves && seq.moves[0] && seq.moves[0].from === fromIdx) {
                    destinos.add(seq.moves[0].to);
                }
            });
            destinos.forEach(to => {
                if (to === -1) return;
                let cx, cy;
                if (to === 24) { cx = barX+30; cy = barTopY+30; }
                else if (to === 25) { cx = barX+30; cy = barBottomY-30; }
                else if (to < 12) {
                    const i = 11 - to;
                    cx = boardMarginX + i * pointWidth + pointWidth/2;
                    cy = boardTopY + 20;
                } else {
                    const i = to - 12;
                    cx = boardMarginX + i * pointWidth + pointWidth/2;
                    cy = boardBottomY - 30;
                }
                ctx.beginPath();
                ctx.arc(cx, cy, 20, 0, 2*Math.PI);
                ctx.strokeStyle = '#2ecc71';
                ctx.lineWidth = 4;
                ctx.stroke();
            });
        }
    }
    
    // ========== DETECÇÃO DE CLIQUE (mapeamento preciso) ==========
    function getPointFromClick(mouseX, mouseY) {
        // Verifica barra
        if (mouseX >= barX && mouseX <= barX+barW) {
            if (mouseY >= barTopY && mouseY <= barTopY+80) return 24; // barra vermelha
            if (mouseY >= barBottomY-80 && mouseY <= barBottomY) return 25; // barra branca
        }
        // Triângulos superiores (casas 1 a 12, índices 0..11)
        for (let i = 0; i < 12; i++) {
            const x0 = boardMarginX + i * pointWidth;
            const x1 = x0 + pointWidth;
            if (mouseX >= x0 && mouseX <= x1 && mouseY >= boardTopY && mouseY <= boardTopY + pointHeight) {
                // índice do ponto no board: 11 - i (casa tradicional 1 = board[11])
                return 11 - i;
            }
        }
        // Triângulos inferiores (casas 13 a 24, índices 12..23)
        for (let i = 0; i < 12; i++) {
            const x0 = boardMarginX + i * pointWidth;
            const x1 = x0 + pointWidth;
            if (mouseX >= x0 && mouseX <= x1 && mouseY >= boardBottomY - pointHeight && mouseY <= boardBottomY) {
                return 12 + i;
            }
        }
        return -1;
    }
    
    canvas.addEventListener('click', (e) => {
        if (!jogoIniciado || meuLado === 0 || estadoAtual.turn !== meuLado || estadoAtual.rollPhase || estadoAtual.gameOver) return;
        
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;
        const point = getPointFromClick(x, y);
        if (point === -1) return;
        
        if (pecaSelecionada === null) {
            // Selecionar peça própria
            let count;
            if (point === 24) count = estadoAtual.bar[0];
            else if (point === 25) count = estadoAtual.bar[1];
            else count = estadoAtual.board[point];
            if ((meuLado === 1 && count > 0) || (meuLado === -1 && count < 0)) {
                pecaSelecionada = { from: point };
                desenharTabuleiro();
            }
        } else {
            const from = pecaSelecionada.from;
            const to = point;
            const seqValida = legalMoves.find(seq => seq.moves[0].from === from && seq.moves[0].to === to);
            if (seqValida) {
                movimentosPendentes.push({ from, to });
                pecaSelecionada = null;
                desenharTabuleiro();
                atualizarInterface();
            } else {
                pecaSelecionada = null;
                desenharTabuleiro();
            }
        }
    });
    
    // ========== CONTROLE DO JOGO ==========
    function atualizarInterface() {
        if (!estadoAtual) return;
        desenharTabuleiro();
        atualizarDados(estadoAtual.dice, estadoAtual.diceUsed);
        
        const turnoAtual = estadoAtual.turn;
        const meuTurno = (turnoAtual === meuLado);
        const corTurno = turnoAtual === 1 ? 'Vermelho' : 'Branco';
        document.getElementById('vez-atual').innerText = corTurno;
        const dirMsg = turnoAtual === 1 ? '↓ horário' : '↑ anti-horário';
        document.getElementById('direcao-movimento').innerText = dirMsg;
        
        const statusEl = document.getElementById('status-jogo');
        if (estadoAtual.gameOver) {
            const vencedor = estadoAtual.winner === 1 ? 'Vermelho' : 'Branco';
            statusEl.innerText = `🏆 ${vencedor} venceu!`;
        } else if (!meuTurno) {
            statusEl.innerText = `⏳ Aguardando ${corTurno}...`;
        } else if (estadoAtual.rollPhase) {
            statusEl.innerText = '🎲 Sua vez! Role os dados.';
        } else {
            statusEl.innerText = '🖱️ Selecione peça e destino.';
        }
        
        const btnRolar = document.getElementById('btn-rolar');
        const btnConfirmar = document.getElementById('btn-confirmar');
        const btnCancelar = document.getElementById('btn-cancelar');
        if (!jogoIniciado || !meuTurno || estadoAtual.gameOver) {
            btnRolar.style.display = 'none';
            btnConfirmar.style.display = 'none';
            btnCancelar.style.display = 'none';
        } else if (estadoAtual.rollPhase) {
            btnRolar.style.display = 'inline-block';
            btnConfirmar.style.display = 'none';
            btnCancelar.style.display = 'none';
        } else {
            btnRolar.style.display = 'none';
            btnConfirmar.style.display = movimentosPendentes.length > 0 ? 'inline-block' : 'none';
            btnCancelar.style.display = movimentosPendentes.length > 0 ? 'inline-block' : 'none';
        }
    }
    
    function atualizarDados(dice, used) {
        const dado1 = document.getElementById('dado1');
        const dado2 = document.getElementById('dado2');
        dado1.innerText = dice[0] || '?';
        dado2.innerText = dice[1] || '?';
        dado1.classList.toggle('usado', used[0]);
        dado2.classList.toggle('usado', used[1]);
    }
    
    function confirmarMovimentos() {
        if (movimentosPendentes.length === 0) return;
        socket.emit('moverPecas', { moves: movimentosPendentes });
        movimentosPendentes = [];
        pecaSelecionada = null;
        legalMoves = [];
        atualizarInterface();
    }
    
    function cancelarMovimentos() {
        movimentosPendentes = [];
        pecaSelecionada = null;
        atualizarInterface();
        desenharTabuleiro();
    }
    
    function rolarDados() { socket.emit('rolarDados'); }
    function desistir() { if (confirm('Desistir da partida?')) socket.emit('desistir'); }
    
    // ========== EVENTOS SOCKET ==========
    function entrar() {
        const apelido = document.getElementById('input-apelido').value.trim();
        const sala = document.getElementById('input-sala').value.trim();
        if (!apelido || !sala) return alert('Preencha nome e sala!');
        salaAtual = sala;
        socket.emit('entrarSala', { apelido, sala });
        document.getElementById('tela-login').style.display = 'none';
        document.getElementById('lobby').style.display = 'block';
        document.getElementById('painel-chat').style.display = 'block';
    }
    
    function marcarPronto() {
        socket.emit('marcarPronto');
        document.getElementById('btn-pronto').disabled = true;
        document.getElementById('btn-pronto').innerText = 'Aguardando oponente...';
    }
    
    function enviarMensagem() {
        const input = document.getElementById('input-mensagem');
        const msg = input.value.trim();
        if (msg) { socket.emit('enviarMensagem', msg); input.value = ''; }
    }
    
    socket.on('connect', () => document.getElementById('status-conexao').innerText = "✅ Conectado");
    socket.on('disconnect', () => document.getElementById('status-conexao').innerText = "❌ Desconectado");
    socket.on('erro', (msg) => alert(msg));
    
    socket.on('definirPapel', (dados) => {
        if (dados.papel === 'jogador') {
            meuLado = dados.lado;
            document.getElementById('meu-lado').innerText = meuLado === 1 ? 'Vermelho' : 'Branco';
        } else {
            meuLado = 0;
            document.getElementById('meu-lado').innerText = 'Espectador';
        }
    });
    
    socket.on('estadoLobby', (dados) => {
        document.getElementById('info-sala').innerHTML = `<p>Sala: <strong>${salaAtual}</strong> | Jogadores: ${dados.jogadoresInfo.length}/2</p>`;
        let lista = '';
        dados.jogadoresInfo.forEach(j => lista += `<li>👤 ${j.nome} (${j.lado === 1 ? 'Vermelho' : 'Branco'}) ${j.pronto ? '✅' : '⏳'}</li>`);
        dados.espectadores.forEach(e => lista += `<li>👁️ ${e} (espectador)</li>`);
        document.getElementById('lista-alunos').innerHTML = lista;
        if (dados.rodando) {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('area-jogo').style.display = 'block';
            document.getElementById('painel-historico').style.display = 'block';
            jogoIniciado = true;
        } else {
            document.getElementById('lobby').style.display = 'block';
            document.getElementById('area-jogo').style.display = 'none';
        }
    });
    
    socket.on('iniciarPartida', (dados) => {
        jogoIniciado = true;
        estadoAtual = dados.estado;
        if (dados.lado !== 'espectador') meuLado = dados.lado;
        legalMoves = [];
        desenharTabuleiro();
        atualizarInterface();
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('area-jogo').style.display = 'block';
    });
    
    socket.on('estadoAtual', (estado) => {
        estadoAtual = estado;
        legalMoves = [];
        desenharTabuleiro();
        atualizarInterface();
    });
    
    socket.on('dadosRolados', ({ dice, turn, legalMoves: moves }) => {
        estadoAtual.dice = dice;
        estadoAtual.diceUsed = [false, false];
        estadoAtual.rollPhase = false;
        legalMoves = moves;
        desenharTabuleiro();
        atualizarInterface();
    });
    
    socket.on('jogadaFeita', (dados) => {
        estadoAtual = dados.estado;
        legalMoves = dados.legalMoves || [];
        if (dados.historico) {
            document.getElementById('historico').innerHTML = dados.historico.map(l => `<div>${l}</div>`).join('');
        }
        desenharTabuleiro();
        atualizarInterface();
        movimentosPendentes = [];
        pecaSelecionada = null;
    });
    
    socket.on('fimDeJogo', (dados) => {
        alert(dados.mensagem);
        jogoIniciado = false;
        document.getElementById('area-jogo').style.display = 'none';
        document.getElementById('lobby').style.display = 'block';
        document.getElementById('btn-pronto').disabled = false;
        document.getElementById('btn-pronto').innerText = 'ESTOU PRONTO';
    });
    
    socket.on('novaMensagem', (msg) => {
        const div = document.getElementById('chat-mensagens');
        const hora = new Date(msg.timestamp).toLocaleTimeString();
        div.innerHTML += `<div><strong>${msg.remetente}</strong> <span class="badge">${hora}</span>: ${msg.texto}</div>`;
        div.scrollTop = div.scrollHeight;
    });
    
    document.getElementById('input-mensagem').addEventListener('keypress', (e) => { if (e.key === 'Enter') enviarMensagem(); });
</script>
</body>
</html>
