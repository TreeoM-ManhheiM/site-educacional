<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gamão Clássico — Separação Central</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #1a2a1a;
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px;
        }
        .game-container {
            background: #2c3e2b;
            border-radius: 48px;
            padding: 24px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.6);
        }
        .board-wrapper {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }
        .canvas-frame {
            background: #3a2a1a;
            border-radius: 36px;
            padding: 12px;
            box-shadow: inset 0 0 0 2px #5a4a2a, 0 10px 20px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            border-radius: 28px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
            cursor: pointer;
        }
        .info-panel {
            background: #1e2a1e;
            border-radius: 32px;
            width: 300px;
            color: #efe0c9;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 16px;
            box-shadow: inset 0 0 0 1px rgba(255,255,200,0.1), 0 8px 20px rgba(0,0,0,0.4);
        }
        .status-card {
            background: #0f1a0f;
            border-radius: 24px;
            padding: 12px;
            text-align: center;
            border-left: 6px solid #e0a82b;
        }
        .status-message {
            background: #2a3a2a;
            margin-top: 10px;
            padding: 6px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #ffdd99;
        }
        .home-indicators {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        .home-box {
            background: #2a3a2a;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 0.85rem;
        }
        .dice-area { display: flex; justify-content: center; gap: 20px; margin: 12px 0; }
        .dice {
            width: 64px;
            height: 64px;
            background: #f8f0e0;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            box-shadow: 0 6px 0 #aa8a60;
            transition: 0.08s linear;
        }
        .dice.rolling { animation: shake 0.3s ease-in-out; }
        @keyframes shake {
            0% { transform: translate(0,0) rotate(0deg); }
            25% { transform: translate(3px,-3px) rotate(5deg); }
            75% { transform: translate(-3px,2px) rotate(-5deg); }
            100% { transform: translate(0,0) rotate(0deg); }
        }
        .dice.used { opacity: 0.5; filter: grayscale(0.3); transform: translateY(4px); box-shadow: 0 2px 0 #aa8a60; }
        button {
            background: #7a5a3a;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: bold;
            color: #fef0da;
            cursor: pointer;
            box-shadow: 0 3px 0 #4a2e1a;
            font-family: inherit;
        }
        button:active { transform: translateY(2px); box-shadow: 0 1px 0 #4a2e1a; }
        .primary-btn { background: #2b7a4b; box-shadow: 0 3px 0 #1a4a2a; }
        .danger-btn { background: #9a3a2a; box-shadow: 0 3px 0 #5a2010; }
        .action-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
        .chat-messages {
            background: #0a120a;
            border-radius: 20px;
            height: 140px;
            overflow-y: auto;
            padding: 8px;
            font-size: 0.75rem;
            font-family: monospace;
        }
        .chat-input-area { display: flex; gap: 8px; margin-top: 8px; }
        .chat-input-area input {
            flex: 1;
            background: #1e2a1e;
            border: none;
            border-radius: 40px;
            padding: 8px 12px;
            color: #efe0c9;
            outline: none;
        }
        .log-area {
            background: #0a120a;
            border-radius: 20px;
            height: 120px;
            overflow-y: auto;
            padding: 8px;
            font-family: monospace;
            font-size: 0.7rem;
        }
        footer { font-size: 0.65rem; text-align: center; margin-top: 12px; color: #b8c8a0; }
        .tab-buttons { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab-btn {
            background: #2a3a2a;
            border: none;
            padding: 6px 12px;
            border-radius: 30px;
            color: #ddcca8;
            cursor: pointer;
        }
        .tab-btn.active { background: #7a5a3a; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        @media (max-width: 900px) { .board-wrapper { flex-direction: column; align-items: center; } .info-panel { width: 100%; } }
    </style>
</head>
<body>
<div class="game-container">
    <div class="board-wrapper">
        <div class="canvas-frame">
            <canvas id="boardCanvas" width="1100" height="620"></canvas>
        </div>
        <div class="info-panel">
            <div class="tab-buttons">
                <button class="tab-btn active" data-tab="jogo">Jogo</button>
                <button class="tab-btn" data-tab="chat">Chat</button>
                <button class="tab-btn" data-tab="logs">Logs</button>
            </div>
            <div id="tabJogo" class="tab-content active">
                <div class="status-card">
                    <div>⚫ Seu lado: <strong id="meuLadoLabel">---</strong></div>
                    <div>🔄 Turno: <strong id="turnoLabel">---</strong></div>
                    <div class="status-message" id="statusMsg">Aguardando conexão...</div>
                    <div class="home-indicators">
                        <span class="home-box">🏠 Vermelha: <span id="homeVermelha">0</span></span>
                        <span class="home-box">⚪ Branca: <span id="homeBranca">0</span></span>
                    </div>
                </div>
                <div class="dice-area">
                    <div class="dice" id="dado1">⚀</div>
                    <div class="dice" id="dado2">⚀</div>
                </div>
                <div class="action-buttons">
                    <button id="rolarBtn" class="primary-btn">🎲 Rolar</button>
                    <button id="desistirBtn" class="danger-btn">🏳️ Desistir</button>
                </div>
                <div class="action-buttons">
                    <button id="confirmarBtn" style="background:#3a7a5a; display:none;">✅ Confirmar</button>
                    <button id="cancelarBtn" style="background:#7a5a3a; display:none;">↩️ Cancelar</button>
                </div>
                <footer>Clique na peça → destino verde</footer>
            </div>
            <div id="tabChat" class="tab-content">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Mensagem...">
                    <button id="enviarChat">Enviar</button>
                </div>
            </div>
            <div id="tabLogs" class="tab-content">
                <div class="log-area" id="logPanel"><div>🔹 Sistema pronto</div></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    // ------------------- CONEXÃO SOCKET -------------------
    const socket = io("https://motor-gamao.onrender.com");
    let estado = null;
    let meuLado = 0;
    let jogoAtivo = false;
    let salaAtual = "gamão";
    let movimentosPendentes = [];
    let pecaSelecionada = null;
    let dadosDisponiveis = [];
    let meuNome = "Jogador";

    const canvas = document.getElementById("boardCanvas");
    const ctx = canvas.getContext("2d");
    const w = 1100, h = 620;
    canvas.width = w; canvas.height = h;

    // ========== GEOMETRIA COM SEPARAÇÃO CENTRAL NÍTIDA ==========
    // Largura total da área de jogo (excluindo margens)
    const marginX = 80;
    const marginY = 60;
    const boardWidth = w - marginX * 2;
    // Largura de cada lado (esquerdo e direito) é metade da largura total
    const sideWidth = boardWidth / 2;
    // Largura de cada triângulo (6 por lado)
    const pointW = sideWidth / 6;
    const pointH = 140;
    const topY = marginY;
    const bottomY = h - marginY;
    // Barra central: ocupa 60px entre os lados
    const barWidth = 60;
    const barLeft = marginX + sideWidth - barWidth/2;
    const barRight = barLeft + barWidth;
    const barTop = topY + 10;
    const barBottom = bottomY - 10;
    // Coordenadas dos triângulos: lado esquerdo (x = marginX + i*pointW), lado direito (x = marginX + sideWidth + i*pointW)
    
    // ========== LÓGICA DE MOVIMENTOS (local, igual à anterior) ==========
    function getDirection(lado) { return lado === 1 ? 1 : -1; }
    function isBlocked(point, lado) {
        if (!estado || point<0 || point>=24) return false;
        const q = estado.board[point];
        return lado===1 ? q<-1 : q>1;
    }
    function getDestinos(from, steps, lado) {
        const destinos = [];
        if (from===24) {
            let d = steps-1;
            if (d>=0 && d<24 && !isBlocked(d,lado)) destinos.push(d);
            return destinos;
        }
        if (from===25) {
            let d = 24-steps;
            if (d>=0 && d<24 && !isBlocked(d,lado)) destinos.push(d);
            return destinos;
        }
        const dir = getDirection(lado);
        let dest = from + dir*steps;
        if (dest<0 || dest>=24) destinos.push(dest);
        else if (!isBlocked(dest,lado)) destinos.push(dest);
        return destinos;
    }
    function calcularMovimentosLocais() {
        if (!estado || estado.turn !== meuLado) return [];
        const lado = meuLado;
        let origens = [];
        if (lado===1 && estado.bar[0]>0) origens.push(24);
        if (lado===-1 && estado.bar[1]>0) origens.push(25);
        for (let i=0; i<24; i++) {
            const q = estado.board[i];
            if ((lado===1 && q>0) || (lado===-1 && q<0)) origens.push(i);
        }
        const moves = [];
        for (let idx=0; idx<dadosDisponiveis.length; idx++) {
            const steps = dadosDisponiveis[idx];
            for (let from of origens) {
                for (let to of getDestinos(from, steps, lado)) {
                    moves.push({from, to, dadoIdx: idx});
                }
            }
        }
        return moves;
    }
    function atualizarDadosDisponiveis() {
        if (!estado) return;
        const d1=estado.dice[0], d2=estado.dice[1], used=estado.diceUsed;
        if (d1===d2) {
            let arr = [d1,d1,d1,d1];
            if (used[0]) arr.shift();
            if (used[1]) arr.shift();
            dadosDisponiveis = arr;
        } else {
            dadosDisponiveis = [];
            if (!used[0]) dadosDisponiveis.push(d1);
            if (!used[1]) dadosDisponiveis.push(d2);
        }
    }

    // ========== DESENHO DO TABULEIRO (com separação central clara) ==========
    function desenharTriangulo(x, y, largura, altura, paraCima, corClara) {
        const grad = ctx.createLinearGradient(x, y, x, paraCima ? y-altura : y+altura);
        if (corClara) {
            grad.addColorStop(0, "#e7cba5");
            grad.addColorStop(1, "#c8a06e");
        } else {
            grad.addColorStop(0, "#8b5a2e");
            grad.addColorStop(1, "#5a3820");
        }
        ctx.beginPath();
        if (paraCima) {
            ctx.moveTo(x, y);
            ctx.lineTo(x + largura/2, y - altura);
            ctx.lineTo(x + largura, y);
        } else {
            ctx.moveTo(x, y);
            ctx.lineTo(x + largura/2, y + altura);
            ctx.lineTo(x + largura, y);
        }
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = "#2a1a0a";
        ctx.lineWidth = 1.2;
        ctx.stroke();
    }

    function desenharPeca(x, y, cor, camada=0) {
        ctx.save();
        ctx.shadowBlur = Math.max(3, 5 - camada*0.8);
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 2;
        ctx.shadowColor = "rgba(0,0,0,0.5)";
        const grad = ctx.createRadialGradient(x-4, y-4, 5, x, y, 14);
        if (cor === "red") grad.addColorStop(0, "#e06050"), grad.addColorStop(1, "#962818");
        else grad.addColorStop(0, "#fff5e8"), grad.addColorStop(1, "#d4bc92");
        ctx.beginPath();
        ctx.arc(x, y, 13, 0, 2*Math.PI);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = "#1a0e05";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x-3, y-3, 3, 0, 2*Math.PI);
        ctx.fillStyle = "rgba(255,250,210,0.8)";
        ctx.fill();
        ctx.restore();
    }

    function desenharBase() {
        ctx.clearRect(0, 0, w, h);
        // Fundo de madeira
        ctx.fillStyle = "#a87b51";
        ctx.fillRect(0, 0, w, h);
        // Textura suave
        ctx.save();
        ctx.globalAlpha = 0.15;
        for (let i=0; i<200; i++) {
            ctx.beginPath();
            ctx.moveTo(0, i*5);
            ctx.lineTo(w, i*5 + (i%3));
            ctx.strokeStyle = "#3a2510";
            ctx.stroke();
        }
        ctx.restore();

        // Desenha triângulos do lado ESQUERDO (6 superiores + 6 inferiores)
        for (let i=0; i<6; i++) {
            const x = marginX + i*pointW;
            const claro = (i%2===0);
            desenharTriangulo(x, topY, pointW, pointH, false, claro);
            desenharTriangulo(x, bottomY, pointW, pointH, true, !claro);
        }
        // Desenha triângulos do lado DIREITO (6 superiores + 6 inferiores)
        for (let i=0; i<6; i++) {
            const x = marginX + sideWidth + i*pointW;
            const claro = (i%2===0);
            desenharTriangulo(x, topY, pointW, pointH, false, claro);
            desenharTriangulo(x, bottomY, pointW, pointH, true, !claro);
        }

        // Barra central (separação) - larga e com detalhes
        ctx.fillStyle = "#8b6946";
        ctx.fillRect(barLeft, barTop, barWidth, barBottom-barTop);
        ctx.fillStyle = "#c9a87b";
        for (let i=0; i<3; i++) {
            ctx.fillRect(barLeft + 12 + i*15, barTop + 15, 6, (barBottom-barTop)-30);
        }
        ctx.strokeStyle = "#4a2a10";
        ctx.lineWidth = 3;
        ctx.strokeRect(barLeft, barTop, barWidth, barBottom-barTop);
        ctx.font = "bold 24px 'Georgia'";
        ctx.fillStyle = "#fae0b0";
        ctx.fillText("⚫", barLeft+barWidth/2-12, barTop + (barBottom-barTop)/2 + 8);
        ctx.font = "bold 14px 'Segoe UI'";
        ctx.fillText("BARRA", barLeft+barWidth/2-20, barTop + (barBottom-barTop)/2 + 35);

        // Numeração das casas (1 a 12 em cima, 13 a 24 embaixo)
        ctx.font = "bold 15px 'Georgia'";
        ctx.fillStyle = "#2c1a08";
        ctx.textAlign = "center";
        // Superior lado esquerdo: casas 6,5,4,3,2,1 (da esquerda para direita)
        for (let i=0; i<6; i++) {
            const x = marginX + i*pointW + pointW/2;
            ctx.fillText((6-i).toString(), x, topY-12);
        }
        // Superior lado direito: casas 7,8,9,10,11,12
        for (let i=0; i<6; i++) {
            const x = marginX + sideWidth + i*pointW + pointW/2;
            ctx.fillText((7+i).toString(), x, topY-12);
        }
        // Inferior lado esquerdo: casas 13,14,15,16,17,18
        for (let i=0; i<6; i++) {
            const x = marginX + i*pointW + pointW/2;
            ctx.fillText((13+i).toString(), x, bottomY+24);
        }
        // Inferior lado direito: casas 19,20,21,22,23,24
        for (let i=0; i<6; i++) {
            const x = marginX + sideWidth + i*pointW + pointW/2;
            ctx.fillText((19+i).toString(), x, bottomY+24);
        }
        ctx.textAlign = "left";
    }

    function desenharPecas() {
        if (!estado) return;
        function pilha(x, yBase, qtd, cor, direcao) {
            const absQ = Math.abs(qtd);
            const maxVis = 6;
            const step = 13;
            for (let j=0; j<Math.min(absQ, maxVis); j++) {
                const y = direcao==='down' ? yBase + j*step : yBase - j*step;
                desenharPeca(x, y, cor, j);
            }
            if (absQ > maxVis) {
                ctx.fillStyle = "#222";
                ctx.font = "bold 10px monospace";
                ctx.fillText(`+${absQ-maxVis}`, x+12, direcao==='down' ? yBase + (maxVis-1)*step + 12 : yBase - (maxVis-1)*step - 8);
            }
        }

        // Mapeamento dos índices (0..23) para coordenadas
        // Superior esquerdo: índices 5,4,3,2,1,0 (casas 1 a 6)
        for (let i=0; i<6; i++) {
            const idx = 5 - i;
            const q = estado.board[idx];
            if (q !== 0) {
                const x = marginX + i*pointW + pointW/2;
                const yBase = topY + 20;
                pilha(x, yBase, q, q>0 ? "red" : "white", "down");
            }
        }
        // Superior direito: índices 11,10,9,8,7,6 (casas 7 a 12)
        for (let i=0; i<6; i++) {
            const idx = 11 - i;
            const q = estado.board[idx];
            if (q !== 0) {
                const x = marginX + sideWidth + i*pointW + pointW/2;
                const yBase = topY + 20;
                pilha(x, yBase, q, q>0 ? "red" : "white", "down");
            }
        }
        // Inferior esquerdo: índices 12..17
        for (let i=0; i<6; i++) {
            const idx = 12 + i;
            const q = estado.board[idx];
            if (q !== 0) {
                const x = marginX + i*pointW + pointW/2;
                const yBase = bottomY - 30;
                pilha(x, yBase, q, q>0 ? "red" : "white", "up");
            }
        }
        // Inferior direito: índices 18..23
        for (let i=0; i<6; i++) {
            const idx = 18 + i;
            const q = estado.board[idx];
            if (q !== 0) {
                const x = marginX + sideWidth + i*pointW + pointW/2;
                const yBase = bottomY - 30;
                pilha(x, yBase, q, q>0 ? "red" : "white", "up");
            }
        }

        // Peças na barra
        if (estado.bar[0] > 0) {
            for (let j=0; j<Math.min(estado.bar[0],6); j++) {
                desenharPeca(barLeft+barWidth/2, barTop + 20 + j*14, "red", j);
            }
            if (estado.bar[0] > 6) ctx.fillText(`+${estado.bar[0]-6}`, barLeft+barWidth/2+15, barTop+110);
        }
        if (estado.bar[1] > 0) {
            for (let j=0; j<Math.min(estado.bar[1],6); j++) {
                desenharPeca(barLeft+barWidth/2, barBottom - 20 - j*14, "white", j);
            }
            if (estado.bar[1] > 6) ctx.fillText(`+${estado.bar[1]-6}`, barLeft+barWidth/2+15, barBottom-100);
        }
    }

    function desenharDestaques() {
        if (!pecaSelecionada || !estado) return;
        let cx, cy;
        const from = pecaSelecionada.from;
        if (from === 24) { cx = barLeft+barWidth/2; cy = barTop+25; }
        else if (from === 25) { cx = barLeft+barWidth/2; cy = barBottom-25; }
        else if (from < 12) {
            if (from <= 5) {
                const i = 5 - from;
                cx = marginX + i*pointW + pointW/2;
                cy = topY + 25;
            } else {
                const i = 11 - from;
                cx = marginX + sideWidth + i*pointW + pointW/2;
                cy = topY + 25;
            }
        } else {
            if (from <= 17) {
                const i = from - 12;
                cx = marginX + i*pointW + pointW/2;
                cy = bottomY - 35;
            } else {
                const i = from - 18;
                cx = marginX + sideWidth + i*pointW + pointW/2;
                cy = bottomY - 35;
            }
        }
        ctx.save();
        ctx.shadowBlur = 14; ctx.shadowColor = "#ffcc66";
        ctx.beginPath(); ctx.arc(cx, cy, 18, 0, 2*Math.PI);
        ctx.strokeStyle = "#ffcc66"; ctx.lineWidth = 4; ctx.stroke();
        ctx.restore();

        const moves = calcularMovimentosLocais();
        const destinos = new Set(moves.filter(m => m.from === from).map(m => m.to));
        destinos.forEach(to => {
            let cx, cy;
            if (to === 24) { cx = barLeft+barWidth/2; cy = barTop+25; }
            else if (to === 25) { cx = barLeft+barWidth/2; cy = barBottom-25; }
            else if (to < 12) {
                if (to <= 5) {
                    const i = 5 - to;
                    cx = marginX + i*pointW + pointW/2;
                    cy = topY + 25;
                } else {
                    const i = 11 - to;
                    cx = marginX + sideWidth + i*pointW + pointW/2;
                    cy = topY + 25;
                }
            } else {
                if (to <= 17) {
                    const i = to - 12;
                    cx = marginX + i*pointW + pointW/2;
                    cy = bottomY - 35;
                } else {
                    const i = to - 18;
                    cx = marginX + sideWidth + i*pointW + pointW/2;
                    cy = bottomY - 35;
                }
            }
            ctx.save();
            ctx.shadowBlur = 12; ctx.shadowColor = "#2ecc71";
            ctx.beginPath(); ctx.arc(cx, cy, 20, 0, 2*Math.PI);
            ctx.strokeStyle = "#2ecc71"; ctx.lineWidth = 4; ctx.stroke();
            ctx.restore();
        });
    }

    function desenharTudo() {
        desenharBase();
        if (estado) {
            desenharPecas();
            document.getElementById("homeVermelha").innerText = estado.home[0];
            document.getElementById("homeBranca").innerText = estado.home[1];
        }
        desenharDestaques();
    }

    // ========== CLIQUE ==========
    function getPointFromClick(px, py) {
        // Barra
        if (px >= barLeft && px <= barRight) {
            if (py >= barTop && py <= barTop+70) return 24;
            if (py >= barBottom-70 && py <= barBottom) return 25;
        }
        // Triângulos superiores esquerda
        for (let i=0; i<6; i++) {
            const x0 = marginX + i*pointW;
            const x1 = x0 + pointW;
            if (px>=x0 && px<=x1 && py>=topY && py<=topY+pointH) return 5-i;
        }
        // Superiores direita
        for (let i=0; i<6; i++) {
            const x0 = marginX + sideWidth + i*pointW;
            const x1 = x0 + pointW;
            if (px>=x0 && px<=x1 && py>=topY && py<=topY+pointH) return 11-i;
        }
        // Inferiores esquerda
        for (let i=0; i<6; i++) {
            const x0 = marginX + i*pointW;
            const x1 = x0 + pointW;
            if (px>=x0 && px<=x1 && py>=bottomY-pointH && py<=bottomY) return 12+i;
        }
        // Inferiores direita
        for (let i=0; i<6; i++) {
            const x0 = marginX + sideWidth + i*pointW;
            const x1 = x0 + pointW;
            if (px>=x0 && px<=x1 && py>=bottomY-pointH && py<=bottomY) return 18+i;
        }
        return -1;
    }

    canvas.addEventListener("click", (e) => {
        if (!jogoAtivo || meuLado===0 || !estado) return;
        if (estado.turn !== meuLado) { addLog("⏳ Não é seu turno","#ffaa88"); return; }
        if (estado.rollPhase) { addLog("🎲 Role os dados primeiro","#ffaa88"); return; }
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
        const mx = (e.clientX-rect.left)*scaleX, my = (e.clientY-rect.top)*scaleY;
        const point = getPointFromClick(mx, my);
        if (point===-1) return;
        let count;
        if (point===24) count=estado.bar[0];
        else if (point===25) count=estado.bar[1];
        else count=estado.board[point];
        const isMine = (meuLado===1 && count>0) || (meuLado===-1 && count<0);
        if (pecaSelecionada===null) {
            if (isMine) { pecaSelecionada={from:point}; addLog(`🔍 Selecionado ${point}`,"#aaffaa"); desenharTudo(); }
            else addLog("❌ Peça adversária","#ff8888");
        } else {
            const from=pecaSelecionada.from, to=point;
            const valido = calcularMovimentosLocais().find(m=>m.from===from && m.to===to);
            if (valido) {
                addLog(`✅ ${from}→${to}`,"#aaffaa");
                movimentosPendentes.push({from,to});
                const steps = Math.abs(to-from);
                let idx = dadosDisponiveis.findIndex(v=>v===steps);
                if (idx!==-1) dadosDisponiveis.splice(idx,1);
                pecaSelecionada=null;
                desenharTudo();
                atualizarInterface();
                if (dadosDisponiveis.length===0 && movimentosPendentes.length>0) {
                    addLog("⚡ Confirmando...","#ffdd88");
                    confirmarJogada();
                }
            } else {
                addLog(`❌ Inválido ${from}→${to}`,"#ff8888");
                pecaSelecionada=null;
                desenharTudo();
            }
        }
    });

    function confirmarJogada() { if (movimentosPendentes.length) socket.emit("moverPecas",{moves:movimentosPendentes}); movimentosPendentes=[]; pecaSelecionada=null; }
    function cancelarMovimentos() { movimentosPendentes=[]; pecaSelecionada=null; atualizarDadosDisponiveis(); desenharTudo(); atualizarInterface(); addLog("🔄 Cancelado","#ffdd88"); }
    function rolarDados() { socket.emit("rolarDados"); addLog("🎲 Rolando...","#ccccff"); document.getElementById("dado1").classList.add("rolling"); document.getElementById("dado2").classList.add("rolling"); setTimeout(()=>{ document.getElementById("dado1").classList.remove("rolling"); document.getElementById("dado2").classList.remove("rolling"); },300); }
    function desistir() { if (confirm("Desistir?")) socket.emit("desistir"); }

    function atualizarInterface() {
        if (!estado) return;
        document.getElementById("turnoLabel").innerHTML = estado.turn===1?"VERMELHO ↓":"BRANCO ↑";
        const pMap={1:"●",2:"●●",3:"●●●",4:"●●●●",5:"●●●●●",6:"●●●●●●"};
        document.getElementById("dado1").innerText = pMap[estado.dice[0]]||"?";
        document.getElementById("dado2").innerText = pMap[estado.dice[1]]||"?";
        document.getElementById("dado1").classList.toggle("used", estado.diceUsed[0]);
        document.getElementById("dado2").classList.toggle("used", estado.diceUsed[1]);
        const rolar=document.getElementById("rolarBtn"), conf=document.getElementById("confirmarBtn"), canc=document.getElementById("cancelarBtn");
        const meuTurno = (estado.turn===meuLado);
        if (!jogoAtivo || !meuTurno || estado.gameOver) {
            rolar.style.display="none"; conf.style.display="none"; canc.style.display="none";
        } else if (estado.rollPhase) {
            rolar.style.display="inline-block"; conf.style.display="none"; canc.style.display="none";
        } else {
            rolar.style.display="none";
            conf.style.display=movimentosPendentes.length?"inline-block":"none";
            canc.style.display=movimentosPendentes.length?"inline-block":"none";
        }
        const statusDiv = document.getElementById("statusMsg");
        if (estado.gameOver) statusDiv.innerHTML = `🏆 ${estado.winner===1?"Vermelho":"Branco"} venceu!`;
        else if (estado.turn===meuLado && !estado.rollPhase) statusDiv.innerHTML = "🎯 Sua vez! Selecione uma peça.";
        else if (estado.turn===meuLado && estado.rollPhase) statusDiv.innerHTML = "🎲 Role os dados!";
        else if (estado.turn!==meuLado) statusDiv.innerHTML = "⏳ Aguardando oponente...";
        else statusDiv.innerHTML = "🏁 Partida em andamento.";
        desenharTudo();
    }

    function addLog(msg, cor="#ddd") {
        const logDiv = document.getElementById("logPanel");
        const p = document.createElement("div"); p.style.color=cor; p.innerHTML=`🔹 ${new Date().toLocaleTimeString()} ${msg}`;
        logDiv.appendChild(p); p.scrollIntoView({behavior:"smooth",block:"nearest"});
        while (logDiv.children.length>60) logDiv.removeChild(logDiv.firstChild);
    }

    // ========== SOCKET ==========
    function entrar() {
        socket.emit("entrarSala", {apelido: meuNome, sala: salaAtual});
        addLog(`📡 Conectando à sala "${salaAtual}" como "${meuNome}"`, "#88ffaa");
    }
    socket.on("connect", () => { addLog("✅ Conectado","#88ffaa"); entrar(); });
    socket.on("disconnect", () => addLog("❌ Desconectado","#ff8888"));
    socket.on("erro", (m) => addLog(`⚠️ ${m}`,"#ffaa88"));
    socket.on("definirPapel", (d) => {
        if (d.papel==="jogador") { meuLado=d.lado; document.getElementById("meuLadoLabel").innerHTML=meuLado===1?"VERMELHO":"BRANCO"; addLog(`🎭 Você é ${meuLado===1?"Vermelho":"Branco"}`,"#aaffaa"); }
        else { meuLado=0; document.getElementById("meuLadoLabel").innerHTML="ESPECTADOR"; }
    });
    socket.on("estadoLobby", (d) => { if (d.rodando) { jogoAtivo=true; addLog("🏁 Partida iniciada!","#ffffaa"); } });
    socket.on("iniciarPartida", (d) => { jogoAtivo=true; estado=d.estado; if (d.lado!=="espectador") meuLado=d.lado; atualizarDadosDisponiveis(); atualizarInterface(); addLog("🚀 Jogo iniciado","#aaffaa"); });
    socket.on("estadoAtual", (n) => { estado=n; atualizarDadosDisponiveis(); atualizarInterface(); });
    socket.on("dadosRolados", ({dice}) => { estado.dice=dice; estado.diceUsed=[false,false]; estado.rollPhase=false; atualizarDadosDisponiveis(); addLog(`🎲 Dados: ${dice[0]} e ${dice[1]}`,"#aaffaa"); atualizarInterface(); });
    socket.on("jogadaFeita", (d) => { estado=d.estado; movimentosPendentes=[]; pecaSelecionada=null; atualizarDadosDisponiveis(); atualizarInterface(); addLog("♟️ Jogada confirmada","#aaffaa"); });
    socket.on("fimDeJogo", (d) => { alert(d.mensagem); jogoAtivo=false; addLog(`🏆 ${d.mensagem}`,"#ffff88"); atualizarInterface(); });
    socket.on("novaMensagem", (m) => { const chat=document.getElementById("chatMessages"); const hora=new Date(m.timestamp).toLocaleTimeString(); chat.innerHTML+=`<div><strong>${m.remetente}</strong> <span style="font-size:0.7rem;">${hora}</span>: ${m.texto}</div>`; chat.scrollTop=chat.scrollHeight; });

    document.getElementById("rolarBtn").onclick=rolarDados;
    document.getElementById("desistirBtn").onclick=desistir;
    document.getElementById("confirmarBtn").onclick=confirmarJogada;
    document.getElementById("cancelarBtn").onclick=cancelarMovimentos;
    document.getElementById("enviarChat").onclick=()=>{ const inp=document.getElementById("chatInput"); const msg=inp.value.trim(); if(msg){ socket.emit("enviarMensagem",msg); if(meuNome==="Jogador" && msg.length) meuNome=msg; inp.value=""; } };
    document.getElementById("chatInput").addEventListener("keypress",e=>{ if(e.key==="Enter") document.getElementById("enviarChat").click(); });
    document.querySelectorAll(".tab-btn").forEach(btn=>{ btn.addEventListener("click",()=>{ const tab=btn.dataset.tab; document.querySelectorAll(".tab-content").forEach(tc=>tc.classList.remove("active")); document.getElementById(`tab${tab.charAt(0).toUpperCase()+tab.slice(1)}`).classList.add("active"); document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); }); });

    desenharBase(); // mostra o tabuleiro imediatamente
</script>
</body>
</html>
