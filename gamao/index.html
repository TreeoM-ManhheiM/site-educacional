<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gamão Clássico — Edição Profissional</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #1a472a;
            font-family: 'Segoe UI', 'Roboto', 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container principal do jogo */
        .game-wrapper {
            background: #2c5a2c;
            border-radius: 48px;
            padding: 20px 24px 24px 24px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* Área do tabuleiro + informações laterais */
        .board-container {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Canvas do tabuleiro (tamanho fixo e proporcional) */
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 28px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.5);
            background: radial-gradient(circle at 30% 20%, #e0bc7c, #b87c4a);
            cursor: pointer;
        }

        /* Painel direito com informações e chat */
        .info-panel {
            background: #1e3a2a;
            border-radius: 28px;
            padding: 20px;
            width: 280px;
            color: #f0e2c5;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.2), 0 5px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .status-card {
            background: #0f2a1a;
            border-radius: 20px;
            padding: 12px 16px;
            text-align: center;
            border-left: 5px solid #e0a82b;
        }

        .status-card h3 {
            font-size: 1rem;
            letter-spacing: 1px;
            color: #ffd966;
            margin-bottom: 8px;
        }

        .dice-area {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px 0;
        }

        .dice {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: bold;
            color: #2c1a0c;
            box-shadow: 0 5px 0 #aa8a60;
            transition: 0.1s linear;
        }

        .dice.used {
            opacity: 0.4;
            filter: grayscale(0.2);
        }

        button {
            background: #7a5a3a;
            border: none;
            padding: 10px 18px;
            border-radius: 60px;
            font-weight: bold;
            color: #f0e2c5;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 3px 0 #4a2e1a;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #4a2e1a;
        }

        .primary-btn {
            background: #2b7a4b;
            box-shadow: 0 3px 0 #1a4a2a;
        }

        .danger-btn {
            background: #9a3a2a;
            box-shadow: 0 3px 0 #5a2010;
        }

        .chat-box {
            background: #0f2a1a;
            border-radius: 20px;
            padding: 12px;
            height: 180px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            font-size: 0.8rem;
            padding-right: 5px;
        }

        .chat-input {
            display: flex;
            gap: 8px;
        }

        .chat-input input {
            flex: 1;
            background: #2a3a2a;
            border: none;
            border-radius: 40px;
            padding: 8px 12px;
            color: #f0e2c5;
            outline: none;
        }

        .log-area {
            background: #0a1a0a;
            border-radius: 16px;
            padding: 8px;
            height: 140px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.7rem;
        }

        .home-indicators {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-weight: bold;
        }

        .home-box {
            background: #0f2a1a;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 0.9rem;
        }

        footer {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 16px;
            color: #b8d0b0;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="board-container">
        <canvas id="boardCanvas" width="1050" height="580"></canvas>

        <div class="info-panel">
            <div class="status-card">
                <h3>⚫ SEU LADO: <span id="meuLadoLabel">---</span></h3>
                <div>🔁 TURNO: <span id="turnoLabel">---</span></div>
                <div class="home-indicators">
                    <span class="home-box">🏠 VERMELHA: <span id="homeVermelha">0</span></span>
                    <span class="home-box">⚪ BRANCA: <span id="homeBranca">0</span></span>
                </div>
            </div>

            <div class="dice-area">
                <div class="dice" id="dado1">⚀</div>
                <div class="dice" id="dado2">⚀</div>
            </div>

            <div style="display: flex; gap: 12px; justify-content: center;">
                <button id="rolarBtn" class="primary-btn">🎲 ROLAR</button>
                <button id="desistirBtn" class="danger-btn">🏳️ DESISTIR</button>
            </div>
            <button id="confirmarBtn" style="background:#3a7a5a; display: none;">✅ CONFIRMAR JOGADA</button>
            <button id="cancelarBtn" style="background:#7a5a3a; display: none;">↩️ CANCELAR</button>

            <div class="chat-box">
                <div class="messages" id="chatMessages"></div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="Mensagem...">
                    <button id="enviarChat">ENVIAR</button>
                </div>
            </div>

            <div class="log-area" id="logPanel">
                <div>🔹 Sistema pronto</div>
            </div>
            <footer>Clique na peça → destino (contorno verde)</footer>
        </div>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    // ------------------- CONFIGURAÇÃO INICIAL -------------------
    const socket = io("https://motor-gamao.onrender.com");
    let estado = null;
    let meuLado = 0;       // 1 = vermelho, -1 = branco
    let jogoAtivo = false;
    let salaAtual = "";
    let movimentosPendentes = [];
    let pecaSelecionada = null;
    let dadosDisponiveis = [];   // valores dos dados ainda não usados (ex: [2,3] ou [1,1,1,1])

    // Elementos DOM
    const canvas = document.getElementById("boardCanvas");
    const ctx = canvas.getContext("2d");
    const w = 1050, h = 580;
    canvas.width = w; canvas.height = h;

    // ---------- GEOMETRIA PROFISSIONAL (medidas ajustadas) ----------
    const boardMarginX = 80;
    const boardMarginY = 55;
    const boardWidth = w - boardMarginX * 2;
    const halfBoard = boardWidth / 2;
    const pointWidth = (boardWidth / 2) / 6;   // largura de cada triângulo
    const pointHeight = 130;
    const topY = boardMarginY;
    const bottomY = h - boardMarginY;

    // Barra central elegante
    const barLeft = boardMarginX + halfBoard - 28;
    const barRight = barLeft + 56;
    const barTop = topY + pointHeight + 10;
    const barBottom = bottomY - pointHeight - 10;

    // ---------- FUNÇÕES AUXILIARES DE MOVIMENTO (lógica local) ----------
    function getDirection(lado) {
        return lado === 1 ? 1 : -1;   // vermelho horário, branco anti-horário
    }

    function isBlocked(point, lado) {
        if (point < 0 || point >= 24) return false;
        const qtd = estado.board[point];
        if (lado === 1) return qtd < -1;   // 2+ peças brancas bloqueiam vermelho
        else return qtd > 1;               // 2+ peças vermelhas bloqueiam branco
    }

    // Retorna destinos possíveis para uma peça em 'from' com um dado 'steps'
    function getDestinos(from, steps, lado) {
        const destinos = [];
        // barra
        if (from === 24) { // barra vermelha
            const dest = steps - 1;
            if (dest >= 0 && dest < 24 && !isBlocked(dest, lado)) destinos.push(dest);
            return destinos;
        }
        if (from === 25) { // barra branca
            const dest = 24 - steps;
            if (dest >= 0 && dest < 24 && !isBlocked(dest, lado)) destinos.push(dest);
            return destinos;
        }
        // movimento normal
        const dir = getDirection(lado);
        let dest = from + dir * steps;
        if (dest < 0 || dest >= 24) {
            // bear off (saída) – permite, o servidor valida
            destinos.push(dest);
        } else if (!isBlocked(dest, lado)) {
            destinos.push(dest);
        }
        return destinos;
    }

    // Gera todos os movimentos legais com base nos dados disponíveis
    function calcularMovimentosLocais() {
        if (!estado || estado.turn !== meuLado) return [];
        const lado = meuLado;
        const movimentos = [];
        // origens possíveis
        let origens = [];
        if (lado === 1 && estado.bar[0] > 0) origens.push(24);
        if (lado === -1 && estado.bar[1] > 0) origens.push(25);
        for (let i = 0; i < 24; i++) {
            const qtd = estado.board[i];
            if ((lado === 1 && qtd > 0) || (lado === -1 && qtd < 0)) origens.push(i);
        }
        for (let idxDado = 0; idxDado < dadosDisponiveis.length; idxDado++) {
            const steps = dadosDisponiveis[idxDado];
            for (let from of origens) {
                const destinos = getDestinos(from, steps, lado);
                for (let to of destinos) {
                    movimentos.push({ from, to, dadoIndex: idxDado });
                }
            }
        }
        return movimentos;
    }

    // Atualiza dadosDisponiveis com base nos dados e dados usados
    function atualizarDadosDisponiveis() {
        if (!estado) return;
        const d1 = estado.dice[0], d2 = estado.dice[1];
        const used = estado.diceUsed;
        if (d1 === d2) {
            // duplicata: 4 movimentos
            const valor = d1;
            let disponiveis = [];
            for (let i = 0; i < 4; i++) disponiveis.push(valor);
            if (used[0]) disponiveis.shift();
            if (used[1]) disponiveis.shift();
            // como used tem tamanho 2, mas na duplicata usamos 4, simplificamos: se usado[0] remove 1, se usado[1] remove outro
            dadosDisponiveis = disponiveis;
        } else {
            dadosDisponiveis = [];
            if (!used[0]) dadosDisponiveis.push(d1);
            if (!used[1]) dadosDisponiveis.push(d2);
        }
        addLog(`🎲 Dados disponíveis: ${JSON.stringify(dadosDisponiveis)}`, "#aaffaa");
    }

    // ---------- DESENHO DO TABULEIRO (profissional) ----------
    function desenharTriangulo(x, y, largura, altura, paraCima, corClara) {
        const grad = ctx.createLinearGradient(x, y, x, paraCima ? y - altura : y + altura);
        if (corClara) {
            grad.addColorStop(0, "#f2d6a8");
            grad.addColorStop(1, "#d6b07a");
        } else {
            grad.addColorStop(0, "#9a5e2e");
            grad.addColorStop(1, "#623a1a");
        }
        ctx.beginPath();
        if (paraCima) {
            ctx.moveTo(x, y);
            ctx.lineTo(x + largura / 2, y - altura);
            ctx.lineTo(x + largura, y);
        } else {
            ctx.moveTo(x, y);
            ctx.lineTo(x + largura / 2, y + altura);
            ctx.lineTo(x + largura, y);
        }
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = "#2c1a0a";
        ctx.lineWidth = 1.2;
        ctx.stroke();
    }

    function desenharPeca(x, y, cor) {
        ctx.save();
        ctx.shadowBlur = 6;
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 2;
        ctx.shadowColor = "rgba(0,0,0,0.4)";
        const grad = ctx.createRadialGradient(x - 4, y - 4, 4, x, y, 14);
        if (cor === "red") {
            grad.addColorStop(0, "#d84a3a");
            grad.addColorStop(1, "#8a2010");
        } else {
            grad.addColorStop(0, "#fff8e8");
            grad.addColorStop(1, "#d0b88a");
        }
        ctx.beginPath();
        ctx.arc(x, y, 13, 0, 2 * Math.PI);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = "#1a0e05";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        // brilho
        ctx.beginPath();
        ctx.arc(x - 3, y - 3, 3, 0, 2 * Math.PI);
        ctx.fillStyle = "rgba(255,255,240,0.7)";
        ctx.fill();
        ctx.restore();
    }

    function desenharTabuleiroCompleto() {
        if (!estado) return;
        ctx.clearRect(0, 0, w, h);
        // fundo da mesa (já tem gradiente no CSS, mas reforçamos)
        ctx.fillStyle = "#c9a87b";
        ctx.fillRect(0, 0, w, h);

        // desenhar triângulos
        for (let i = 0; i < 6; i++) {
            const x = boardMarginX + i * pointWidth;
            const claro = (i % 2 === 0);
            desenharTriangulo(x, topY, pointWidth, pointHeight, false, claro);
            desenharTriangulo(x, bottomY, pointWidth, pointHeight, true, !claro);
        }
        for (let i = 0; i < 6; i++) {
            const x = boardMarginX + halfBoard + i * pointWidth;
            const claro = (i % 2 === 0);
            desenharTriangulo(x, topY, pointWidth, pointHeight, false, claro);
            desenharTriangulo(x, bottomY, pointWidth, pointHeight, true, !claro);
        }

        // Barra central refinada
        ctx.fillStyle = "#a07040";
        ctx.fillRect(barLeft, barTop, barRight - barLeft, barBottom - barTop);
        ctx.fillStyle = "#dbb87a";
        for (let i = 0; i < 3; i++) {
            ctx.fillRect(barLeft + 12 + i * 14, barTop + 15, 6, (barBottom - barTop) - 30);
        }
        ctx.strokeStyle = "#3a2010";
        ctx.lineWidth = 2.5;
        ctx.strokeRect(barLeft, barTop, barRight - barLeft, barBottom - barTop);
        ctx.font = "bold 18px 'Georgia'";
        ctx.fillStyle = "#f8e0b0";
        ctx.shadowBlur = 0;
        ctx.fillText("⚫", barLeft + 24, barTop + (barBottom - barTop) / 2 + 6);
        ctx.font = "bold 12px 'Segoe UI'";
        ctx.fillText("BARRA", barLeft + 10, barTop + (barBottom - barTop) / 2 + 28);

        // Números das casas (1 a 12 em cima, 13 a 24 embaixo)
        ctx.font = "bold 14px 'Georgia'";
        ctx.fillStyle = "#2a1808";
        ctx.textAlign = "center";
        for (let i = 0; i < 6; i++) {
            const xEsq = boardMarginX + i * pointWidth + pointWidth / 2;
            ctx.fillText((6 - i).toString(), xEsq, topY - 8);
            ctx.fillText((13 + i).toString(), xEsq, bottomY + 24);
            const xDir = boardMarginX + halfBoard + i * pointWidth + pointWidth / 2;
            ctx.fillText((7 + i).toString(), xDir, topY - 8);
            ctx.fillText((19 + i).toString(), xDir, bottomY + 24);
        }
        ctx.textAlign = "left";

        // Atualizar contadores das casas na UI
        document.getElementById("homeVermelha").innerText = estado.home[0];
        document.getElementById("homeBranca").innerText = estado.home[1];

        // Desenhar peças
        for (let i = 0; i < 6; i++) {
            // superiores
            const idx1 = 5 - i;
            const q1 = estado.board[idx1];
            if (q1 !== 0) {
                const x = boardMarginX + i * pointWidth + pointWidth / 2;
                const yBase = topY + 20;
                const cor = q1 > 0 ? "red" : "white";
                const absQ = Math.abs(q1);
                for (let j = 0; j < Math.min(absQ, 6); j++) {
                    desenharPeca(x, yBase + j * 14, cor);
                }
                if (absQ > 6) ctx.fillText(`+${absQ - 6}`, x + 10, yBase + 80);
            }
            const idx2 = 11 - i;
            const q2 = estado.board[idx2];
            if (q2 !== 0) {
                const x = boardMarginX + halfBoard + i * pointWidth + pointWidth / 2;
                const yBase = topY + 20;
                const cor = q2 > 0 ? "red" : "white";
                const absQ = Math.abs(q2);
                for (let j = 0; j < Math.min(absQ, 6); j++) desenharPeca(x, yBase + j * 14, cor);
                if (absQ > 6) ctx.fillText(`+${absQ - 6}`, x + 10, yBase + 80);
            }
            // inferiores
            const idx3 = 12 + i;
            const q3 = estado.board[idx3];
            if (q3 !== 0) {
                const x = boardMarginX + i * pointWidth + pointWidth / 2;
                const yBase = bottomY - 28;
                const cor = q3 > 0 ? "red" : "white";
                const absQ = Math.abs(q3);
                for (let j = 0; j < Math.min(absQ, 6); j++) desenharPeca(x, yBase - j * 14, cor);
                if (absQ > 6) ctx.fillText(`+${absQ - 6}`, x + 10, yBase - 80);
            }
            const idx4 = 18 + i;
            const q4 = estado.board[idx4];
            if (q4 !== 0) {
                const x = boardMarginX + halfBoard + i * pointWidth + pointWidth / 2;
                const yBase = bottomY - 28;
                const cor = q4 > 0 ? "red" : "white";
                const absQ = Math.abs(q4);
                for (let j = 0; j < Math.min(absQ, 6); j++) desenharPeca(x, yBase - j * 14, cor);
                if (absQ > 6) ctx.fillText(`+${absQ - 6}`, x + 10, yBase - 80);
            }
        }

        // peças na barra
        if (estado.bar[0] > 0) {
            for (let j = 0; j < Math.min(estado.bar[0], 5); j++) desenharPeca(barLeft + 28, barTop + 25 + j * 18, "red");
            if (estado.bar[0] > 5) ctx.fillText(`+${estado.bar[0] - 5}`, barLeft + 45, barTop + 110);
        }
        if (estado.bar[1] > 0) {
            for (let j = 0; j < Math.min(estado.bar[1], 5); j++) desenharPeca(barLeft + 28, barBottom - 25 - j * 18, "white");
            if (estado.bar[1] > 5) ctx.fillText(`+${estado.bar[1] - 5}`, barLeft + 45, barBottom - 100);
        }

        // Destaque de peça selecionada
        if (pecaSelecionada !== null) {
            let cx, cy;
            const from = pecaSelecionada.from;
            if (from === 24) { cx = barLeft + 28; cy = barTop + 30; }
            else if (from === 25) { cx = barLeft + 28; cy = barBottom - 30; }
            else if (from < 12) {
                if (from <= 5) { const i = 5 - from; cx = boardMarginX + i * pointWidth + pointWidth / 2; cy = topY + 28; }
                else { const i = 11 - from; cx = boardMarginX + halfBoard + i * pointWidth + pointWidth / 2; cy = topY + 28; }
            } else {
                if (from <= 17) { const i = from - 12; cx = boardMarginX + i * pointWidth + pointWidth / 2; cy = bottomY - 36; }
                else { const i = from - 18; cx = boardMarginX + halfBoard + i * pointWidth + pointWidth / 2; cy = bottomY - 36; }
            }
            ctx.save();
            ctx.shadowBlur = 14;
            ctx.shadowColor = "#ffcc44";
            ctx.beginPath();
            ctx.arc(cx, cy, 18, 0, 2 * Math.PI);
            ctx.strokeStyle = "#ffcc44";
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.restore();
        }

        // Destinos possíveis (verdes) com base nos movimentos locais
        if (pecaSelecionada !== null) {
            const movimentos = calcularMovimentosLocais();
            const destinos = new Set(movimentos.filter(m => m.from === pecaSelecionada.from).map(m => m.to));
            destinos.forEach(to => {
                let cx, cy;
                if (to === 24) { cx = barLeft + 28; cy = barTop + 30; }
                else if (to === 25) { cx = barLeft + 28; cy = barBottom - 30; }
                else if (to < 12) {
                    if (to <= 5) { const i = 5 - to; cx = boardMarginX + i * pointWidth + pointWidth / 2; cy = topY + 28; }
                    else { const i = 11 - to; cx = boardMarginX + halfBoard + i * pointWidth + pointWidth / 2; cy = topY + 28; }
                } else {
                    if (to <= 17) { const i = to - 12; cx = boardMarginX + i * pointWidth + pointWidth / 2; cy = bottomY - 36; }
                    else { const i = to - 18; cx = boardMarginX + halfBoard + i * pointWidth + pointWidth / 2; cy = bottomY - 36; }
                }
                ctx.save();
                ctx.shadowBlur = 12;
                ctx.shadowColor = "#2ecc71";
                ctx.beginPath();
                ctx.arc(cx, cy, 20, 0, 2 * Math.PI);
                ctx.strokeStyle = "#2ecc71";
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.restore();
            });
        }
    }

    // ---------- CLIQUE NO TABULEIRO (com lógica local) ----------
    function getPointFromClick(px, py) {
        if (px >= barLeft && px <= barRight) {
            if (py >= barTop && py <= barTop + 70) return 24;
            if (py >= barBottom - 70 && py <= barBottom) return 25;
        }
        for (let i = 0; i < 6; i++) {
            const x0 = boardMarginX + i * pointWidth;
            const x1 = x0 + pointWidth;
            if (px >= x0 && px <= x1 && py >= topY && py <= topY + pointHeight) return 5 - i;
        }
        for (let i = 0; i < 6; i++) {
            const x0 = boardMarginX + halfBoard + i * pointWidth;
            const x1 = x0 + pointWidth;
            if (px >= x0 && px <= x1 && py >= topY && py <= topY + pointHeight) return 11 - i;
        }
        for (let i = 0; i < 6; i++) {
            const x0 = boardMarginX + i * pointWidth;
            const x1 = x0 + pointWidth;
            if (px >= x0 && px <= x1 && py >= bottomY - pointHeight && py <= bottomY) return 12 + i;
        }
        for (let i = 0; i < 6; i++) {
            const x0 = boardMarginX + halfBoard + i * pointWidth;
            const x1 = x0 + pointWidth;
            if (px >= x0 && px <= x1 && py >= bottomY - pointHeight && py <= bottomY) return 18 + i;
        }
        return -1;
    }

    canvas.addEventListener("click", (e) => {
        if (!jogoAtivo || meuLado === 0 || !estado) return;
        if (estado.turn !== meuLado) { addLog("⏳ Não é seu turno", "#ffaa88"); return; }
        if (estado.rollPhase) { addLog("🎲 Role os dados primeiro", "#ffaa88"); return; }

        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mouseX = (e.clientX - rect.left) * scaleX;
        const mouseY = (e.clientY - rect.top) * scaleY;
        const point = getPointFromClick(mouseX, mouseY);
        if (point === -1) return;

        let count;
        if (point === 24) count = estado.bar[0];
        else if (point === 25) count = estado.bar[1];
        else count = estado.board[point];
        const isMine = (meuLado === 1 && count > 0) || (meuLado === -1 && count < 0);

        if (pecaSelecionada === null) {
            if (isMine) {
                pecaSelecionada = { from: point };
                addLog(`🔍 Peça selecionada em ${point}`, "#aaffaa");
                desenharTabuleiroCompleto();
            } else {
                addLog("❌ Peça adversária ou vazia", "#ff8888");
            }
        } else {
            const from = pecaSelecionada.from;
            const to = point;
            const movimentos = calcularMovimentosLocais();
            const valido = movimentos.find(m => m.from === from && m.to === to);
            if (valido) {
                addLog(`✅ Movimento ${from} → ${to}`, "#aaffaa");
                movimentosPendentes.push({ from, to });
                // remove um dado disponível (o primeiro que corresponde ao steps)
                const steps = Math.abs(to - from);
                let idxRemover = -1;
                for (let i = 0; i < dadosDisponiveis.length; i++) {
                    if (dadosDisponiveis[i] === steps) { idxRemover = i; break; }
                }
                if (idxRemover !== -1) dadosDisponiveis.splice(idxRemover, 1);
                pecaSelecionada = null;
                desenharTabuleiroCompleto();
                atualizarInterface();
                if (dadosDisponiveis.length === 0 && movimentosPendentes.length > 0) {
                    addLog("⚡ Todos os dados usados, confirmando...", "#ffdd88");
                    confirmarJogada();
                }
            } else {
                addLog(`❌ Movimento inválido (${from}→${to})`, "#ff8888");
                pecaSelecionada = null;
                desenharTabuleiroCompleto();
            }
        }
    });

    function confirmarJogada() {
        if (movimentosPendentes.length === 0) return;
        socket.emit("moverPecas", { moves: movimentosPendentes });
        movimentosPendentes = [];
        pecaSelecionada = null;
    }

    function cancelarMovimentos() {
        movimentosPendentes = [];
        pecaSelecionada = null;
        atualizarDadosDisponiveis();
        desenharTabuleiroCompleto();
        atualizarInterface();
        addLog("🔄 Movimentos cancelados", "#ffdd88");
    }

    function rolarDados() {
        socket.emit("rolarDados");
        addLog("🎲 Solicitando rolagem...", "#ccccff");
    }

    function desistir() {
        if (confirm("Desistir da partida?")) socket.emit("desistir");
    }

    function atualizarInterface() {
        if (!estado) return;
        document.getElementById("turnoLabel").innerHTML = estado.turn === 1 ? "VERMELHO ↓" : "BRANCO ↑";
        const d1 = document.getElementById("dado1");
        const d2 = document.getElementById("dado2");
        d1.innerText = estado.dice[0] || "?";
        d2.innerText = estado.dice[1] || "?";
        d1.classList.toggle("used", estado.diceUsed[0]);
        d2.classList.toggle("used", estado.diceUsed[1]);

        const rolarBtn = document.getElementById("rolarBtn");
        const confirmarBtn = document.getElementById("confirmarBtn");
        const cancelarBtn = document.getElementById("cancelarBtn");
        const meuTurno = (estado.turn === meuLado);
        if (!jogoAtivo || !meuTurno || estado.gameOver) {
            rolarBtn.style.display = "none";
            confirmarBtn.style.display = "none";
            cancelarBtn.style.display = "none";
        } else if (estado.rollPhase) {
            rolarBtn.style.display = "inline-block";
            confirmarBtn.style.display = "none";
            cancelarBtn.style.display = "none";
        } else {
            rolarBtn.style.display = "none";
            confirmarBtn.style.display = movimentosPendentes.length ? "inline-block" : "none";
            cancelarBtn.style.display = movimentosPendentes.length ? "inline-block" : "none";
        }
        desenharTabuleiroCompleto();
    }

    function addLog(msg, cor = "#dddddd") {
        const logDiv = document.getElementById("logPanel");
        const p = document.createElement("div");
        p.style.color = cor;
        p.innerHTML = `🔹 ${new Date().toLocaleTimeString()} ${msg}`;
        logDiv.appendChild(p);
        p.scrollIntoView({ behavior: "smooth", block: "nearest" });
        while (logDiv.children.length > 60) logDiv.removeChild(logDiv.firstChild);
    }

    // ------------------- SOCKET EVENTOS -------------------
    function entrar() {
        const nome = document.getElementById("chatInput").value.trim() || "jogador";
        const sala = prompt("Nome da sala:", "mesa1");
        if (!sala) return;
        salaAtual = sala;
        socket.emit("entrarSala", { apelido: nome, sala });
        document.getElementById("tela-login")?.remove();
        addLog(`📡 Entrando na sala ${sala} como ${nome}`, "#88ffaa");
    }

    socket.on("connect", () => addLog("✅ Conectado ao servidor", "#88ffaa"));
    socket.on("disconnect", () => addLog("❌ Desconectado", "#ff8888"));
    socket.on("erro", (msg) => addLog(`⚠️ Erro: ${msg}`, "#ffaa88"));

    socket.on("definirPapel", (dados) => {
        if (dados.papel === "jogador") {
            meuLado = dados.lado;
            document.getElementById("meuLadoLabel").innerHTML = meuLado === 1 ? "VERMELHO" : "BRANCO";
            addLog(`🎭 Você é ${meuLado === 1 ? "Vermelho" : "Branco"}`, "#aaffaa");
        } else {
            meuLado = 0;
            document.getElementById("meuLadoLabel").innerHTML = "ESPECTADOR";
        }
    });

    socket.on("estadoLobby", (dados) => {
        if (dados.rodando) {
            jogoAtivo = true;
            addLog("🏁 Partida iniciada!", "#ffffaa");
        }
    });

    socket.on("iniciarPartida", (dados) => {
        jogoAtivo = true;
        estado = dados.estado;
        if (dados.lado !== "espectador") meuLado = dados.lado;
        atualizarDadosDisponiveis();
        atualizarInterface();
        addLog("🚀 Jogo iniciado", "#aaffaa");
    });

    socket.on("estadoAtual", (novoEstado) => {
        estado = novoEstado;
        atualizarDadosDisponiveis();
        atualizarInterface();
    });

    socket.on("dadosRolados", ({ dice, legalMoves }) => {
        estado.dice = dice;
        estado.diceUsed = [false, false];
        estado.rollPhase = false;
        atualizarDadosDisponiveis();
        addLog(`🎲 Dados: ${dice[0]} e ${dice[1]} | Você pode mover`, "#aaffaa");
        atualizarInterface();
    });

    socket.on("jogadaFeita", (dados) => {
        estado = dados.estado;
        movimentosPendentes = [];
        pecaSelecionada = null;
        atualizarDadosDisponiveis();
        atualizarInterface();
        addLog("♟️ Jogada confirmada", "#aaffaa");
        if (dados.historico) {
            const histDiv = document.getElementById("historico");
            if (histDiv) histDiv.innerHTML = dados.historico.map(l => `<div>${l}</div>`).join("");
        }
    });

    socket.on("fimDeJogo", (dados) => {
        alert(dados.mensagem);
        jogoAtivo = false;
        addLog(`🏆 ${dados.mensagem}`, "#ffff88");
    });

    socket.on("novaMensagem", (msg) => {
        const chatDiv = document.getElementById("chatMessages");
        const hora = new Date(msg.timestamp).toLocaleTimeString();
        chatDiv.innerHTML += `<div><strong>${msg.remetente}</strong> <span style="font-size:0.7rem;">${hora}</span>: ${msg.texto}</div>`;
        chatDiv.scrollTop = chatDiv.scrollHeight;
    });

    // UI buttons
    document.getElementById("rolarBtn").onclick = rolarDados;
    document.getElementById("desistirBtn").onclick = desistir;
    document.getElementById("confirmarBtn").onclick = confirmarJogada;
    document.getElementById("cancelarBtn").onclick = cancelarMovimentos;
    document.getElementById("enviarChat").onclick = () => {
        const input = document.getElementById("chatInput");
        const msg = input.value.trim();
        if (msg) socket.emit("enviarMensagem", msg);
        input.value = "";
    };
    document.getElementById("chatInput").addEventListener("keypress", (e) => {
        if (e.key === "Enter") document.getElementById("enviarChat").click();
    });

    // Simular login automático para teste (remova depois se quiser)
    setTimeout(() => {
        if (!salaAtual) entrar();
    }, 500);
</script>
</body>
</html>
