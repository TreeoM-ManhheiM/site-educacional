<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gamão Premium — Edição Obsessiva</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #1a2a1a;
            font-family: 'Georgia', 'Times New Roman', 'Segoe UI', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px;
        }

        /* Estrutura com moldura externa */
        .game-container {
            background: #2c3e2b;
            border-radius: 56px;
            padding: 28px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,255,255,0.1);
        }

        .board-wrapper {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }

        /* Canvas com moldura em relevo (sombra interna e externa) */
        .canvas-frame {
            background: #3a2a1a;
            border-radius: 36px;
            padding: 12px;
            box-shadow: inset 0 0 0 2px #5a4a2a, 0 10px 20px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            border-radius: 28px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.4), 0 5px 12px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: box-shadow 0.2s;
        }
        canvas:hover {
            box-shadow: inset 0 0 18px rgba(0,0,0,0.5), 0 8px 18px rgba(0,0,0,0.4);
        }

        /* Painel direito com abas (mesmo estilo refinado) */
        .info-panel {
            background: #1e2a1e;
            border-radius: 32px;
            width: 310px;
            color: #efe0c9;
            display: flex;
            flex-direction: column;
            gap: 16px;
            backdrop-filter: blur(2px);
            box-shadow: inset 0 0 0 1px rgba(255,255,200,0.1), 0 8px 20px rgba(0,0,0,0.4);
        }

        .panel-header {
            background: #2a3a2a;
            padding: 14px 18px;
            border-radius: 32px 32px 0 0;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            border-bottom: 2px solid #c9a87b;
        }

        .tab-buttons {
            display: flex;
            gap: 12px;
        }
        .tab-btn {
            background: none;
            border: none;
            color: #ddcca8;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 40px;
            transition: 0.1s;
        }
        .tab-btn.active {
            background: #7a5a3a;
            color: #f9e2b0;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
        }

        .tab-content {
            display: none;
            padding: 16px;
            flex-direction: column;
            gap: 16px;
        }
        .tab-content.active {
            display: flex;
        }

        .status-card {
            background: #0f1a0f;
            border-radius: 24px;
            padding: 12px;
            text-align: center;
            border-left: 6px solid #e0a82b;
        }
        .home-indicators {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-weight: bold;
        }
        .home-box {
            background: #2a3a2a;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 0.85rem;
        }
        .dice-area {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 12px 0;
        }
        .dice {
            width: 70px;
            height: 70px;
            background: #f8f0e0;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: #2c1a0c;
            box-shadow: 0 8px 0 #aa8a60;
            transition: 0.08s linear;
            transform-style: preserve-3d;
            position: relative;
        }
        /* animação com easing (cubic-bezier) */
        .dice.rolling {
            animation: diceRoll 0.35s cubic-bezier(0.25, 1.5, 0.5, 1);
        }
        @keyframes diceRoll {
            0% { transform: translateY(0) rotate(0deg); }
            30% { transform: translateY(-12px) rotate(15deg); }
            70% { transform: translateY(4px) rotate(-8deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
        .dice.used {
            opacity: 0.5;
            filter: grayscale(0.3);
            box-shadow: 0 2px 0 #aa8a60;
            transform: translateY(6px);
        }

        button {
            background: #7a5a3a;
            border: none;
            padding: 10px 18px;
            border-radius: 60px;
            font-weight: bold;
            color: #fef0da;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.08s linear;
            box-shadow: 0 3px 0 #4a2e1a;
            font-family: inherit;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #4a2e1a;
        }
        .primary-btn {
            background: #2b7a4b;
            box-shadow: 0 3px 0 #1a4a2a;
        }
        .danger-btn {
            background: #9a3a2a;
            box-shadow: 0 3px 0 #5a2010;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .chat-messages {
            background: #0a120a;
            border-radius: 20px;
            height: 160px;
            overflow-y: auto;
            padding: 8px;
            font-size: 0.75rem;
            font-family: monospace;
        }
        .chat-input-area {
            display: flex;
            gap: 8px;
        }
        .chat-input-area input {
            flex: 1;
            background: #1e2a1e;
            border: none;
            border-radius: 40px;
            padding: 8px 12px;
            color: #efe0c9;
            font-family: inherit;
            outline: none;
        }

        .log-area {
            background: #0a120a;
            border-radius: 20px;
            height: 140px;
            overflow-y: auto;
            padding: 8px;
            font-family: monospace;
            font-size: 0.7rem;
        }

        footer {
            font-size: 0.65rem;
            text-align: center;
            padding: 8px;
            color: #b8c8a0;
            border-top: 1px solid #3a4a3a;
        }

        @media (max-width: 900px) {
            .board-wrapper { flex-direction: column; align-items: center; }
            .info-panel { width: 100%; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="board-wrapper">
        <div class="canvas-frame">
            <canvas id="boardCanvas" width="1100" height="620"></canvas>
        </div>

        <div class="info-panel">
            <div class="panel-header">
                <span>🎲 GAMÃO</span>
                <div class="tab-buttons">
                    <button class="tab-btn active" data-tab="jogo">JOGO</button>
                    <button class="tab-btn" data-tab="chat">CHAT</button>
                    <button class="tab-btn" data-tab="logs">LOGS</button>
                </div>
            </div>

            <div id="tabJogo" class="tab-content active">
                <div class="status-card">
                    <div>⚫ SEU LADO: <strong id="meuLadoLabel">---</strong></div>
                    <div>🔄 TURNO: <strong id="turnoLabel">---</strong></div>
                    <div class="home-indicators">
                        <span class="home-box">🏠 VERMELHA: <span id="homeVermelha">0</span></span>
                        <span class="home-box">⚪ BRANCA: <span id="homeBranca">0</span></span>
                    </div>
                </div>
                <div class="dice-area">
                    <div class="dice" id="dado1">⚀</div>
                    <div class="dice" id="dado2">⚀</div>
                </div>
                <div class="action-buttons">
                    <button id="rolarBtn" class="primary-btn">🎲 ROLAR</button>
                    <button id="desistirBtn" class="danger-btn">🏳️ DESISTIR</button>
                </div>
                <div class="action-buttons" style="margin-top: 5px;">
                    <button id="confirmarBtn" style="background:#3a7a5a; display: none;">✅ CONFIRMAR</button>
                    <button id="cancelarBtn" style="background:#7a5a3a; display: none;">↩️ CANCELAR</button>
                </div>
                <footer>Clique na peça → destino (verde)</footer>
            </div>

            <div id="tabChat" class="tab-content">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Mensagem...">
                    <button id="enviarChat">ENVIAR</button>
                </div>
            </div>

            <div id="tabLogs" class="tab-content">
                <div class="log-area" id="logPanel">
                    <div>🔹 Sistema pronto</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    // ------------------- CONEXÃO SOCKET -------------------
    const socket = io("https://motor-gamao.onrender.com");
    let estado = null;
    let meuLado = 0;       // 1 = vermelho, -1 = branco
    let jogoAtivo = false;
    let salaAtual = "";
    let movimentosPendentes = [];
    let pecaSelecionada = null;
    let dadosDisponiveis = [];

    // Elementos DOM
    const canvas = document.getElementById("boardCanvas");
    const ctx = canvas.getContext("2d");
    const w = 1100, h = 620;
    canvas.width = w; canvas.height = h;

    // ---------- GEOMETRIA DO TABULEIRO (proporções clássicas) ----------
    const boardMarginX = 85;
    const boardMarginY = 55;
    const boardWidth = w - boardMarginX * 2;
    const halfBoard = boardWidth / 2;
    const pointWidth = (boardWidth / 2) / 6;
    const pointHeight = 135;
    const topY = boardMarginY;
    const bottomY = h - boardMarginY;
    const barLeft = boardMarginX + halfBoard - 30;
    const barRight = barLeft + 60;
    const barTop = topY + pointHeight + 12;
    const barBottom = bottomY - pointHeight - 12;

    // ---------- LÓGICA LOCAL DE MOVIMENTOS (regras oficiais) ----------
    function getDirection(lado) {
        return lado === 1 ? 1 : -1;
    }
    function isBlocked(point, lado) {
        if (point < 0 || point >= 24) return false;
        const qtd = estado.board[point];
        if (lado === 1) return qtd < -1;
        else return qtd > 1;
    }
    function getDestinos(from, steps, lado) {
        const destinos = [];
        if (from === 24) {
            const dest = steps - 1;
            if (dest >= 0 && dest < 24 && !isBlocked(dest, lado)) destinos.push(dest);
            return destinos;
        }
        if (from === 25) {
            const dest = 24 - steps;
            if (dest >= 0 && dest < 24 && !isBlocked(dest, lado)) destinos.push(dest);
            return destinos;
        }
        const dir = getDirection(lado);
        let dest = from + dir * steps;
        if (dest < 0 || dest >= 24) {
            destinos.push(dest); // bear off
        } else if (!isBlocked(dest, lado)) {
            destinos.push(dest);
        }
        return destinos;
    }
    function calcularMovimentosLocais() {
        if (!estado || estado.turn !== meuLado) return [];
        const lado = meuLado;
        let origens = [];
        if (lado === 1 && estado.bar[0] > 0) origens.push(24);
        if (lado === -1 && estado.bar[1] > 0) origens.push(25);
        for (let i = 0; i < 24; i++) {
            const qtd = estado.board[i];
            if ((lado === 1 && qtd > 0) || (lado === -1 && qtd < 0)) origens.push(i);
        }
        const movimentos = [];
        for (let idx = 0; idx < dadosDisponiveis.length; idx++) {
            const steps = dadosDisponiveis[idx];
            for (let from of origens) {
                for (let to of getDestinos(from, steps, lado)) {
                    movimentos.push({ from, to, dadoIdx: idx });
                }
            }
        }
        return movimentos;
    }
    function atualizarDadosDisponiveis() {
        if (!estado) return;
        const d1 = estado.dice[0], d2 = estado.dice[1];
        const used = estado.diceUsed;
        if (d1 === d2) {
            let arr = [d1, d1, d1, d1];
            if (used[0]) arr.shift();
            if (used[1]) arr.shift();
            dadosDisponiveis = arr;
        } else {
            dadosDisponiveis = [];
            if (!used[0]) dadosDisponiveis.push(d1);
            if (!used[1]) dadosDisponiveis.push(d2);
        }
    }

    // ---------- DESENHO PREMIUM COM PROFUNDIDADE ----------
    // Função para desenhar dados com pontos (em vez de números) e leve perspectiva
    function desenharDadoCustom(x, y, valor, lado, ctxTemp) {
        // Não usamos aqui; os dados são desenhados no HTML/CSS, mas para efeito de rolagem
        // mantemos a animação CSS. Para a aparência "pontos", substituímos o texto por pontos.
        // Como a interface HTML já usa texto, vamos converter dinamicamente.
        const dadoDiv = document.getElementById(lado === 1 ? "dado1" : "dado2");
        if (dadoDiv) {
            const pontosMap = {
                1: "●", 2: "●●", 3: "●●●", 4: "●●●●", 5: "●●●●●", 6: "●●●●●●"
            };
            dadoDiv.innerText = pontosMap[valor] || "?";
            dadoDiv.style.fontSize = "1.8rem";
            dadoDiv.style.letterSpacing = "2px";
        }
    }

    function desenharTriangulo(x, y, largura, altura, paraCima, corClara) {
        const grad = ctx.createLinearGradient(x, y, x, paraCima ? y - altura : y + altura);
        if (corClara) {
            grad.addColorStop(0, "#e7cba5");
            grad.addColorStop(1, "#c8a06e");
        } else {
            grad.addColorStop(0, "#8b5a2e");
            grad.addColorStop(1, "#5a3820");
        }
        ctx.beginPath();
        if (paraCima) {
            ctx.moveTo(x, y);
            ctx.lineTo(x + largura / 2, y - altura);
            ctx.lineTo(x + largura, y);
        } else {
            ctx.moveTo(x, y);
            ctx.lineTo(x + largura / 2, y + altura);
            ctx.lineTo(x + largura, y);
        }
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = "#2a1a0a";
        ctx.lineWidth = 1.2;
        ctx.stroke();
        // sombra interna sutil
        ctx.save();
        ctx.globalAlpha = 0.1;
        ctx.fillStyle = "#fff8e0";
        ctx.fill();
        ctx.restore();
    }

    function desenharPeca(x, y, cor, camada = 0) {
        ctx.save();
        // sombra mais suave para camadas superiores
        const sombraIntensidade = 5 - camada * 0.8;
        ctx.shadowBlur = Math.max(3, sombraIntensidade);
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 2;
        ctx.shadowColor = "rgba(0,0,0,0.5)";
        const grad = ctx.createRadialGradient(x - 4, y - 4, 5, x, y, 14);
        if (cor === "red") {
            grad.addColorStop(0, "#e06050");
            grad.addColorStop(1, "#962818");
        } else {
            grad.addColorStop(0, "#fff5e8");
            grad.addColorStop(1, "#d4bc92");
        }
        ctx.beginPath();
        ctx.arc(x, y, 13, 0, 2 * Math.PI);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = "#1a0e05";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        // brilho especular
        ctx.beginPath();
        ctx.arc(x - 3, y - 3, 3, 0, 2 * Math.PI);
        ctx.fillStyle = "rgba(255,250,210,0.8)";
        ctx.fill();
        ctx.restore();
    }

    function desenharTabuleiro() {
        if (!estado) return;
        ctx.clearRect(0, 0, w, h);
        // fundo principal (madeira escura)
        ctx.fillStyle = "#a87b51";
        ctx.fillRect(0, 0, w, h);
        // textura de madeira (linhas suaves)
        ctx.save();
        ctx.globalAlpha = 0.2;
        for (let i = 0; i < 200; i++) {
            ctx.beginPath();
            ctx.moveTo(0, i * 5);
            ctx.lineTo(w, i * 5 + (i % 3));
            ctx.strokeStyle = "#3a2510";
            ctx.stroke();
        }
        ctx.restore();

        // triângulos
        for (let i = 0; i < 6; i++) {
            const x = boardMarginX + i * pointWidth;
            const claro = (i % 2 === 0);
            desenharTriangulo(x, topY, pointWidth, pointHeight, false, claro);
            desenharTriangulo(x, bottomY, pointWidth, pointHeight, true, !claro);
        }
        for (let i = 0; i < 6; i++) {
            const x = boardMarginX + halfBoard + i * pointWidth;
            const claro = (i % 2 === 0);
            desenharTriangulo(x, topY, pointWidth, pointHeight, false, claro);
            desenharTriangulo(x, bottomY, pointWidth, pointHeight, true, !claro);
        }

        // Barra central (madeira trabalhada)
        ctx.fillStyle = "#b87c48";
        ctx.fillRect(barLeft, barTop, barRight - barLeft, barBottom - barTop);
        ctx.fillStyle = "#e0bc88";
        for (let i = 0; i < 3; i++) {
            ctx.fillRect(barLeft + 12 + i * 14, barTop + 15, 6, (barBottom - barTop) - 30);
        }
        ctx.strokeStyle = "#4a2a10";
        ctx.lineWidth = 2.5;
        ctx.strokeRect(barLeft, barTop, barRight - barLeft, barBottom - barTop);
        ctx.font = "bold 20px 'Georgia'";
        ctx.fillStyle = "#fae0b0";
        ctx.fillText("⚫", barLeft + 26, barTop + (barBottom - barTop) / 2 + 8);
        ctx.font = "bold 12px 'Segoe UI'";
        ctx.fillText("BARRA", barLeft + 12, barTop + (barBottom - barTop) / 2 + 30);

        // Números das casas
        ctx.font = "bold 14px 'Georgia'";
        ctx.fillStyle = "#2c1a08";
        ctx.textAlign = "center";
        for (let i = 0; i < 6; i++) {
            const xEsq = boardMarginX + i * pointWidth + pointWidth / 2;
            ctx.fillText((6 - i).toString(), xEsq, topY - 10);
            ctx.fillText((13 + i).toString(), xEsq, bottomY + 26);
            const xDir = boardMarginX + halfBoard + i * pointWidth + pointWidth / 2;
            ctx.fillText((7 + i).toString(), xDir, topY - 10);
            ctx.fillText((19 + i).toString(), xDir, bottomY + 26);
        }
        ctx.textAlign = "left";

        // Atualizar contadores UI
        document.getElementById("homeVermelha").innerText = estado.home[0];
        document.getElementById("homeBranca").innerText = estado.home[1];

        // Desenhar peças com sombras entre camadas (step reduzido)
        function desenharPilha(x, yBase, qtd, cor, direcao) {
            const absQ = Math.abs(qtd);
            const maxVis = 6;
            const step = 12; // reduzido para melhor empilhamento
            for (let j = 0; j < Math.min(absQ, maxVis); j++) {
                const y = direcao === 'down' ? yBase + j * step : yBase - j * step;
                desenharPeca(x, y, cor, j);
            }
            if (absQ > maxVis) {
                ctx.fillStyle = "#111";
                ctx.font = "bold 10px monospace";
                ctx.fillText(`+${absQ - maxVis}`, x + 12, direcao === 'down' ? yBase + (maxVis-1)*step + 12 : yBase - (maxVis-1)*step - 8);
            }
        }

        for (let i = 0; i < 6; i++) {
            const idx1 = 5 - i;
            const q1 = estado.board[idx1];
            if (q1 !== 0) {
                const x = boardMarginX + i * pointWidth + pointWidth / 2;
                const yBase = topY + 22;
                desenharPilha(x, yBase, q1, q1 > 0 ? "red" : "white", "down");
            }
            const idx2 = 11 - i;
            const q2 = estado.board[idx2];
            if (q2 !== 0) {
                const x = boardMarginX + halfBoard + i * pointWidth + pointWidth / 2;
                const yBase = topY + 22;
                desenharPilha(x, yBase, q2, q2 > 0 ? "red" : "white", "down");
            }
            const idx3 = 12 + i;
            const q3 = estado.board[idx3];
            if (q3 !== 0) {
                const x = boardMarginX + i * pointWidth + pointWidth / 2;
                const yBase = bottomY - 30;
                desenharPilha(x, yBase, q3, q3 > 0 ? "red" : "white", "up");
            }
            const idx4 = 18 + i;
            const q4 = estado.board[idx4];
            if (q4 !== 0) {
                const x = boardMarginX + halfBoard + i * pointWidth + pointWidth / 2;
                const yBase = bottomY - 30;
                desenharPilha(x, yBase, q4, q4 > 0 ? "red" : "white", "up");
            }
        }

        // peças na barra
        if (estado.bar[0] > 0) {
            for (let j = 0; j < Math.min(estado.bar[0], 6); j++) {
                desenharPeca(barLeft + 30, barTop + 22 + j * 14, "red", j);
            }
            if (estado.bar[0] > 6) ctx.fillText(`+${estado.bar[0] - 6}`, barLeft + 48, barTop + 120);
        }
        if (estado.bar[1] > 0) {
            for (let j = 0; j < Math.min(estado.bar[1], 6); j++) {
                desenharPeca(barLeft + 30, barBottom - 22 - j * 14, "white", j);
            }
            if (estado.bar[1] > 6) ctx.fillText(`+${estado.bar[1] - 6}`, barLeft + 48, barBottom - 110);
        }

        // Destaque da peça selecionada
        if (pecaSelecionada !== null) {
            let cx, cy;
            const from = pecaSelecionada.from;
            if (from === 24) { cx = barLeft + 30; cy = barTop + 30; }
            else if (from === 25) { cx = barLeft + 30; cy = barBottom - 30; }
            else if (from < 12) {
                if (from <= 5) { const i = 5 - from; cx = boardMarginX + i * pointWidth + pointWidth / 2; cy = topY + 30; }
                else { const i = 11 - from; cx = boardMarginX + halfBoard + i * pointWidth + pointWidth / 2; cy = topY + 30; }
            } else {
                if (from <= 17) { const i = from - 12; cx = boardMarginX + i * pointWidth + pointWidth / 2; cy = bottomY - 38; }
                else { const i = from - 18; cx = boardMarginX + halfBoard + i * pointWidth + pointWidth / 2; cy = bottomY - 38; }
            }
            ctx.save();
            ctx.shadowBlur = 14;
            ctx.shadowColor = "#ffcc66";
            ctx.beginPath();
            ctx.arc(cx, cy, 18, 0, 2 * Math.PI);
            ctx.strokeStyle = "#ffcc66";
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.restore();
        }

        // Destinos verdes
        if (pecaSelecionada !== null) {
            const movimentos = calcularMovimentosLocais();
            const destinos = new Set(movimentos.filter(m => m.from === pecaSelecionada.from).map(m => m.to));
            destinos.forEach(to => {
                let cx, cy;
                if (to === 24) { cx = barLeft + 30; cy = barTop + 30; }
                else if (to === 25) { cx = barLeft + 30; cy = barBottom - 30; }
                else if (to < 12) {
                    if (to <= 5) { const i = 5 - to; cx = boardMarginX + i * pointWidth + pointWidth / 2; cy = topY + 30; }
                    else { const i = 11 - to; cx = boardMarginX + halfBoard + i * pointWidth + pointWidth / 2; cy = topY + 30; }
                } else {
                    if (to <= 17) { const i = to - 12; cx = boardMarginX + i * pointWidth + pointWidth / 2; cy = bottomY - 38; }
                    else { const i = to - 18; cx = boardMarginX + halfBoard + i * pointWidth + pointWidth / 2; cy = bottomY - 38; }
                }
                ctx.save();
                ctx.shadowBlur = 12;
                ctx.shadowColor = "#2ecc71";
                ctx.beginPath();
                ctx.arc(cx, cy, 20, 0, 2 * Math.PI);
                ctx.strokeStyle = "#2ecc71";
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.restore();
            });
        }
    }

    // ---------- CLIQUE NO TABULEIRO ----------
    function getPointFromClick(px, py) {
        if (px >= barLeft && px <= barRight) {
            if (py >= barTop && py <= barTop + 70) return 24;
            if (py >= barBottom - 70 && py <= barBottom) return 25;
        }
        for (let i = 0; i < 6; i++) {
            const x0 = boardMarginX + i * pointWidth;
            const x1 = x0 + pointWidth;
            if (px >= x0 && px <= x1 && py >= topY && py <= topY + pointHeight) return 5 - i;
        }
        for (let i = 0; i < 6; i++) {
            const x0 = boardMarginX + halfBoard + i * pointWidth;
            const x1 = x0 + pointWidth;
            if (px >= x0 && px <= x1 && py >= topY && py <= topY + pointHeight) return 11 - i;
        }
        for (let i = 0; i < 6; i++) {
            const x0 = boardMarginX + i * pointWidth;
            const x1 = x0 + pointWidth;
            if (px >= x0 && px <= x1 && py >= bottomY - pointHeight && py <= bottomY) return 12 + i;
        }
        for (let i = 0; i < 6; i++) {
            const x0 = boardMarginX + halfBoard + i * pointWidth;
            const x1 = x0 + pointWidth;
            if (px >= x0 && px <= x1 && py >= bottomY - pointHeight && py <= bottomY) return 18 + i;
        }
        return -1;
    }

    canvas.addEventListener("click", (e) => {
        if (!jogoAtivo || meuLado === 0 || !estado) return;
        if (estado.turn !== meuLado) { addLog("⏳ Aguarde seu turno", "#ffaa88"); return; }
        if (estado.rollPhase) { addLog("🎲 Role os dados primeiro", "#ffaa88"); return; }

        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mx = (e.clientX - rect.left) * scaleX;
        const my = (e.clientY - rect.top) * scaleY;
        const point = getPointFromClick(mx, my);
        if (point === -1) return;

        let count;
        if (point === 24) count = estado.bar[0];
        else if (point === 25) count = estado.bar[1];
        else count = estado.board[point];
        const isMine = (meuLado === 1 && count > 0) || (meuLado === -1 && count < 0);

        if (pecaSelecionada === null) {
            if (isMine) {
                pecaSelecionada = { from: point };
                addLog(`🔍 Peça selecionada em ${point}`, "#aaffaa");
                desenharTabuleiro();
            } else {
                addLog("❌ Peça adversária ou vazia", "#ff8888");
            }
        } else {
            const from = pecaSelecionada.from;
            const to = point;
            const movimentos = calcularMovimentosLocais();
            const valido = movimentos.find(m => m.from === from && m.to === to);
            if (valido) {
                addLog(`✅ Movimento ${from} → ${to}`, "#aaffaa");
                movimentosPendentes.push({ from, to });
                const steps = Math.abs(to - from);
                let idx = dadosDisponiveis.findIndex(v => v === steps);
                if (idx !== -1) dadosDisponiveis.splice(idx, 1);
                pecaSelecionada = null;
                desenharTabuleiro();
                atualizarInterface();
                if (dadosDisponiveis.length === 0 && movimentosPendentes.length > 0) {
                    addLog("⚡ Todos os dados usados, confirmando...", "#ffdd88");
                    confirmarJogada();
                }
            } else {
                addLog(`❌ Movimento inválido (${from}→${to})`, "#ff8888");
                pecaSelecionada = null;
                desenharTabuleiro();
            }
        }
    });

    function confirmarJogada() {
        if (movimentosPendentes.length === 0) return;
        socket.emit("moverPecas", { moves: movimentosPendentes });
        movimentosPendentes = [];
        pecaSelecionada = null;
    }
    function cancelarMovimentos() {
        movimentosPendentes = [];
        pecaSelecionada = null;
        atualizarDadosDisponiveis();
        desenharTabuleiro();
        atualizarInterface();
        addLog("🔄 Movimentos cancelados", "#ffdd88");
    }
    function rolarDados() {
        socket.emit("rolarDados");
        addLog("🎲 Rolando dados...", "#ccccff");
        const dado1 = document.getElementById("dado1");
        const dado2 = document.getElementById("dado2");
        dado1.classList.add("rolling");
        dado2.classList.add("rolling");
        // atualiza para pontos visuais durante a animação (opcional)
        setTimeout(() => {
            dado1.classList.remove("rolling");
            dado2.classList.remove("rolling");
        }, 400);
    }
    function desistir() {
        if (confirm("Desistir da partida?")) socket.emit("desistir");
    }

    function atualizarInterface() {
        if (!estado) return;
        document.getElementById("turnoLabel").innerHTML = estado.turn === 1 ? "VERMELHO ↓" : "BRANCO ↑";
        const d1 = document.getElementById("dado1");
        const d2 = document.getElementById("dado2");
        // converter valores para pontos
        const pontosMap = {1:"●",2:"●●",3:"●●●",4:"●●●●",5:"●●●●●",6:"●●●●●●"};
        d1.innerText = pontosMap[estado.dice[0]] || "?";
        d2.innerText = pontosMap[estado.dice[1]] || "?";
        d1.style.fontSize = "1.8rem";
        d2.style.fontSize = "1.8rem";
        d1.classList.toggle("used", estado.diceUsed[0]);
        d2.classList.toggle("used", estado.diceUsed[1]);

        const rolar = document.getElementById("rolarBtn");
        const confirmar = document.getElementById("confirmarBtn");
        const cancelar = document.getElementById("cancelarBtn");
        const meuTurno = (estado.turn === meuLado);
        if (!jogoAtivo || !meuTurno || estado.gameOver) {
            rolar.style.display = "none";
            confirmar.style.display = "none";
            cancelar.style.display = "none";
        } else if (estado.rollPhase) {
            rolar.style.display = "inline-block";
            confirmar.style.display = "none";
            cancelar.style.display = "none";
        } else {
            rolar.style.display = "none";
            confirmar.style.display = movimentosPendentes.length ? "inline-block" : "none";
            cancelar.style.display = movimentosPendentes.length ? "inline-block" : "none";
        }
        desenharTabuleiro();
    }

    function addLog(msg, cor = "#dddddd") {
        const logDiv = document.getElementById("logPanel");
        const p = document.createElement("div");
        p.style.color = cor;
        p.innerHTML = `🔹 ${new Date().toLocaleTimeString()} ${msg}`;
        logDiv.appendChild(p);
        p.scrollIntoView({ behavior: "smooth", block: "nearest" });
        while (logDiv.children.length > 60) logDiv.removeChild(logDiv.firstChild);
    }

    // ---------- SOCKET EVENTOS ----------
    function entrar() {
        const nome = prompt("Seu nome:", "jogador") || "anon";
        const sala = prompt("Sala:", "gamão") || "gamão";
        salaAtual = sala;
        socket.emit("entrarSala", { apelido: nome, sala });
        addLog(`📡 Entrando na sala ${sala} como ${nome}`, "#88ffaa");
    }

    socket.on("connect", () => addLog("✅ Conectado ao servidor", "#88ffaa"));
    socket.on("disconnect", () => addLog("❌ Desconectado", "#ff8888"));
    socket.on("erro", (msg) => addLog(`⚠️ ${msg}`, "#ffaa88"));
    socket.on("definirPapel", (dados) => {
        if (dados.papel === "jogador") {
            meuLado = dados.lado;
            document.getElementById("meuLadoLabel").innerHTML = meuLado === 1 ? "VERMELHO" : "BRANCO";
            addLog(`🎭 Você é ${meuLado === 1 ? "Vermelho" : "Branco"}`, "#aaffaa");
        } else {
            meuLado = 0;
            document.getElementById("meuLadoLabel").innerHTML = "ESPECTADOR";
        }
    });
    socket.on("estadoLobby", (dados) => {
        if (dados.rodando) {
            jogoAtivo = true;
            addLog("🏁 Partida iniciada!", "#ffffaa");
        }
    });
    socket.on("iniciarPartida", (dados) => {
        jogoAtivo = true;
        estado = dados.estado;
        if (dados.lado !== "espectador") meuLado = dados.lado;
        atualizarDadosDisponiveis();
        atualizarInterface();
        addLog("🚀 Jogo iniciado", "#aaffaa");
    });
    socket.on("estadoAtual", (novo) => {
        estado = novo;
        atualizarDadosDisponiveis();
        atualizarInterface();
    });
    socket.on("dadosRolados", ({ dice }) => {
        estado.dice = dice;
        estado.diceUsed = [false, false];
        estado.rollPhase = false;
        atualizarDadosDisponiveis();
        addLog(`🎲 Dados: ${dice[0]} e ${dice[1]}`, "#aaffaa");
        atualizarInterface();
    });
    socket.on("jogadaFeita", (dados) => {
        estado = dados.estado;
        movimentosPendentes = [];
        pecaSelecionada = null;
        atualizarDadosDisponiveis();
        atualizarInterface();
        addLog("♟️ Jogada confirmada", "#aaffaa");
    });
    socket.on("fimDeJogo", (dados) => {
        alert(dados.mensagem);
        jogoAtivo = false;
        addLog(`🏆 ${dados.mensagem}`, "#ffff88");
    });
    socket.on("novaMensagem", (msg) => {
        const chatDiv = document.getElementById("chatMessages");
        const hora = new Date(msg.timestamp).toLocaleTimeString();
        chatDiv.innerHTML += `<div><strong>${msg.remetente}</strong> <span style="font-size:0.7rem;">${hora}</span>: ${msg.texto}</div>`;
        chatDiv.scrollTop = chatDiv.scrollHeight;
    });

    // UI buttons e abas
    document.getElementById("rolarBtn").onclick = rolarDados;
    document.getElementById("desistirBtn").onclick = desistir;
    document.getElementById("confirmarBtn").onclick = confirmarJogada;
    document.getElementById("cancelarBtn").onclick = cancelarMovimentos;
    document.getElementById("enviarChat").onclick = () => {
        const input = document.getElementById("chatInput");
        const msg = input.value.trim();
        if (msg) socket.emit("enviarMensagem", msg);
        input.value = "";
    };
    document.getElementById("chatInput").addEventListener("keypress", (e) => {
        if (e.key === "Enter") document.getElementById("enviarChat").click();
    });
    document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            const tab = btn.dataset.tab;
            document.querySelectorAll(".tab-content").forEach(tc => tc.classList.remove("active"));
            document.getElementById(`tab${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.add("active");
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
        });
    });

    setTimeout(() => { if (!salaAtual) entrar(); }, 300);
</script>
