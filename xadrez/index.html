<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Xadrez Lógico ♟️ — Laboratório de Computação</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6f8;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #1e293b, #334155);
            color: white;
            padding: 20px;
            text-align: center;
        }
        header h1 { margin: 0; font-size: 28px; }
        header p { font-size: 14px; margin-top: 5px; opacity: 0.9; }
        .btn-header-regras {
            display: inline-block;
            margin-top: 10px;
            background: rgba(255,255,255,0.15);
            color: white;
            padding: 6px 16px;
            text-decoration: none;
            border-radius: 20px;
            font-size: 13px;
            border: 1px solid rgba(255,255,255,0.3);
        }
        main {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            flex: 1;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .coluna-esquerda {
            flex: 2;
            min-width: 300px;
        }
        .coluna-direita {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .game-container, .painel-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }
        #status-conexao { color: #64748b; font-size: 13px; margin-bottom: 10px; }
        .painel-info {
            background: #e5edff;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 15px;
            border: 1px solid #c7d2fe;
            color: #1e3a8a;
            font-weight: bold;
        }
        .destaque { color: #2563eb; }
        .alerta-xeque { color: #ef4444; font-weight: bold; animation: piscar 1s infinite; }
        @keyframes piscar { 50% { opacity: 0.5; } }
        button {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            background: #e2e8f0;
            color: #1e293b;
        }
        button.primary { background: #3b82f6; color: white; }
        button.success { background: #10b981; color: white; }
        button.warning { background: #f59e0b; color: white; }
        button.danger { background: #ef4444; color: white; }
        input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            margin: 5px 0;
            width: 100%;
        }
        /* 🔧 CORREÇÃO MOBILE: impede rolagem ao arrastar peças */
        #meu-tabuleiro {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            touch-action: none;
        }
        .relogio-container {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
        }
        .relogio {
            background: #1e293b;
            color: #facc15;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 1.2em;
        }
        .historico-lista {
            max-height: 200px;
            overflow-y: auto;
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }
        .chat-mensagens {
            height: 200px;
            overflow-y: auto;
            background: #f1f5f9;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .chat-input {
            display: flex;
            gap: 5px;
        }
        .chat-input input {
            flex: 1;
        }
        .badge {
            background: #cbd5e1;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }
        .flex-row { display: flex; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>
<header>
    <h1>Xadrez Lógico ♟️</h1>
    <p>Projeto Integrado — Laboratório de Computação</p>
    <a href="regras.html" target="_blank" class="btn-header-regras">📖 VER REGRAS DO JOGO</a>
</header>
<main>
    <div class="coluna-esquerda">
        <div id="status-conexao">Conectando...</div>

        <div id="tela-login" class="game-container">
            <h2>Entrar na Partida</h2>
            <input type="text" id="input-apelido" placeholder="Seu Nome">
            <input type="text" id="input-sala" placeholder="Sala (ex: mesa1)">
            <br><br>
            <button onclick="entrar()" class="success">CONECTAR</button>
        </div>

        <div id="lobby" class="game-container" style="display:none;">
            <h3>🕹️ Lobby</h3>
            <div id="info-sala"></div>
            <ul id="lista-alunos" style="padding:0;"></ul>
            <button id="btn-pronto" onclick="marcarPronto()" class="primary" style="width:100%;">ESTOU PRONTO</button>
        </div>

        <div id="area-jogo" style="display:none;">
            <div class="painel-info">
                <div>Sua Cor: <span id="minha-cor" class="destaque">---</span></div>
                <div>Turno: <span id="vez-atual" class="destaque">Brancas</span></div>
                <div id="status-jogo" class="destaque">Partida em andamento</div>
            </div>
            <div class="relogio-container">
                <div class="relogio" id="relogio-brancas">⚪ 10:00</div>
                <div class="relogio" id="relogio-pretas">⚫ 10:00</div>
            </div>
            <div id="meu-tabuleiro"></div>
            <div class="flex-row" style="margin-top:15px;">
                <button onclick="desistir()" class="danger">🏳️ Desistir</button>
                <button onclick="oferecerEmpate()" class="warning">🤝 Oferecer Empate</button>
            </div>
        </div>
    </div>

    <div class="coluna-direita">
        <div id="painel-historico" class="painel-container" style="display:none;">
            <h3>📜 Histórico</h3>
            <div id="historico" class="historico-lista"></div>
        </div>
        <div id="painel-chat" class="painel-container" style="display:none;">
            <h3>💬 Chat da Sala</h3>
            <div id="chat-mensagens" class="chat-mensagens"></div>
            <div class="chat-input">
                <input type="text" id="input-mensagem" placeholder="Digite sua mensagem...">
                <button onclick="enviarMensagem()">Enviar</button>
            </div>
        </div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
    const socket = io("https://motor-xadrez.onrender.com");

    let motorXadrez = new Chess();
    let tabuleiroVisual = null;
    let minhaCor = 'w';
    let meuPapel = 'espectador';
    let jogoIniciado = false;
    let salaAtual = '';
    let meuSocketId = '';

    function formatarTempo(segundos) {
        if (segundos === undefined || segundos === null) return '--:--';
        const mins = Math.floor(segundos / 60);
        const secs = segundos % 60;
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function entrar() {
        const apelido = document.getElementById('input-apelido').value.trim();
        const sala = document.getElementById('input-sala').value.trim();
        if (!apelido || !sala) return alert('Preencha nome e sala!');
        salaAtual = sala;
        socket.emit('entrarSala', { apelido, sala });
        document.getElementById('tela-login').style.display = 'none';
        document.getElementById('lobby').style.display = 'block';
        document.getElementById('painel-chat').style.display = 'block';
    }

    function marcarPronto() {
        if (meuPapel === 'jogador') {
            socket.emit('marcarPronto');
            document.getElementById('btn-pronto').disabled = true;
            document.getElementById('btn-pronto').innerText = 'Aguardando oponente...';
        }
    }

    function desistir() {
        if (jogoIniciado && meuPapel === 'jogador' && confirm('Tem certeza que deseja desistir?')) {
            socket.emit('desistir');
        }
    }

    function oferecerEmpate() {
        if (!jogoIniciado || meuPapel !== 'jogador') return;
        console.log('Oferecendo empate...');
        socket.emit('oferecerEmpate');
    }

    function enviarMensagem() {
        const input = document.getElementById('input-mensagem');
        const msg = input.value.trim();
        if (msg) {
            socket.emit('enviarMensagem', msg);
            input.value = '';
        }
    }

    function voltarParaLobby() {
        jogoIniciado = false;
        document.getElementById('area-jogo').style.display = 'none';
        document.getElementById('lobby').style.display = 'block';
        document.getElementById('painel-historico').style.display = 'none';
        document.getElementById('btn-pronto').disabled = false;
        document.getElementById('btn-pronto').innerText = 'ESTOU PRONTO';
    }

    socket.on('connect', () => {
        meuSocketId = socket.id;
        document.getElementById('status-conexao').innerText = "✅ Conectado";
        console.log('Conectado ao servidor. Meu ID:', meuSocketId);
    });

    socket.on('disconnect', () => {
        document.getElementById('status-conexao').innerText = "❌ Desconectado";
    });

    socket.on('erro', (msg) => alert(msg));

    socket.on('definirPapel', (dados) => {
        meuPapel = dados.papel;
        if (meuPapel === 'jogador') {
            minhaCor = dados.cor;
            document.getElementById('minha-cor').innerText = (minhaCor === 'w') ? '⚪ Brancas' : '⚫ Pretas';
        } else {
            document.getElementById('minha-cor').innerText = '👀 Espectador';
        }
        console.log('Papel definido:', meuPapel, minhaCor);
    });

    socket.on('estadoLobby', (dados) => {
        const lobbyDiv = document.getElementById('lobby');
        const jogoDiv = document.getElementById('area-jogo');
        const infoSala = document.getElementById('info-sala');

        let html = `<p>Sala: <strong>${salaAtual}</strong> | Jogadores: ${dados.jogadoresInfo.length}/2`;
        if (dados.espectadores.length > 0) html += ` | Espectadores: ${dados.espectadores.length}`;
        html += '</p>';
        infoSala.innerHTML = html;

        let lista = '';
        dados.jogadoresInfo.forEach(j => {
            lista += `<li>👤 ${j.nome} (${j.cor === 'w' ? 'Brancas' : 'Pretas'}) ${j.pronto ? '✅' : '⏳'}</li>`;
        });
        dados.espectadores.forEach(e => {
            lista += `<li>👁️ ${e} (espectador)</li>`;
        });
        document.getElementById('lista-alunos').innerHTML = lista;

        if (dados.rodando) {
            lobbyDiv.style.display = 'none';
            jogoDiv.style.display = 'block';
            document.getElementById('painel-historico').style.display = 'block';
            jogoIniciado = true;
            if (tabuleiroVisual) tabuleiroVisual.resize();
        } else {
            lobbyDiv.style.display = 'block';
            jogoDiv.style.display = 'none';
            document.getElementById('painel-historico').style.display = 'none';
            document.getElementById('btn-pronto').disabled = false;
            document.getElementById('btn-pronto').innerText = 'ESTOU PRONTO';
        }
    });

    socket.on('iniciarPartida', (dados) => {
        minhaCor = dados.cor;
        jogoIniciado = true;
        if (minhaCor !== 'espectador') {
            document.getElementById('minha-cor').innerText = (minhaCor === 'w') ? '⚪ Brancas' : '⚫ Pretas';
        } else {
            document.getElementById('minha-cor').innerText = '👀 Espectador';
        }
        motorXadrez.load(dados.fen || 'start');
        tabuleiroVisual.position(motorXadrez.fen(), false);
        if (minhaCor !== 'espectador') {
            tabuleiroVisual.orientation(minhaCor === 'w' ? 'white' : 'black');
        } else {
            tabuleiroVisual.orientation('white');
        }
        atualizarStatus();
        console.log('Partida iniciada. Minha cor:', minhaCor);
    });

    socket.on('estadoAtual', (dados) => {
        motorXadrez.load(dados.fen);
        tabuleiroVisual.position(dados.fen);
        if (dados.historico) {
            document.getElementById('historico').innerHTML = dados.historico.map(l => `<div>${l}</div>`).join('');
        }
        if (dados.tempos) {
            document.getElementById('relogio-brancas').innerText = `⚪ ${formatarTempo(dados.tempos.w)}`;
            document.getElementById('relogio-pretas').innerText = `⚫ ${formatarTempo(dados.tempos.b)}`;
        }
        atualizarStatus();
    });

    socket.on('jogadaFeita', (dados) => {
        motorXadrez.load(dados.fen);
        tabuleiroVisual.position(dados.fen);
        if (dados.historico) {
            document.getElementById('historico').innerHTML = dados.historico.map(l => `<div>${l}</div>`).join('');
        }
        atualizarStatus();
    });

    socket.on('atualizarTempo', (tempos) => {
        document.getElementById('relogio-brancas').innerText = `⚪ ${formatarTempo(tempos.w)}`;
        document.getElementById('relogio-pretas').innerText = `⚫ ${formatarTempo(tempos.b)}`;
    });

    socket.on('fimDeJogo', (dados) => {
        alert(dados.mensagem);
        jogoIniciado = false;
        document.getElementById('status-jogo').innerHTML = dados.mensagem;
        setTimeout(() => {
            voltarParaLobby();
        }, 1000);
    });

    socket.on('novaMensagem', (msg) => {
        const div = document.getElementById('chat-mensagens');
        const hora = new Date(msg.timestamp).toLocaleTimeString();
        div.innerHTML += `<div><strong>${msg.remetente}</strong> <span class="badge">${hora}</span>: ${msg.texto}</div>`;
        div.scrollTop = div.scrollHeight;
    });

    socket.on('propostaEmpate', (dados) => {
        console.log('Evento propostaEmpate recebido:', dados);
        if (dados.para !== meuSocketId) {
            console.log('Proposta não é para mim, ignorando.');
            return;
        }
        if (confirm(`${dados.de} ofereceu empate. Aceitar?`)) {
            socket.emit('responderEmpate', { aceito: true, de: dados.de });
        } else {
            socket.emit('responderEmpate', { aceito: false, de: dados.de });
        }
    });

    socket.on('empateRecusado', (dados) => {
        alert(`${dados.por} recusou a oferta de empate.`);
    });

    // Configuração do Tabuleiro
    function aoComecarArrastar(source, piece, position, orientation) {
        if (!jogoIniciado || meuPapel !== 'jogador') return false;
        if (motorXadrez.game_over()) return false;
        if ((motorXadrez.turn() === 'w' && piece.search(/^b/) !== -1) ||
            (motorXadrez.turn() === 'b' && piece.search(/^w/) !== -1)) {
            return false;
        }
        if (motorXadrez.turn() !== minhaCor) return false;
        return true;
    }

    function aoSoltarPeca(source, target) {
        if (!jogoIniciado || meuPapel !== 'jogador') return 'snapback';
        let movimento = motorXadrez.move({
            from: source,
            to: target,
            promotion: 'q'
        });
        if (movimento === null) return 'snapback';
        socket.emit('fazerJogada', { from: source, to: target, promotion: 'q' });
        atualizarStatus();
    }

    function aposMovimento(oldPos, newPos) {
        tabuleiroVisual.position(motorXadrez.fen());
    }

    function atualizarStatus() {
        let statusHTML = '';
        let vez = motorXadrez.turn() === 'w' ? '⚪ Brancas' : '⚫ Pretas';
        document.getElementById('vez-atual').innerText = vez;

        if (motorXadrez.in_checkmate()) {
            statusHTML = '🏆 Xeque-Mate!';
        } else if (motorXadrez.in_draw()) {
            statusHTML = '🤝 Empate!';
        } else if (motorXadrez.in_check()) {
            statusHTML = '<span class="alerta-xeque">⚠️ REI EM XEQUE!</span>';
        } else {
            statusHTML = 'Partida em andamento';
        }
        document.getElementById('status-jogo').innerHTML = statusHTML;
    }

    let config = {
        draggable: true,
        position: 'start',
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
        onDragStart: aoComecarArrastar,
        onDrop: aoSoltarPeca,
        onSnapEnd: aposMovimento
    };
    tabuleiroVisual = Chessboard('meu-tabuleiro', config);

    document.getElementById('input-mensagem').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') enviarMensagem();
    });
</script>
</body>
</html>
