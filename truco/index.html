<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Truco Paulista ♣️ — Laboratório de Computação</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        /* (todo o CSS anterior permanece igual) */
        /* ... */
        .modal-content {
            background: #1e2b1a;
            color: #f0e6d2;
            border: 2px solid #b58a4a;
        }
        .modal-header {
            border-bottom: 1px solid #b58a4a;
        }
        .modal-footer {
            border-top: 1px solid #b58a4a;
        }
        .btn-historico {
            background: #6c757d;
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: bold;
            box-shadow: 0 6px 0 #3e4a52;
        }
        /* Estilo para log no modal */
        .log-partida {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            background: #0f1a0e;
            padding: 10px;
            border-radius: 8px;
            color: #d4c9a6;
        }
    </style>
</head>
<body>
<!-- (todo o HTML até os botões permanece igual) -->

<!-- Modal Histórico da Partida -->
<div class="modal fade" id="modalHistorico" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">📜 Histórico da Partida</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="conteudo-historico"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // --- Variáveis globais (mantidas) ---
    const socket = io("https://motor-truco.onrender.com");
    let minhaSala = '', minhasCartas = [], meuId = '', modoJogo = '1x1';
    let jogadoresSala = [];
    let equipeDoJogador = null;
    let minhaVez = false;
    let cartaJogadaTemp = null;

    let historicoRodadas = [];       // mão atual (mini cartas)
    let historicoPartida = [];       // acumula todas as mãos da partida
    let numeroMaoAtual = 1;

    // --- Funções auxiliares (showToast, naipeIcone, etc.) mantidas ---
    function showToast(message, type = 'info') { /* ... */ }
    function naipeIcone(naipe) { /* ... */ }

    // --- Histórico da mão atual (mini cartas) ---
    function renderizarHistorico() { /* ... */ }
    function adicionarCartaAoHistorico(carta, equipe) { /* ... */ }
    function definirVencedorRodadaHistorico(equipeVencedora) { /* ... */ }
    function limparHistorico() { historicoRodadas = []; renderizarHistorico(); }

    // --- Histórico completo da partida (modal) ---
    function adicionarMaoAoHistorico(vencedorMao, pontosGanhos, apostaFinal) {
        historicoPartida.push({
            numero: numeroMaoAtual++,
            vencedor: vencedorMao,
            pontosGanhos: pontosGanhos,
            aposta: apostaFinal,
            rodadas: historicoRodadas.map(r => ({
                cartas: r.cartas.map(c => ({ carta: {...c.carta}, equipe: c.equipe })),
                vencedor: r.vencedor
            }))
        });
    }

    function mostrarHistoricoPartida() {
        const modal = new bootstrap.Modal(document.getElementById('modalHistorico'));
        const conteudo = document.getElementById('conteudo-historico');
        if (historicoPartida.length === 0) {
            conteudo.innerHTML = '<p class="text-center text-warning">Nenhuma mão foi concluída ainda.</p>';
        } else {
            let html = '<div class="log-partida">';
            historicoPartida.forEach(mao => {
                html += `<div class="mb-3 pb-2 border-bottom border-secondary">`;
                html += `<strong>Mão ${mao.numero}</strong> — Vencedor: Equipe ${mao.vencedor} (+${mao.pontosGanhos} pts) | Aposta: ${mao.aposta}<br>`;
                mao.rodadas.forEach((rodada, idx) => {
                    html += `&nbsp;&nbsp;Rodada ${idx+1}: `;
                    rodada.cartas.forEach(c => {
                        html += `${c.carta.valor}${naipeIcone(c.carta.naipe)} (${c.equipe}) `;
                    });
                    if (rodada.vencedor) {
                        html += `→ 🏆 ${rodada.vencedor}`;
                    } else {
                        html += `→ Empate`;
                    }
                    html += '<br>';
                });
                html += `</div>`;
            });
            html += '</div>';
            conteudo.innerHTML = html;
        }
        modal.show();
    }

    // --- Socket Events ---
    socket.on('connect', () => { /* ... */ });
    socket.on('disconnect', () => { /* ... */ });

    function entrarSala() { /* ... */ }
    function marcarPronto() { /* ... */ }

    socket.on('atualizarLobby', ({ jogadores, modo, estado }) => { /* ... */ });

    socket.on('jogoIniciado', () => {
        telaLobby.style.display = 'none';
        telaJogo.style.display = 'block';
        // 🆕 Ao iniciar um novo jogo, limpa o histórico da partida
        historicoPartida = [];
        numeroMaoAtual = 1;
    });

    // ... (demais funções de posicionamento, renderização de cartas, etc.)

    socket.on('iniciarMao', ({ cartas, vira, pontuacao, equipe }) => {
        // ... (código existente)
        limparHistorico(); // limpa só o da mão atual
    });

    socket.on('cartaJogada', ({ jogadorId, carta, equipe }) => {
        // ... (código existente)
        adicionarCartaAoHistorico(carta, equipe);
    });

    socket.on('atualizarPlacarRodadas', ({ rodadasA, rodadasB }) => {
        atualizarPlacarMaos(rodadasA, rodadasB);
        // 🆕 Atualiza vencedor da última rodada no histórico da mão
        if (historicoRodadas.length > 0) {
            const ultima = historicoRodadas[historicoRodadas.length-1];
            if (!ultima.vencedor) {
                if (rodadasA > (historicoRodadas.slice(0,-1).reduce((a,r)=>a+(r.vencedor==='A'?1:0),0))) definirVencedorRodadaHistorico('A');
                else if (rodadasB > (historicoRodadas.slice(0,-1).reduce((a,r)=>a+(r.vencedor==='B'?1:0),0))) definirVencedorRodadaHistorico('B');
            }
        }
    });

    socket.on('fimDeMao', ({ pontuacao, vencedorMao, pontosGanhos }) => {
        document.getElementById('placar-equipe-a').innerText = pontuacao.A || 0;
        document.getElementById('placar-equipe-b').innerText = pontuacao.B || 0;
        showToast(`Equipe ${vencedorMao} venceu a mão (+${pontosGanhos} pontos)`, 'success');
        atualizarPlacarMaos(0, 0);
        adicionarMaoAoHistorico(vencedorMao, pontosGanhos, parseInt(document.getElementById('valor-aposta').innerText));
        limparHistorico();
    });

    socket.on('fimDeJogo', ({ vencedor }) => {
        showToast(`🏆 Equipe ${vencedor} venceu o jogo!`, 'success');
        telaJogo.style.display = 'none';
        telaLobby.style.display = 'block';
        document.getElementById('btn-pronto').disabled = false;
        document.getElementById('btn-pronto').innerText = 'ESTOU PRONTO';
        // Exibe o histórico acumulado (não limpa aqui)
        setTimeout(() => mostrarHistoricoPartida(), 500);
    });

    // ... (restante dos eventos de truco, erro, etc.)

    function pedirTruco() { socket.emit('pedirTruco'); }
    function responderTruco(aceitou) { /* ... */ }
    function aumentarTruco() { /* ... */ }
    function desistir() { /* ... */ }

    socket.on('erro', (msg) => {
        showToast(msg, 'danger');
        if (cartaJogadaTemp) { minhasCartas.push(cartaJogadaTemp); cartaJogadaTemp = null; renderizarMinhasCartas(); }
    });
</script>
</body>
</html>
