<script>
    const socket = io("https://motor-truco.onrender.com");
    let minhaSala = '', minhasCartas = [], meuId = '', modoJogo = '1x1';
    let jogadoresSala = [];
    let equipeDoJogador = null;

    const statusConexao = document.getElementById('status-conexao');
    const telaLogin = document.getElementById('tela-login');
    const telaLobby = document.getElementById('tela-lobby');
    const telaJogo = document.getElementById('tela-jogo');

    socket.on('connect', () => { meuId = socket.id; statusConexao.innerHTML = '✅ Conectado'; });
    socket.on('disconnect', () => { statusConexao.innerHTML = '❌ Desconectado'; });

    function entrarSala() {
        const apelido = document.getElementById('input-apelido').value.trim();
        const sala = document.getElementById('input-sala').value.trim();
        modoJogo = document.getElementById('select-modo').value;
        if (!apelido || !sala) return alert('Preencha nome e sala!');
        minhaSala = sala;
        socket.emit('entrarSala', { apelido, sala, modo: modoJogo });
        telaLogin.style.display = 'none';
        telaLobby.style.display = 'block';
    }

    function marcarPronto() {
        socket.emit('marcarPronto');
        document.getElementById('btn-pronto').disabled = true;
        document.getElementById('btn-pronto').innerText = 'Aguardando...';
    }

    socket.on('atualizarLobby', ({ jogadores, modo, estado }) => {
        jogadoresSala = jogadores;
        modoJogo = modo;
        const capacidade = modo === '2x2' ? 4 : 2;
        document.getElementById('info-sala').innerHTML = `Sala: ${minhaSala} | Modo: ${modo} | ${jogadores.length}/${capacidade}`;
        let lista = '';
        jogadores.forEach(j => {
            lista += `<li class="list-group-item d-flex justify-content-between bg-dark text-white">
                <span>👤 ${j.nome} <span class="badge ${j.equipe==='A'?'bg-primary':'bg-danger'}">Eq ${j.equipe}</span></span>
                ${j.pronto ? '✅' : '⏳'}
            </li>`;
        });
        document.getElementById('lista-jogadores').innerHTML = lista;
        if (estado === 'jogando') {
            telaLobby.style.display = 'none';
            telaJogo.style.display = 'block';
        }
    });

    socket.on('jogoIniciado', () => {
        telaLobby.style.display = 'none';
        telaJogo.style.display = 'block';
    });

    function posicionarJogadores(jogadores, modo) {
        ['top','right','bottom','left'].forEach(pos => document.getElementById(`jogador-${pos}`).innerHTML = '');
        if (modo === '1x1') {
            const jogTop = jogadores.find(j => j.id !== meuId) || jogadores[0];
            const jogBottom = jogadores.find(j => j.id === meuId) || jogadores[1];
            if (jogTop) preencherCadeira('top', jogTop);
            if (jogBottom) preencherCadeira('bottom', jogBottom);
        } else {
            const equipeA = jogadores.filter(j => j.equipe === 'A');
            const equipeB = jogadores.filter(j => j.equipe === 'B');
            if (equipeA[0]) preencherCadeira('top', equipeA[0]);
            if (equipeA[1]) preencherCadeira('bottom', equipeA[1]);
            if (equipeB[0]) preencherCadeira('left', equipeB[0]);
            if (equipeB[1]) preencherCadeira('right', equipeB[1]);
        }
    }

    function preencherCadeira(pos, jogador) {
        const div = document.getElementById(`jogador-${pos}`);
        div.innerHTML = `
            <div class="nome">${jogador.nome}</div>
            <span class="equipe-badge ${jogador.equipe==='A'?'equipe-A':'equipe-B'}"></span>
            <div class="vez-indicator" id="vez-${jogador.id}"></div>
        `;
    }

    function atualizarPlacarMaos(rodadasA, rodadasB) {
        for (let i = 1; i <= 3; i++) {
            const elA = document.getElementById(`mao-A-${i}`);
            const elB = document.getElementById(`mao-B-${i}`);
            if (elA) elA.classList.toggle('mao-vencida-A', i <= rodadasA);
            if (elB) elB.classList.toggle('mao-vencida-B', i <= rodadasB);
        }
    }

    socket.on('iniciarMao', ({ cartas, vira, pontuacao, equipe }) => {
        minhasCartas = cartas;
        equipeDoJogador = equipe;
        document.getElementById('placar-equipe-a').innerText = pontuacao.A || 0;
        document.getElementById('placar-equipe-b').innerText = pontuacao.B || 0;
        atualizarPlacarMaos(0, 0);
        const viraDiv = document.getElementById('carta-vira');
        viraDiv.className = `carta-vira-exibida ${vira.naipe}`;
        viraDiv.innerHTML = `${vira.valor} ${naipeIcone(vira.naipe)}`;
        posicionarJogadores(jogadoresSala, modoJogo);
        renderizarMinhasCartas();
        document.getElementById('cartas-mesa').innerHTML = '';
        document.getElementById('acoes-truco').style.display = 'none';
    });

    function naipeIcone(naipe) {
        return { 'paus':'♣', 'copas':'♥', 'espadas':'♠', 'ouros':'♦' }[naipe] || '';
    }

    function renderizarMinhasCartas() {
        const container = document.getElementById('minhas-cartas');
        container.innerHTML = '';
        minhasCartas.forEach(carta => {
            const div = document.createElement('div');
            div.className = `carta-mao ${carta.naipe}`;
            div.innerHTML = `${carta.valor} ${naipeIcone(carta.naipe)}`;
            div.onclick = () => jogarCarta(carta);
            container.appendChild(div);
        });
    }

    function jogarCarta(carta) {
        minhasCartas = minhasCartas.filter(c => !(c.valor===carta.valor && c.naipe===carta.naipe));
        renderizarMinhasCartas();
        socket.emit('jogarCarta', carta);
    }

    socket.on('cartaJogada', ({ jogadorId, carta, equipe }) => {
        const mesa = document.getElementById('cartas-mesa');
        const div = document.createElement('div');
        div.className = `carta-mesa ${carta.naipe} equipe-${equipe}-border`;
        div.innerHTML = `${carta.valor} ${naipeIcone(carta.naipe)}`;
        const selo = document.createElement('span');
        selo.className = `carta-equipe-selo selo-${equipe}`;
        selo.innerText = equipe;
        div.appendChild(selo);
        mesa.appendChild(div);
    });

    socket.on('novaRodada', () => {
        document.getElementById('cartas-mesa').innerHTML = '';
    });

    socket.on('atualizarVez', ({ jogadorId }) => {
        const jogador = jogadoresSala.find(j => j.id === jogadorId);
        if (jogador) document.getElementById('nome-vez').innerText = jogador.nome;
        document.querySelectorAll('.vez-indicator').forEach(el => el.innerHTML = '');
        const vezEl = document.getElementById(`vez-${jogadorId}`);
        if (vezEl) vezEl.innerHTML = '🎲 VEZ';
    });

    socket.on('atualizarPlacarRodadas', ({ rodadasA, rodadasB }) => atualizarPlacarMaos(rodadasA, rodadasB));

    socket.on('fimDeMao', ({ pontuacao }) => {
        document.getElementById('placar-equipe-a').innerText = pontuacao.A || 0;
        document.getElementById('placar-equipe-b').innerText = pontuacao.B || 0;
        atualizarPlacarMaos(0, 0);
    });

    socket.on('fimDeJogo', () => {
        telaJogo.style.display = 'none';
        telaLobby.style.display = 'block';
        document.getElementById('btn-pronto').disabled = false;
        document.getElementById('btn-pronto').innerText = 'ESTOU PRONTO';
    });

    function pedirTruco() { socket.emit('pedirTruco'); }
    socket.on('trucoPedido', () => document.getElementById('acoes-truco').style.display = 'block');
    function responderTruco(aceitou) {
        socket.emit('responderTruco', { aceitou });
        document.getElementById('acoes-truco').style.display = 'none';
    }
    socket.on('trucoAceito', ({ novaAposta }) => alert(`Truco aceito! Mão vale ${novaAposta} pontos.`));
    function desistir() { if (confirm('Desistir da mão?')) socket.emit('desistir'); }
    socket.on('erro', msg => alert('❌ ' + msg));
</script>
