<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Truco Paulista ♣️ — Laboratório de Computação</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #1e3c72; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; font-family: 'Segoe UI', Arial, sans-serif; }
        .game-container { background: rgba(255,255,255,0.95); border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); padding: 25px; }
        .carta { width: 80px; height: 112px; background: white; border-radius: 10px; box-shadow: 0 5px 10px rgba(0,0,0,0.3); display: inline-flex; justify-content: center; align-items: center; margin: 5px; font-size: 28px; font-weight: bold; transition: transform 0.2s; cursor: pointer; }
        .carta:hover { transform: translateY(-10px); }
        .carta.ouros, .carta.copas { color: #dc3545; }
        .carta.paus, .carta.espadas { color: #212529; }
        .carta.vira { border: 4px solid #ffc107; }
        .carta.manilha { border: 4px solid #28a745; }
        .mesa { min-height: 130px; background: rgba(0,100,0,0.1); border-radius: 15px; padding: 15px; margin: 10px 0; }
        .jogador-tag { background: #0d6efd; color: white; padding: 5px 15px; border-radius: 30px; }
        .equipe-a { background: #0d6efd; }
        .equipe-b { background: #dc3545; }
        .btn-truco { background: #ffc107; border: none; color: #000; font-weight: bold; }
        .btn-truco:hover { background: #e0a800; }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="text-center mb-4">
            <h1 class="text-white">🃏 Truco Paulista</h1>
            <p class="text-light">Laboratório de Computação</p>
            <a href="regras.html" target="_blank" class="btn btn-outline-light">📖 Ver Regras</a>
        </div>

        <div id="tela-login" class="game-container">
            <h3 class="text-center mb-3">Entrar na Sala</h3>
            <div class="mb-3">
                <input type="text" class="form-control" id="input-apelido" placeholder="Seu Nome">
            </div>
            <div class="mb-3">
                <input type="text" class="form-control" id="input-sala" placeholder="Nome da Sala">
            </div>
            <div class="mb-3">
                <select class="form-select" id="select-modo">
                    <option value="1x1">1x1 (Individual)</option>
                    <option value="2x2">2x2 (Duplas)</option>
                </select>
            </div>
            <button class="btn btn-primary w-100" onclick="entrarSala()">Conectar</button>
        </div>

        <div id="tela-lobby" class="game-container" style="display: none;">
            <h3 class="text-center">🕹️ Lobby</h3>
            <div id="info-sala" class="alert alert-info"></div>
            <ul id="lista-jogadores" class="list-group mb-3"></ul>
            <button id="btn-pronto" class="btn btn-success w-100" onclick="marcarPronto()">ESTOU PRONTO</button>
        </div>

        <div id="tela-jogo" class="game-container" style="display: none;">
            <div class="row mb-3">
                <div class="col-6"><h4>Equipe A: <span id="placar-equipe-a">0</span></h4></div>
                <div class="col-6 text-end"><h4>Equipe B: <span id="placar-equipe-b">0</span></h4></div>
            </div>
            <div class="mesa" id="cartas-oponente"></div>
            <div class="text-center mb-3">
                <span class="badge bg-warning text-dark p-2 fs-6">🃏 Vira: <span id="carta-vira"></span></span>
                <span class="badge bg-success p-2 fs-6">⭐ Manilhas: <span id="manilhas-info"></span></span>
            </div>
            <div class="mesa" id="cartas-mesa"></div>
            <div class="mt-3">
                <h5>Suas Cartas:</h5>
                <div id="minhas-cartas" class="d-flex justify-content-center flex-wrap"></div>
            </div>
            <div class="d-flex justify-content-center gap-2 mt-4">
                <button class="btn btn-truco" onclick="pedirTruco()">TRUCO!</button>
                <button class="btn btn-danger" onclick="desistir()">Desistir</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io("https://motor-truco.onrender.com");
        let minhaSala, minhasCartas, estadoAtual = {};

        function entrarSala() {
            const apelido = document.getElementById('input-apelido').value.trim();
            const sala = document.getElementById('input-sala').value.trim();
            const modo = document.getElementById('select-modo').value;
            if (!apelido || !sala) return alert('Preencha nome e sala!');
            minhaSala = sala;
            socket.emit('entrarSala', { apelido, sala, modo });
            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('tela-lobby').style.display = 'block';
        }

        socket.on('atualizarLobby', ({ jogadores, modo, estado }) => {
            document.getElementById('info-sala').innerHTML = `Sala: ${minhaSala} | Modo: ${modo} | Jogadores: ${jogadores.length}/${modo === '2x2' ? 4 : 2}`;
            let lista = '';
            jogadores.forEach(j => {
                lista += `<li class="list-group-item d-flex justify-content-between">
                    <span>👤 ${j.nome} <span class="badge ${j.equipe === 'A' ? 'bg-primary' : 'bg-danger'}">Equipe ${j.equipe}</span></span>
                </li>`;
            });
            document.getElementById('lista-jogadores').innerHTML = lista;
        });

        socket.on('jogoIniciado', () => {
            document.getElementById('tela-lobby').style.display = 'none';
            document.getElementById('tela-jogo').style.display = 'block';
        });

        socket.on('iniciarMao', ({ cartas, vira, manilhas, pontuacao, equipe }) => {
            minhasCartas = cartas;
            atualizarPlacar(pontuacao);
            document.getElementById('carta-vira').innerText = `${vira.valor} de ${vira.naipe}`;
            document.getElementById('manilhas-info').innerText = manilhas.map(m => `${m.valor} de ${m.naipe}`).join(', ');
            renderizarMinhasCartas();
        });

        function renderizarMinhasCartas() {
            const container = document.getElementById('minhas-cartas');
            container.innerHTML = '';
            minhasCartas.forEach(carta => {
                const div = document.createElement('div');
                div.className = `carta ${carta.naipe}`;
                div.innerHTML = `${carta.valor} ${naipeIcone(carta.naipe)}`;
                div.onclick = () => jogarCarta(carta);
                container.appendChild(div);
            });
        }

        function naipeIcone(naipe) {
            const icones = { 'paus': '♣', 'copas': '♥', 'espadas': '♠', 'ouros': '♦' };
            return icones[naipe] || '';
        }

        function jogarCarta(carta) {
            socket.emit('jogarCarta', carta);
        }

        socket.on('cartaJogada', ({ jogadorId, carta }) => {
            const mesa = document.getElementById('cartas-mesa');
            mesa.innerHTML += `<div class="carta ${carta.naipe}">${carta.valor} ${naipeIcone(carta.naipe)}</div>`;
        });

        socket.on('fimDeMao', ({ pontuacao, vencedorMao, pontosGanhos }) => {
            atualizarPlacar(pontuacao);
            alert(`Equipe ${vencedorMao} venceu a mão e ganhou ${pontosGanhos} ponto(s)!`);
        });

        function atualizarPlacar(pontuacao) {
            document.getElementById('placar-equipe-a').innerText = pontuacao.A || 0;
            document.getElementById('placar-equipe-b').innerText = pontuacao.B || 0;
        }

        function pedirTruco() { socket.emit('pedirTruco'); }
        function desistir() { socket.emit('desistir'); }
    </script>
</body>
</html>
