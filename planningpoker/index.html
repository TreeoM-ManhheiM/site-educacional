<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning Poker Lógico</title>
  <style>
    body {
      margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a; color: white; text-align: center;
    }
    #lobby, #painel-poker { max-width: 900px; margin: auto; padding: 20px; }
    
    .mesa-votos {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;
      background: #1e293b; padding: 30px; border-radius: 15px;
      min-height: 150px; margin: 20px 0; border: 2px dashed #475569;
    }
    
    .carta {
      width: 70px; height: 110px; background: #f8fafc; color: #1e293b;
      border-radius: 10px; font-weight: bold; font-size: 24px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); user-select: none; transition: all 0.2s;
    }
    
    .carta.oculta {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white; border: 3px solid #ffffff;
    }
    .carta.oculta::after { content: "❓"; font-size: 20px; }

    .meu-baralho { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 30px; }
    .meu-baralho .carta { cursor: pointer; }
    .meu-baralho .carta:hover { transform: translateY(-10px); background: #e2e8f0; }
    .meu-baralho .carta.selecionada {
      background: #fbbf24; color: #1e293b; transform: translateY(-15px);
      box-shadow: 0 0 15px #fbbf24;
    }

    .status-voto { font-size: 14px; margin-top: 8px; color: #94a3b8; font-weight: bold; }
    .player-card { display: flex; flex-direction: column; align-items: center; background: #1e293b; padding: 15px; border-radius: 12px; min-width: 90px;}

    button, .btn-link {
      background: #3b82f6; color: white; border: none; padding: 12px 24px;
      border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin: 5px;
      display: inline-block; text-decoration: none;
    }
    button:hover, .btn-link:hover { background: #2563eb; }
    .btn-revelar { background: #10b981; }
    .btn-revelar:hover { background: #059669; }
    .btn-reset { background: #ef4444; }
    .btn-reset:hover { background: #dc2626; }
    .btn-chutar { background: #dc2626; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; margin-top: 8px; }
    .btn-manual { background: #8b5cf6; }
    .btn-manual:hover { background: #7c3aed; }

    #estatisticas {
      padding: 20px; border-radius: 12px; display: none; margin: 20px 0; border: 2px solid;
    }
    input { padding: 12px; border-radius: 8px; border: none; margin: 5px; width: 200px; font-size: 16px; }
    
    #painel-professor {
      background: #1e293b; border: 2px solid #3b82f6; padding: 20px; border-radius: 15px; margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div id="lobby">
    <h1 style="color: #60a5fa; font-size: 36px;">Planning Poker Lógico EE. Oito de Abril 2026</h1>
    <p>Insira seus dados ou escaneie o QR Code do professor para entrar na sala.</p>
    <br>
    <input type="text" id="nick" placeholder="Seu Nome/Apelido">
    <input type="text" id="sala" placeholder="Nome da Sala (ex: Squad-A)">
    <br><br>
    <button onclick="entrar()">ENTRAR NA SALA</button>
    <br><br>
    <a href="regras.html" class="btn-link btn-manual" target="_blank">📖 Ver Manual de Regras e Cenários</a>
  </div>

  <div id="painel-poker" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; max-width: 900px; margin: auto;">
      <h2 id="titulo-sala" style="color: #60a5fa; margin: 0;">Sala: -</h2>
      <a href="regras.html" class="btn-link btn-manual" style="padding: 8px 16px; font-size: 14px;" target="_blank">📖 Manual Técnico</a>
    </div>
    
    <div id="painel-professor" style="display: none;">
      <h3 style="color: #fbbf24; margin-top: 0;">👑 Painel do Moderador</h3>
      <div style="display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 40px;">
        <div>
          <button class="btn-revelar" onclick="socket.emit('revelarVotos')">👁️ Revelar Votos</button>
          <button class="btn-reset" onclick="socket.emit('reiniciarRodada')">🔄 Nova Rodada</button>
        </div>
        <div id="qr-container" style="background: white; padding: 10px; border-radius: 10px; text-align: center;">
          <div id="qrcode"></div>
          <small style="color: #1e293b; font-weight: bold; display: block; margin-top: 5px;">Aponte para entrar!</small>
        </div>
      </div>
    </div>

    <div id="estatisticas"></div>

    <h3>Mesa de Estimativas</h3>
    <div class="mesa-votos" id="mesa"></div>

    <h3>Direitos Reservados EE. Oito de Abril 2026</h3>
    <div class="meu-baralho" id="meu-baralho"></div>
  </div>

  <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
  <script>
    const socket = io("https://motor-planningpoker.onrender.com", {
      transports: ["polling"],
      upgrade: true
    });

    const cartasFibonacci = ['0', '1', '2', '3', '5', '8', '13', '21', '34', '?', '☕'];
    let meuVoto = null;
    let salaRevelada = false;

    window.onload = function() {
      const parametros = new URLSearchParams(window.location.search);
      const salaUrl = parametros.get('sala');
      if (salaUrl) {
        document.getElementById('sala').value = salaUrl;
        document.getElementById('sala').style.background = '#e2e8f0';
      }
    };

    function entrar() {
      const apelido = document.getElementById('nick').value;
      const sala = document.getElementById('sala').value || "Geral";
      if (!apelido) return alert("Por favor, digite seu nome!");

      socket.emit('entrarSala', { apelido, sala });
      
      document.getElementById('lobby').style.display = 'none';
      document.getElementById('painel-poker').style.display = 'block';
      document.getElementById('titulo-sala').innerText = `Sala: ${sala}`;
      
      gerarMeuBaralho();
    }

    function gerarMeuBaralho() {
      const container = document.getElementById('meu-baralho');
      container.innerHTML = cartasFibonacci.map(v => `
        <div class="carta" id="my-card-${v}" onclick="votar('${v}')">${v}</div>
      `).join('');
    }

    function votar(valor) {
      if (salaRevelada) return alert("A rodada acabou! Peça ao professor para iniciar uma nova rodada.");
      
      const cartas = document.querySelectorAll('.meu-baralho .carta');
      cartas.forEach(c => c.classList.remove('selecionada'));

      if (meuVoto === valor) {
        meuVoto = null; 
      } else {
        meuVoto = valor;
        document.getElementById(`my-card-${valor}`).classList.add('selecionada');
      }

      socket.emit('votar', valor);
    }

    function renderizarMesa(sala) {
      salaRevelada = sala.revelado;
      const mesa = document.getElementById('mesa');
      const souModerador = (sala.moderador === socket.id);

      if (souModerador) {
        document.getElementById('painel-professor').style.display = 'block';
        const urlAcesso = `${window.location.origin}${window.location.pathname}?sala=${encodeURIComponent(document.getElementById('sala').value)}`;
        document.getElementById('qrcode').innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=${encodeURIComponent(urlAcesso)}" alt="QR Code">`;
      } else {
        document.getElementById('painel-professor').style.display = 'none';
      }
      
      mesa.innerHTML = sala.jogadores.map(j => {
        let classeCarta = "carta";
        let conteudoCarta = j.voto || "";
        let statusTexto = j.voto ? '✅ Votou' : '⏳ Pensando...';
        let corStatus = j.voto ? '#10b981' : '#94a3b8';
        
        let ehLider = (j.id === sala.moderador);
        let nomeExibicao = ehLider ? `👑 ${j.nome}` : j.nome;

        if (j.voto && !sala.revelado) {
          classeCarta = "carta oculta";
          conteudoCarta = "";
        } else if (!j.voto) {
          classeCarta = "carta";
          conteudoCarta = "💤"; 
        }

        let botaoChutar = "";
        if (souModerador && j.id !== socket.id) {
          botaoChutar = `<button class="btn-chutar" onclick="socket.emit('chutarJogador', '${j.id}')">❌ Chutar</button>`;
        }

        return `
          <div class="player-card">
            <div class="${classeCarta}">${conteudoCarta}</div>
            <div style="font-weight: bold; margin-top: 10px; color: ${ehLider ? '#fbbf24' : 'white'};">${nomeExibicao}</div>
            <div class="status-voto" style="color: ${corStatus};">${statusTexto}</div>
            ${botaoChutar}
          </div>
        `;
      }).join('');
    }

    socket.on('atualizarSala', (sala) => {
      if (!sala.revelado) {
          document.getElementById('estatisticas').style.display = 'none';
      }
      renderizarMesa(sala);
    });

    socket.on('votosRevelados', ({ sala, stats }) => {
      renderizarMesa(sala);
      
      const painelStats = document.getElementById('estatisticas');
      painelStats.style.display = 'block';
      
      if (stats.consenso) {
        painelStats.innerHTML = `
          <div style="text-align: center;">
            <span style="font-size: 32px;">🎉</span>
            <h3 style="color: #10b981; margin: 5px 0;">Consenso Geral Atingido!</h3>
            <p style="margin: 5px 0;">Todos os votos válidos estão alinhados em: <strong>${stats.media}</strong> pontos.</p>
          </div>
        `;
        painelStats.style.borderColor = "#10b981";
        painelStats.style.background = "rgba(16, 185, 129, 0.15)";
      } else {
        let nomesMenor = stats.jogadoresMenor.join(', ');
        let nomesMaior = stats.jogadoresMaior.join(', ');

        painelStats.innerHTML = `
          <div style="text-align: left;">
            <h3 style="color: #fbbf24; margin-top: 0; display: flex; align-items: center; gap: 10px;">
              🗣️ Momento de Debate Pedagógico (Média da Mesa: ${stats.media})
            </h3>
            <p style="color: #94a3b8; font-size: 14px; margin: 0 0 15px 0;">
              Metodologia de Gestão: Identificamos visões divergentes. Os extremos devem justificar seus pontos de vista técnico/gerencial:
            </p>
            
            <div style="background: rgba(59, 130, 246, 0.12); border-left: 5px solid #3b82f6; padding: 12px; margin-bottom: 12px; border-radius: 0 8px 8px 0;">
              <strong style="color: #60a5fa;">📉 Visão Otimista / Pragmática (Voto ${stats.menorVoto}):</strong><br>
              <span style="color: #ffffff; font-weight: bold;">${nomesMenor}</span> deve(m) explicar por que enxerga(m) a execução deste desafio como algo simples, rápido ou de baixo custo.
            </div>

            <div style="background: rgba(239, 68, 68, 0.12); border-left: 5px solid #ef4444; padding: 12px; border-radius: 0 8px 8px 0;">
              <strong style="color: #f87171;">📈 Visão Analítica / De Risco (Voto ${stats.maiorVoto}):</strong><br>
              <span style="color: #ffffff; font-weight: bold;">${nomesMaior}</span> deve(m) alertar a equipe sobre os riscos ocultos, complexidade técnica (banco de dados, integrações) ou custos operacionais envolvidos.
            </div>

            <p style="text-align: center; margin: 15px 0 0 0; font-size: 13px; color: #fbbf24; font-weight: bold;">
              💡 Após ouvirem os argumentos, o moderador pode abrir uma "Nova Rodada" para ver se a turma chega ao consenso!
            </p>
          </div>
        `;
        painelStats.style.borderColor = "#fbbf24";
        painelStats.style.background = "rgba(251, 191, 36, 0.06)";
      }
    });

    socket.on('rodadaReiniciada', (sala) => {
      meuVoto = null;
      document.getElementById('estatisticas').style.display = 'none';
      gerarMeuBaralho(); 
      renderizarMesa(sala);
    });

    socket.on('voceFoiChutado', () => {
      alert("Você foi removido da sala pelo moderador.");
      window.location.href = window.location.origin + window.location.pathname;
    });
  </script>
</body>
</html>
